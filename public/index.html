<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה לכפרות — נוף הגליל</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div class="topbar">
  <div>
    <h1 id="pageTitle">🐔 הרשמה לכפרות</h1>
    <div class="topbar-subtitle" id="pageSubtitle"></div>
  </div>
  <span class="badge" id="topBadge"></span>
</div>
<div class="wrap" id="app"><div class="loading">טוען…</div></div>

<!--
  מסך התשלום (נדרים פלוס, שיטה 3) קבוע ב-DOM מחוץ ל-#app בכוונה: render()
  מחליף את כל תוכן #app בכל ניווט, וזה היה הורס ויוצר מחדש את ה-iframe/המאזין
  בכל פעם — בניגוד מפורש לכלל של נדרים פלוס: "רישום המאזין וטעינת ה-src
  חייבים לקרות פעם אחת בלבד בחיי הדף, אחרת כל תוצאת עסקה מטופלת פעמיים".
-->
<div class="wrap" id="paymentScreen" style="display:none">
  <button class="ghost" id="paymentBack">← חזרה</button>
  <div class="card">
    <h2>תשלום</h2>
    <div id="paymentHeader"></div>
    <div id="paymentLoading" class="loading">מחשב יתרה…</div>
    <div id="paymentNoBalance" class="success" style="display:none">אין יתרת חוב פתוחה — תודה!</div>
    <div id="paymentHasBalance" style="display:none">
      <div class="total-row"><span>סה"כ יתרה לתשלום</span><span id="paymentAmountDisplay"></span></div>
      <label for="paymentAmountInput">סכום לתשלום כעת (אפשר לשלם רק חלק מהסכום)</label>
      <input type="number" id="paymentAmountInput" min="1" step="1">
      <div class="spacer"></div>
      <button class="primary" id="paymentContinueBtn">המשך לתשלום</button>
      <div id="paymentError" class="error" style="display:none"></div>
      <div id="paymentFrameWrap" style="display:none;margin-top:16px">
        <iframe id="NedarimFrame" allow="payment" scrolling="no"
                style="width:100%;border:none;height:0"></iframe>
      </div>
      <div id="paymentSuccess" class="success" style="display:none"></div>
      <div id="paymentSkipSection">
        <div class="spacer"></div>
        <button class="ghost" id="paymentSkipLink">דלג על התשלום כרגע (שלם אחר כך)</button>
        <div id="paymentSkipNotice" class="notice" style="display:none"></div>
        <button class="secondary" id="paymentSkipContinueBtn" style="display:none">המשך לאזור האישי</button>
      </div>
    </div>
  </div>
</div>

<script>
const GENDER_LABEL = { male: 'זכרים', female: 'נקבות' };
const STATUS_LABEL = { paid: 'שולם', partial: 'שולם חלקית', unpaid: 'לא שולם' };

const state = {
  phone: '',
  normalizedPhone: '',
  isFirstTime: null,
  publicSettings: null,
  slots: [],
  registerItems: [],
  otpCooldownUntil: 0,
};

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'שגיאה לא צפויה.');
    err.data = data;
    throw err;
  }
  return data;
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render(html) {
  document.getElementById('app').innerHTML = html;
}

function money(n) {
  return `₪${Number(n).toLocaleString('he-IL', { maximumFractionDigits: 0 })}`;
}

function redemptionStatusText(quantity, quantityRedeemed) {
  if (quantityRedeemed <= 0) return 'עוד לא קיבלת את העופות';
  if (quantityRedeemed >= quantity) return `קיבלת כבר את כל ${quantity} העופות`;
  return `קיבלת כבר ${quantityRedeemed} מתוך ${quantity} עופות`;
}

// ============== מסך 1: הזנת טלפון ==============

function screenPhone(errorMsg) {
  render(`
    <div class="card">
      <h2>${state.publicSettings?.orderTitle || 'הרשמה לכפרות'}</h2>
      <p class="hint">הזינו מספר טלפון כדי להיכנס למערכת.</p>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      ${!state.publicSettings?.registrationOpen ? `<div class="notice">${state.publicSettings?.closedRegistrationMessage || 'חלון ההזמנות סגור כרגע, ייפתח בקרוב.'} ניתן עדיין לצפות בהזמנה קיימת.</div>` : ''}
      <label for="phoneInput">מספר טלפון</label>
      <input type="tel" id="phoneInput" placeholder="05XXXXXXXX" value="${state.phone}" inputmode="numeric">
      <div class="spacer"></div>
      <button class="primary" id="phoneSubmit">המשך</button>
    </div>
  `);
  document.getElementById('phoneSubmit').onclick = onPhoneSubmit;
  document.getElementById('phoneInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') onPhoneSubmit(); });
}

async function onPhoneSubmit() {
  const phone = document.getElementById('phoneInput').value.trim();
  state.phone = phone;
  const btn = document.getElementById('phoneSubmit');
  btn.disabled = true; btn.textContent = 'בודק…';
  try {
    const res = await api('/check-phone', { method: 'POST', body: { phone } });
    state.normalizedPhone = res.normalizedPhone;
    state.isFirstTime = res.isFirstTime;
    if (res.isFirstTime) {
      goToScreen('personalArea');
      screenPersonalArea();
    } else if (res.alreadyVerified) {
      goToScreen('personalArea');
      screenPersonalArea();
    } else {
      await requestOtp();
      goToScreen('otp');
      screenOtp();
    }
  } catch (err) {
    screenPhone(err.message);
  }
}

// ============== מסך OTP ==============

async function requestOtp() {
  await api('/otp/request', { method: 'POST', body: { phone: state.phone } });
  state.otpCooldownUntil = Date.now() + 30000;
}

function screenOtp(errorMsg) {
  render(`
    <div class="card">
      <h2>אימות בסמס</h2>
      <p class="hint">נשלח קוד אימות ל-${state.normalizedPhone}. הזינו אותו כדי להיכנס לאזור האישי שלכם.</p>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      <label for="otpInput">קוד בן 6 ספרות</label>
      <input type="text" id="otpInput" inputmode="numeric" maxlength="6" placeholder="000000">
      <div class="spacer"></div>
      <button class="primary" id="otpSubmit">אמת קוד</button>
      <div class="spacer"></div>
      <button class="ghost" id="otpResend">שליחת קוד חוזרת</button>
      <button class="ghost" id="otpBack">חזרה</button>
    </div>
  `);
  document.getElementById('otpSubmit').onclick = onOtpSubmit;
  document.getElementById('otpBack').onclick = () => goBack();
  document.getElementById('otpResend').onclick = onOtpResend;
  document.getElementById('otpInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') onOtpSubmit(); });
}

async function onOtpResend() {
  if (Date.now() < state.otpCooldownUntil) return;
  try {
    await requestOtp();
    screenOtp();
    document.getElementById('otpResend').outerHTML = '<span class="hint">קוד חדש נשלח.</span>';
  } catch (err) {
    screenOtp(err.message);
  }
}

async function onOtpSubmit() {
  const code = document.getElementById('otpInput').value.trim();
  const btn = document.getElementById('otpSubmit');
  btn.disabled = true; btn.textContent = 'מאמת…';
  try {
    await api('/otp/verify', { method: 'POST', body: { phone: state.phone, code } });
    goToScreen('personalArea');
    screenPersonalArea();
  } catch (err) {
    screenOtp(err.message);
  }
}

// ============== הרשמה / הזמנה נוספת ==============

function ensureSlotsLoaded() {
  return api('/slots/open').then((slots) => { state.slots = slots; });
}

function findSlot(slotId) {
  return state.slots.find((s) => s.id === slotId) || null;
}

function priceForItem(item) {
  const slot = findSlot(item.slotId);
  if (!slot) return null;
  return item.gender === 'female' ? slot.priceFemale : slot.priceMale;
}

async function screenRegister() {
  await ensureSlotsLoaded();
  if (!state.registerItems.length && state.slots.length) {
    state.registerItems.push({ slotId: state.slots[0].id, gender: 'male', quantity: 1 });
  }
  renderRegisterScreen();
}

function slotOptionLabel(s) {
  return `${s.name} — ${s.dayLabel}${s.hoursLabel ? ' · ' + s.hoursLabel : ''}`;
}

function itemRowHtml(item, idx) {
  const price = priceForItem(item);
  return `
    <div class="item-select-row" data-idx="${idx}">
      ${state.registerItems.length > 1 ? `<button class="remove-item" data-remove="${idx}">✕ הסר</button>` : ''}
      <div>
        <label>זמן חלוקה</label>
        <select data-field="slotId" data-idx="${idx}">
          ${state.slots.map((s) => `<option value="${s.id}" ${item.slotId === s.id ? 'selected' : ''}>${slotOptionLabel(s)}</option>`).join('')}
        </select>
      </div>
      <div class="cols3" style="grid-template-columns:1fr 1fr">
        <div>
          <label>סוג</label>
          <select data-field="gender" data-idx="${idx}">
            <option value="male" ${item.gender === 'male' ? 'selected' : ''}>זכרים</option>
            <option value="female" ${item.gender === 'female' ? 'selected' : ''}>נקבות</option>
          </select>
        </div>
        <div>
          <label>כמות</label>
          <div class="stepper">
            <button data-step="-1" data-idx="${idx}">−</button>
            <span>${item.quantity}</span>
            <button data-step="1" data-idx="${idx}">+</button>
          </div>
        </div>
      </div>
      <div class="item-row">
        <span class="meta">${price != null ? `${money(price)} ליחידה` : 'אין תעריף'}</span>
        <span class="meta">סה"כ ${price != null ? money(price * item.quantity) : '—'}</span>
      </div>
    </div>
  `;
}

function computeTotal() {
  return state.registerItems.reduce((sum, it) => sum + (priceForItem(it) || 0) * it.quantity, 0);
}

function renderRegisterScreen(errorMsg) {
  // "חסום" = המנהל סגר את הרישום, או שאין עדיין אף זמן חלוקה פתוח (הטופס לא
  // שמיש בכל מקרה) — בשני המקרים עדיף הודעת "סגור, ייפתח בקרוב" ברורה
  // במקום טופס בלי אף אפשרות בחירה.
  const blocked = !state.publicSettings?.registrationOpen || !state.slots.length;
  if (blocked) {
    render(`
      <div class="card">
        <h2>${state.isFirstTime ? 'טופס הרשמה' : 'הזמנה נוספת'}</h2>
        <div class="notice">${state.publicSettings?.closedRegistrationMessage || 'חלון ההזמנות סגור כרגע, ייפתח בקרוב.'}</div>
        <div class="spacer"></div>
        <button class="ghost" id="registerBack">${state.isFirstTime ? 'חזרה' : 'חזרה לאזור האישי'}</button>
      </div>
    `);
    document.getElementById('registerBack').onclick = () => goBack();
    return;
  }
  render(`
    <div class="card">
      <h2>${state.isFirstTime ? 'טופס הרשמה' : 'הזמנה נוספת'}</h2>
      ${!state.isFirstTime ? `<p class="hint">זו תירשם כ"הזמנה נוספת" בנפרד מההזמנות הקודמות שלכם באותו מספר טלפון.</p>` : ''}
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      ${state.isFirstTime ? `
        <label for="nameInput">שם מלא</label>
        <input type="text" id="nameInput" placeholder="שם פרטי ומשפחה">
      ` : ''}
      <div class="spacer"></div>
      <label>פריטי הזמנה</label>
      <div id="itemsContainer"></div>
      <button class="secondary" id="addItemBtn" type="button">+ הוספת פריט נוסף</button>
      <div class="total-row"><span>סה"כ לתשלום</span><span id="totalDisplay">${money(computeTotal())}</span></div>
      <label for="notesInput">הערות (אופציונלי)</label>
      <textarea id="notesInput" placeholder="למשל: בקשה מיוחדת, עדכון פרטים..."></textarea>
      <div class="spacer"></div>
      <button class="primary" id="registerSubmit">שליחת ההזמנה</button>
      <div class="spacer"></div>
      <button class="ghost" id="registerBack">${state.isFirstTime ? 'חזרה' : 'ביטול, חזרה לאזור האישי'}</button>
    </div>
  `);
  renderItemsContainer();
  document.getElementById('addItemBtn').onclick = () => {
    state.registerItems.push({ slotId: state.slots[0].id, gender: 'male', quantity: 1 });
    renderItemsContainer();
  };
  document.getElementById('registerSubmit').onclick = onRegisterSubmit;
  document.getElementById('registerBack').onclick = () => goBack();
}

function renderItemsContainer() {
  const container = document.getElementById('itemsContainer');
  container.innerHTML = state.registerItems.map(itemRowHtml).join('');
  document.getElementById('totalDisplay').textContent = money(computeTotal());
  container.querySelectorAll('select').forEach((s) => {
    s.onchange = () => {
      const idx = Number(s.dataset.idx);
      const value = s.dataset.field === 'slotId' ? Number(s.value) : s.value;
      state.registerItems[idx][s.dataset.field] = value;
      renderItemsContainer();
    };
  });
  container.querySelectorAll('[data-step]').forEach((b) => {
    b.onclick = () => {
      const idx = Number(b.dataset.idx);
      const delta = Number(b.dataset.step);
      state.registerItems[idx].quantity = Math.max(1, state.registerItems[idx].quantity + delta);
      renderItemsContainer();
    };
  });
  container.querySelectorAll('[data-remove]').forEach((b) => {
    b.onclick = () => {
      state.registerItems.splice(Number(b.dataset.remove), 1);
      renderItemsContainer();
    };
  });
}

async function onRegisterSubmit() {
  const customerName = state.isFirstTime ? document.getElementById('nameInput').value.trim() : undefined;
  const notes = document.getElementById('notesInput').value.trim() || undefined;
  const btn = document.getElementById('registerSubmit');
  btn.disabled = true; btn.textContent = 'שולח…';
  try {
    const order = await api('/register', {
      method: 'POST',
      body: { phone: state.phone, customerName, notes, items: state.registerItems },
    });
    state.isFirstTime = false;
    // מיד עם קליטת ההזמנה נפתחת חלונית התשלום (עם אפשרות לדלג ולשלם אח"כ) —
    // לא מסך "הצלחה" נפרד שדורש עוד לחיצה. מחליפים (לא מוסיפים) את שכבת
    // ה-history של הטופס — אחרי הזמנה שהוגשה בהצלחה, "חזרה" לא אמור להחזיר לטופס עצמו.
    replaceScreenState('payment');
    openPaymentAfterRegistration(order);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'שליחת ההזמנה';
    if (err.data?.requiresOtp) {
      await requestOtp();
      goToScreen('otp');
      screenOtp(err.message);
    } else {
      renderRegisterScreen(err.message);
    }
  }
}

// ============== אזור אישי — 4 כפתורים ==============

function screenPersonalArea() {
  const s = state.publicSettings || {};
  render(`
    <div class="card">
      <h2>האזור האישי שלי</h2>
      <p class="hint">טלפון: ${state.normalizedPhone}</p>
    </div>
    <div class="grid4">
      <button class="big-btn" id="btnShow"><span class="ico">📋</span>הצג הזמנה שלי</button>
      <button class="big-btn" id="btnMore" ${!s.registrationOpen ? 'disabled' : ''}><span class="ico">➕</span>${state.isFirstTime ? 'ביצוע הזמנה' : 'ביצוע הזמנה נוספת'}</button>
      <button class="big-btn" id="btnRedeem" ${!s.distributionOpen ? 'disabled' : ''}><span class="ico">🎟️</span>מימוש הזמנה</button>
      <button class="big-btn" id="btnPay"><span class="ico">💳</span>תשלום על הזמנה</button>
    </div>
    ${!s.registrationOpen ? `<p class="hint">* ${s.closedRegistrationMessage || 'חלון ההזמנות סגור כרגע, ייפתח בקרוב.'}</p>` : ''}
    ${!s.distributionOpen ? `<p class="hint">* החלוקה טרם נפתחה — לא ניתן לממש הזמנה כרגע.</p>` : ''}
    <div class="spacer"></div>
    <button class="ghost" id="btnLogout">יציאה מהאזור האישי</button>
  `);
  document.getElementById('btnShow').onclick = () => { goToScreen('myOrders'); screenMyOrders(); };
  document.getElementById('btnMore').onclick = () => { state.registerItems = []; goToScreen('register'); screenRegister(); };
  document.getElementById('btnRedeem').onclick = () => { goToScreen('redeem'); screenRedeem(); };
  document.getElementById('btnPay').onclick = () => { goToScreen('payment'); screenPayment(); };
  document.getElementById('btnLogout').onclick = async () => {
    await api('/session/end', { method: 'POST' }).catch(() => {});
    state.phone = ''; state.normalizedPhone = '';
    goToScreen('phone');
    screenPhone();
  };
}

// ---- הצג הזמנה שלי ----

async function screenMyOrders() {
  render(`<div class="loading">טוען הזמנות…</div>`);
  const orders = await api(`/my-orders?phone=${encodeURIComponent(state.phone)}`);
  render(`
    <button class="ghost" id="back">← חזרה</button>
    <h2>ההזמנות שלי</h2>
    ${orders.map((o) => `
      <div class="card">
        <div class="order-row-header">
          <b>הזמנה מספר ${o.orderSequence} (מס' ${o.orderNumber})</b>
          <span class="pill ${o.paymentStatus}">${STATUS_LABEL[o.paymentStatus]}</span>
        </div>
        ${o.items.map((it) => `
          <div class="item-row" style="border-inline-start:4px solid ${it.slotColor || 'var(--accent)'};padding-inline-start:10px">
            <span>${it.dayLabel}${it.hoursLabel ? ' ' + it.hoursLabel : ''} · ${it.quantity} ${GENDER_LABEL[it.gender]}</span>
            <span class="meta">${redemptionStatusText(it.quantity, it.quantityRedeemed)}</span>
          </div>
        `).join('')}
        <div class="total-row"><span>סה"כ</span><span>${money(o.totalAmount)}</span></div>
        ${o.balanceDue > 0 ? `<p class="hint">יתרה לתשלום: ${money(o.balanceDue)}</p>` : ''}
      </div>
    `).join('') || `<div class="card"><p class="hint">אין הזמנות עדיין.</p></div>`}
  `);
  document.getElementById('back').onclick = () => goBack();
}

// ---- מימוש הזמנה: מקובץ לפי זמן חלוקה, כפתור אחד לכל הזמן ----

async function screenRedeem() {
  render(`<div class="loading">טוען פריטים למשיכה…</div>`);
  const status = await api(`/redeem/status?phone=${encodeURIComponent(state.phone)}`);

  const groups = new Map();
  status.available.forEach((it) => {
    if (!groups.has(it.slotId)) {
      groups.set(it.slotId, { slotId: it.slotId, slotName: it.slotName, slotColor: it.slotColor, male: 0, female: 0 });
    }
    groups.get(it.slotId)[it.gender] += it.remaining;
  });
  const chosen = {};
  groups.forEach((g) => { chosen[g.slotId] = { male: 0, female: 0 }; });

  function genderLineHtml(g, gender) {
    if (g[gender] <= 0) return '';
    const label = gender === 'male' ? 'זכרים' : 'נקבות';
    return `
      <div class="gender-line">
        <span>${label} · נותרו ${g[gender]}</span>
        <div class="stepper">
          <button data-gstep="-1" data-slot="${g.slotId}" data-gender="${gender}">−</button>
          <span id="gqty-${g.slotId}-${gender}">0</span>
          <button data-gstep="1" data-slot="${g.slotId}" data-gender="${gender}">+</button>
        </div>
        <button type="button" class="quick-all" data-gall data-slot="${g.slotId}" data-gender="${gender}">הכל</button>
      </div>
    `;
  }

  function groupCardHtml(g) {
    return `
      <div class="card slot-group-card" style="border-inline-start-color:${g.slotColor}">
        <div class="order-row-header"><b>${g.slotName}</b></div>
        ${genderLineHtml(g, 'male')}
        ${genderLineHtml(g, 'female')}
        <div class="spacer"></div>
        <button class="primary" data-confirm-slot="${g.slotId}">מימוש והצגה למחלק העופות</button>
      </div>
    `;
  }

  render(`
    <button class="ghost" id="back">← חזרה</button>
    <h2>מימוש הזמנה</h2>
    ${!status.distributionOpen ? `<div class="error">החלוקה סגורה כרגע.</div>` : ''}
    ${groups.size ? [...groups.values()].map(groupCardHtml).join('') : `<div class="card"><p class="hint">אין כרגע פריטים זמינים למשיכה עבור המועד הפתוח.</p></div>`}
    ${status.blocked.length ? `
      <h2>לא ניתן למשוך כעת</h2>
      ${status.blocked.map((it) => `
        <div class="card">
          <div class="order-row-header"><b>${it.label}</b><span class="meta">הזמנה מס' ${it.orderNumber}</span></div>
          <div class="notice">${it.message}</div>
        </div>
      `).join('')}
    ` : ''}
  `);
  document.getElementById('back').onclick = () => goBack();

  document.querySelectorAll('[data-gstep]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      const delta = Number(b.dataset.gstep);
      const cur = chosen[slotId][gender];
      chosen[slotId][gender] = Math.max(0, Math.min(g[gender], cur + delta));
      document.getElementById(`gqty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  document.querySelectorAll('[data-gall]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      chosen[slotId][gender] = g[gender];
      document.getElementById(`gqty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  document.querySelectorAll('[data-confirm-slot]').forEach((b) => {
    b.onclick = () => {
      const slotId = Number(b.dataset.confirmSlot);
      const g = groups.get(slotId);
      const c = chosen[slotId];
      if (c.male <= 0 && c.female <= 0) return;
      openSlotRedeemConfirm(g, c);
    };
  });
}

function openSlotRedeemConfirm(group, chosenQty) {
  const parts = [];
  if (chosenQty.male > 0) parts.push(`${chosenQty.male} זכרים`);
  if (chosenQty.female > 0) parts.push(`${chosenQty.female} נקבות`);
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <h2>אישור סופי</h2>
        <p class="hint">האם אתה בטוח? אני מאשר שסיימתי ואני לוקח כעת <b>${parts.join(' + ')}</b> מתוך "${group.slotName}".<br>פעולה זו סופית ולא ניתנת לביטול.</p>
        <p class="must-show-notice">יש להציג את האישור למחלק העופות</p>
        <button class="danger" id="confirmYes" style="width:100%">כן, אני מאשר סופית</button>
        <div class="spacer"></div>
        <button class="secondary" id="confirmNo" style="width:100%">ביטול</button>
      </div>
    </div>
  `);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#confirmNo').onclick = () => backdrop.remove();
  backdrop.querySelector('#confirmYes').onclick = async () => {
    const btn = backdrop.querySelector('#confirmYes');
    btn.disabled = true; btn.textContent = 'מבצע…';
    try {
      const result = await api('/redeem/confirm-slot', {
        method: 'POST',
        body: { phone: state.phone, slotId: group.slotId, maleQuantity: chosenQty.male, femaleQuantity: chosenQty.female },
      });
      backdrop.remove();
      showBigTicket(result);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'כן, אני מאשר סופית';
      backdrop.querySelector('.hint').insertAdjacentHTML('afterend', `<div class="error">${err.message}</div>`);
    }
  };
}

function showBigTicket(result) {
  render(`
    <div class="big-ticket-screen" style="background:${result.slotColor}">
      <div class="slot-name">${result.slotName}</div>
      <div class="customer-name">${result.customerName || ''}</div>
      <div class="gender-squares">
        ${result.maleQuantity > 0 ? `<div class="gender-square male"><div class="num">${result.maleQuantity}</div><div class="lbl">זכרים</div></div>` : ''}
        ${result.femaleQuantity > 0 ? `<div class="gender-square female"><div class="num">${result.femaleQuantity}</div><div class="lbl">נקבות</div></div>` : ''}
      </div>
      <div class="must-show-notice on-color">יש להציג את האישור למחלק העופות<br>לא ניתן לחזור לדף זה שנית</div>
      <button class="secondary" id="ticketDoneBtn">חזרה</button>
    </div>
  `);
  document.getElementById('ticketDoneBtn').onclick = screenRedeem;
}

// ---- תשלום (נדרים פלוס, שיטה 3 מסלול ב' — עסקה שהוקמה בשרת, ראו docs/nedarim-plus-integration.md) ----

// רישום המאזין וטעינת ה-src של האייפרם - פעם אחת בלבד בחיי הדף (ראו האזהרה למעלה).
const nedarimFrame = document.getElementById('NedarimFrame');
function PostNedarim(data) { nedarimFrame.contentWindow.postMessage(data, '*'); }
window.addEventListener('message', (event) => {
  const msg = event.data || {};
  if (msg.Name === 'Height') {
    nedarimFrame.style.height = (parseInt(msg.Value, 10) + 15) + 'px';
  } else if (msg.Name === 'TransactionResponse') {
    onNedarimTransactionResponse(msg.Value || {});
  }
});
nedarimFrame.src = 'https://www.matara.pro/nedarimplus/iframe/v3/?language=he';

function showPaymentScreen() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('paymentScreen').style.display = '';
}
function hidePaymentScreen() {
  document.getElementById('paymentScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
}

document.getElementById('paymentBack').onclick = () => { goBack(); };
document.getElementById('paymentContinueBtn').onclick = onPaymentContinue;
document.getElementById('paymentSkipLink').onclick = onPaymentSkip;

/** תשלום רגיל מהאזור האישי (כפתור "תשלום על הזמנה") — בלי אוטו-פתיחה, בלי הודעת "דלג". */
async function screenPayment() {
  document.getElementById('paymentHeader').innerHTML = '';
  document.getElementById('paymentSkipSection').style.display = 'none';
  await loadPaymentBalance();
}

/** מיד אחרי שליחת הזמנה חדשה — נפתחת אוטומטית, עם אפשרות מפורשת "לדלג ולשלם אחר כך". */
async function openPaymentAfterRegistration(order) {
  document.getElementById('paymentHeader').innerHTML =
    `<div class="success">ההזמנה נקלטה בהצלחה! מספר הזמנה: ${order.orderNumber} (הזמנה מספר ${order.orderSequence}).</div>`;
  document.getElementById('paymentSkipSection').style.display = '';
  document.getElementById('paymentSkipNotice').style.display = 'none';
  document.getElementById('paymentSkipContinueBtn').style.display = 'none';
  document.getElementById('paymentSkipLink').style.display = '';
  await loadPaymentBalance();
}

async function loadPaymentBalance() {
  showPaymentScreen();
  document.getElementById('paymentLoading').style.display = '';
  document.getElementById('paymentNoBalance').style.display = 'none';
  document.getElementById('paymentHasBalance').style.display = 'none';
  document.getElementById('paymentFrameWrap').style.display = 'none';
  document.getElementById('paymentSuccess').style.display = 'none';
  document.getElementById('paymentError').style.display = 'none';

  const { balanceDue } = await api(`/payment-balance?phone=${encodeURIComponent(state.phone)}`);
  document.getElementById('paymentLoading').style.display = 'none';
  if (balanceDue <= 0) {
    document.getElementById('paymentNoBalance').style.display = '';
    return;
  }
  document.getElementById('paymentHasBalance').style.display = '';
  document.getElementById('paymentAmountDisplay').textContent = money(balanceDue);
  const amountInput = document.getElementById('paymentAmountInput');
  amountInput.max = balanceDue;
  amountInput.value = balanceDue;
  document.getElementById('paymentContinueBtn').style.display = '';
  document.getElementById('paymentContinueBtn').disabled = false;
}

let currentPaymentSession = null; // { token, transactionId } — לאישור אופטימי מיד כשהאייפרם מדווח הצלחה

async function onPaymentContinue() {
  const btn = document.getElementById('paymentContinueBtn');
  const amount = Number(document.getElementById('paymentAmountInput').value);
  btn.disabled = true; btn.textContent = 'פותח חלונית תשלום…';
  document.getElementById('paymentError').style.display = 'none';
  try {
    const session = await api('/payment/create-session', { method: 'POST', body: { phone: state.phone, amount } });
    currentPaymentSession = { token: session.token, transactionId: session.transactionId };
    document.getElementById('paymentFrameWrap').style.display = '';
    document.getElementById('paymentSkipSection').style.display = 'none';
    btn.style.display = 'none';
    PostNedarim({ Name: 'StartPayment', Value: { TransactionId: session.transactionId, Key: session.key } });
  } catch (err) {
    btn.disabled = false; btn.textContent = 'המשך לתשלום';
    document.getElementById('paymentError').textContent = err.message;
    document.getElementById('paymentError').style.display = '';
  }
}

function onPaymentSkip() {
  document.getElementById('paymentHasBalance').querySelectorAll(':scope > label, :scope > input, #paymentContinueBtn, .total-row').forEach((elm) => { elm.style.display = 'none'; });
  document.getElementById('paymentSkipLink').style.display = 'none';
  document.getElementById('paymentSkipNotice').textContent = state.publicSettings?.deferredPaymentNotice || '';
  document.getElementById('paymentSkipNotice').style.display = '';
  document.getElementById('paymentSkipContinueBtn').style.display = '';
  document.getElementById('paymentSkipContinueBtn').onclick = () => { goBack(); };
}

async function onNedarimTransactionResponse(value) {
  document.getElementById('paymentFrameWrap').style.display = 'none';
  const successEl = document.getElementById('paymentSuccess');
  if (value.Status === 'OK') {
    successEl.textContent = 'התשלום התקבל בהצלחה! מרעננים את הסטטוס…';
    successEl.style.display = '';
    // מאשרים מיידית לפי תגובת הדפדפן (לא מחכים ל-Webhook) — ראו
    // confirmClientReportedPayment ב-payments.js להסבר המלא. אם הקריאה
    // נכשלת (למשל בעיית רשת), לא מציגים שגיאה מבהילה ללקוח — התשלום
    // בפועל כן עבר מול נדרים פלוס; זה יתגלה בפאנל הניהול כ"תשלום שלא אושר".
    if (currentPaymentSession?.token) {
      try {
        await api('/payment/confirm-client', {
          method: 'POST',
          body: { phone: state.phone, token: currentPaymentSession.token, transactionId: currentPaymentSession.transactionId },
        });
      } catch (err) {
        console.error('אישור תשלום אופטימי נכשל (ה-Webhook עדיין יכול להשלים את זה):', err);
      }
      currentPaymentSession = null;
    }
    setTimeout(() => { goBack(); }, 1800);
  } else {
    document.getElementById('paymentContinueBtn').style.display = '';
    document.getElementById('paymentContinueBtn').disabled = false;
    document.getElementById('paymentError').textContent = value.Message || 'התשלום לא הושלם. ניתן לנסות שוב.';
    document.getElementById('paymentError').style.display = '';
  }
}

// ============== אתחול ==============

function maybeShowWelcomeNotice() {
  const body = state.publicSettings?.welcomeNoticeBody;
  if (!body) return;
  const title = state.publicSettings?.welcomeNoticeTitle || 'לתשומת לבכם';
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <h2>${title}</h2>
        <p class="hint" style="white-space:pre-line">${body}</p>
        <button class="primary" id="welcomeCloseBtn">סגירה</button>
      </div>
    </div>
  `);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#welcomeCloseBtn').onclick = () => backdrop.remove();
}

// ============== ניווט: History API — כדי שכפתור "חזרה" בנייד/בדפדפן יעבור
// בין המסכים באפליקציה במקום לצאת מהאתר (אין כאן URL-ים אמיתיים, רק state
// פנימי שנשמר בהיסטוריית הדפדפן) ==============
const SCREEN_RENDERERS = {
  phone: () => screenPhone(),
  otp: () => screenOtp(),
  personalArea: () => screenPersonalArea(),
  register: () => screenRegister(),
  myOrders: () => screenMyOrders(),
  redeem: () => screenRedeem(),
  payment: () => screenPersonalArea(), // 'payment' תמיד מוחלף/עוקף — אין אמור לחזור אליו כיעד
};
function goToScreen(screenId) {
  history.pushState({ screenId }, '', location.href);
}
function replaceScreenState(screenId) {
  history.replaceState({ screenId }, '', location.href);
}
function goBack() {
  history.back();
}
window.addEventListener('popstate', (event) => {
  // ניקוי כל חלונית פתוחה (הסבר/אישור מימוש) — מונע חלונית "תקועה" מעל מסך חדש
  document.querySelectorAll('.modal-backdrop').forEach((b) => b.remove());
  hidePaymentScreen();
  const screenId = event.state?.screenId || 'phone';
  (SCREEN_RENDERERS[screenId] || SCREEN_RENDERERS.phone)();
});

async function init() {
  state.publicSettings = await api('/public-settings');
  document.getElementById('pageTitle').textContent = '🐔 ' + (state.publicSettings.orderTitle || 'הרשמה לכפרות');
  document.getElementById('pageSubtitle').textContent = state.publicSettings.orderSubtitle || '';
  replaceScreenState('phone');
  screenPhone();
  maybeShowWelcomeNotice();
}

init().catch((err) => render(`<div class="error">שגיאה בטעינת המערכת: ${err.message}</div>`));
</script>
</body>
</html>
