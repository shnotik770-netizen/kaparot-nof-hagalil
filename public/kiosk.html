<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עמדת חלוקה — כפרות נוף הגליל</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body{background:var(--surface-2)}
  .topbar{background:var(--ink);color:#fff;border-color:var(--ink)}
  .topbar h1{color:#fff}
  .topbar .badge{color:#cfd2e6}
</style>
</head>
<body>
<div class="topbar"><h1>🎟️ עמדת חלוקה</h1><span class="badge" id="slotBadge"></span></div>
<div class="wrap" id="app"><div class="loading">טוען…</div></div>

<script>
const state = { phone: '', normalizedPhone: '', publicSettings: null, otpCooldownUntil: 0 };

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'שגיאה לא צפויה.'); err.data = data; throw err; }
  return data;
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function render(html) { document.getElementById('app').innerHTML = html; }

function screenPhone(errorMsg) {
  render(`
    <div class="card">
      <h2>זיהוי לקוח</h2>
      <p class="hint">מוסרים ללקוח להזין את מספר הטלפון שלו, ולאחר מכן את קוד האימות שיישלח בסמס.</p>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      ${!state.publicSettings?.distributionOpen ? `<div class="error">החלוקה סגורה כרגע במערכת.</div>` : ''}
      <label for="phoneInput">מספר טלפון</label>
      <input type="tel" id="phoneInput" placeholder="05XXXXXXXX" inputmode="numeric">
      <div class="spacer"></div>
      <button class="primary" id="phoneSubmit">שליחת קוד אימות</button>
    </div>
  `);
  document.getElementById('phoneSubmit').onclick = onPhoneSubmit;
}

async function onPhoneSubmit() {
  const phone = document.getElementById('phoneInput').value.trim();
  state.phone = phone;
  try {
    const check = await api('/check-phone', { method: 'POST', body: { phone } });
    state.normalizedPhone = check.normalizedPhone;
    await api('/otp/request', { method: 'POST', body: { phone } });
    state.otpCooldownUntil = Date.now() + 30000;
    screenOtp();
  } catch (err) {
    screenPhone(err.message);
  }
}

function screenOtp(errorMsg) {
  render(`
    <div class="card">
      <h2>קוד אימות</h2>
      <p class="hint">נשלח קוד ל-${state.normalizedPhone}. מוסרים ללקוח להזין אותו.</p>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      <label for="otpInput">קוד בן 6 ספרות</label>
      <input type="text" id="otpInput" inputmode="numeric" maxlength="6">
      <div class="spacer"></div>
      <button class="primary" id="otpSubmit">אמת</button>
      <button class="ghost" id="otpBack">חזרה</button>
    </div>
  `);
  document.getElementById('otpSubmit').onclick = onOtpSubmit;
  document.getElementById('otpBack').onclick = () => screenPhone();
}

async function onOtpSubmit() {
  const code = document.getElementById('otpInput').value.trim();
  try {
    await api('/otp/verify', { method: 'POST', body: { phone: state.phone, code } });
    screenRedeem();
  } catch (err) {
    screenOtp(err.message);
  }
}

// ---- מימוש: מקובץ לפי זמן חלוקה, כפתור אחד לכל זמן ----

async function screenRedeem() {
  render(`<div class="loading">טוען פריטים למשיכה…</div>`);
  const status = await api(`/redeem/status?phone=${encodeURIComponent(state.phone)}`);

  const groups = new Map();
  status.available.forEach((it) => {
    if (!groups.has(it.slotId)) {
      groups.set(it.slotId, { slotId: it.slotId, slotName: it.slotName, slotColor: it.slotColor, male: 0, female: 0 });
    }
    groups.get(it.slotId)[it.gender] += it.remaining;
  });
  const chosen = {};
  groups.forEach((g) => { chosen[g.slotId] = { male: 0, female: 0 }; });

  function genderLineHtml(g, gender) {
    if (g[gender] <= 0) return '';
    const label = gender === 'male' ? 'זכרים' : 'נקבות';
    return `
      <div class="gender-line">
        <span>${label} · נותרו ${g[gender]}</span>
        <div class="stepper">
          <button data-gstep="-1" data-slot="${g.slotId}" data-gender="${gender}">−</button>
          <span id="gqty-${g.slotId}-${gender}">0</span>
          <button data-gstep="1" data-slot="${g.slotId}" data-gender="${gender}">+</button>
        </div>
        <button type="button" class="quick-all" data-gall data-slot="${g.slotId}" data-gender="${gender}">הכל</button>
      </div>
    `;
  }

  function groupCardHtml(g) {
    return `
      <div class="card slot-group-card" style="border-inline-start-color:${g.slotColor}">
        <div class="order-row-header"><b>${g.slotName}</b></div>
        ${genderLineHtml(g, 'male')}
        ${genderLineHtml(g, 'female')}
        <div class="spacer"></div>
        <button class="primary" data-confirm-slot="${g.slotId}">מימוש והצגה למחלק העופות</button>
      </div>
    `;
  }

  render(`
    <div class="card"><b>לקוח מזוהה:</b> ${state.normalizedPhone}</div>
    <h2>פריטים למשיכה</h2>
    ${groups.size ? [...groups.values()].map(groupCardHtml).join('') : `<div class="card"><p class="hint">אין פריטים זמינים למשיכה עבור המועד הפתוח כרגע.</p></div>`}
    ${status.blocked.length ? `
      <h2>לא ניתן למשוך</h2>
      ${status.blocked.map((it) => `
        <div class="card">
          <div class="order-row-header"><b>${it.label}</b><span class="meta">הזמנה מס' ${it.orderNumber}</span></div>
          <div class="notice">${it.message}</div>
        </div>
      `).join('')}
    ` : ''}
    <button class="secondary" id="endSession">סיום — לקוח הבא</button>
  `);
  document.getElementById('endSession').onclick = endSession;

  document.querySelectorAll('[data-gstep]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      const delta = Number(b.dataset.gstep);
      const cur = chosen[slotId][gender];
      chosen[slotId][gender] = Math.max(0, Math.min(g[gender], cur + delta));
      document.getElementById(`gqty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  document.querySelectorAll('[data-gall]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      chosen[slotId][gender] = g[gender];
      document.getElementById(`gqty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  document.querySelectorAll('[data-confirm-slot]').forEach((b) => {
    b.onclick = () => {
      const slotId = Number(b.dataset.confirmSlot);
      const g = groups.get(slotId);
      const c = chosen[slotId];
      if (c.male <= 0 && c.female <= 0) return;
      openSlotRedeemConfirm(g, c);
    };
  });
}

function openSlotRedeemConfirm(group, chosenQty) {
  const parts = [];
  if (chosenQty.male > 0) parts.push(`${chosenQty.male} זכרים`);
  if (chosenQty.female > 0) parts.push(`${chosenQty.female} נקבות`);
  const backdrop = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <h2>אישור סופי</h2>
        <p class="hint">האם אתה בטוח? אני מאשר שסיימתי ואני לוקח כעת <b>${parts.join(' + ')}</b> מתוך "${group.slotName}".<br>פעולה זו סופית ולא ניתנת לביטול.</p>
        <p class="must-show-notice">יש להציג את האישור למחלק העופות</p>
        <button class="danger" id="confirmYes" style="width:100%">כן, אני מאשר סופית</button>
        <div class="spacer"></div>
        <button class="secondary" id="confirmNo" style="width:100%">ביטול</button>
      </div>
    </div>
  `);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#confirmNo').onclick = () => backdrop.remove();
  backdrop.querySelector('#confirmYes').onclick = async () => {
    const btn = backdrop.querySelector('#confirmYes');
    btn.disabled = true; btn.textContent = 'מבצע…';
    try {
      const result = await api('/redeem/confirm-slot', {
        method: 'POST',
        body: { phone: state.phone, slotId: group.slotId, maleQuantity: chosenQty.male, femaleQuantity: chosenQty.female },
      });
      backdrop.remove();
      showBigTicket(result);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'כן, אני מאשר סופית';
      backdrop.querySelector('.hint').insertAdjacentHTML('afterend', `<div class="error">${err.message}</div>`);
    }
  };
}

function showBigTicket(result) {
  render(`
    <div class="big-ticket-screen" style="background:${result.slotColor}">
      <div class="ticket-card">
        <div class="slot-name" style="color:${result.slotColor}">${result.slotName}</div>
        ${result.hebrewDateNow ? `<div class="hebrew-date">${result.hebrewDateNow}</div>` : ''}
        <div class="customer-name">${result.customerName || ''}</div>
        <div class="gender-squares">
          ${result.maleQuantity > 0 ? `<div class="gender-square male"><div class="num">${result.maleQuantity}</div><div class="lbl">זכרים</div></div>` : ''}
          ${result.femaleQuantity > 0 ? `<div class="gender-square female"><div class="num">${result.femaleQuantity}</div><div class="lbl">נקבות</div></div>` : ''}
        </div>
        <div class="must-show-notice">יש להציג את האישור למחלק העופות<br>לא ניתן לחזור לדף זה שנית</div>
        <div class="ticket-issued-at">אישור זה הונפק כעת: ${new Date().toLocaleString('he-IL')}<br>אישור עם תאריך/שעה אחרים אינו תקף</div>
        <button class="secondary" id="moreBtn">משיכת פריט נוסף לאותו לקוח</button>
        <button class="secondary" id="endBtn">סיום — לקוח הבא</button>
      </div>
    </div>
  `);
  document.getElementById('moreBtn').onclick = screenRedeem;
  document.getElementById('endBtn').onclick = endSession;
}

async function endSession() {
  await api('/session/end', { method: 'POST' }).catch(() => {});
  state.phone = ''; state.normalizedPhone = '';
  screenPhone();
}

async function init() {
  state.publicSettings = await api('/public-settings');
  document.getElementById('slotBadge').textContent = state.publicSettings.distributionOpen ? 'החלוקה פתוחה' : 'החלוקה סגורה';
  await endSession(); // מבטיח שהעמדה מתחילה תמיד "נקייה" מבלי לקוח קודם מחובר
}

init().catch((err) => render(`<div class="error">שגיאה בטעינת המערכת: ${err.message}</div>`));
</script>
</body>
</html>
