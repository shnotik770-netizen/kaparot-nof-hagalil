          <p class="hint" style="margin:4px 0 0">${customers.length} לקוחות · ${customers.filter((c) => c.paymentStatus === 'paid').length} שולמו במלואם</p>
        </div>
        <div class="corner-actions">
          <button class="mini-btn" id="exportCsvBtn" title="ייצוא דוח תשלומים (CSV)">📄 דוח</button>
          <button class="mini-btn" id="toggleBulkSms" title="שליחת סמס לקבוצה המסוננת">✉️ סמס</button>
          <button class="mini-btn" id="toggleAddOrder" title="הוספת הזמנה ידנית">➕ הזמנה ידנית</button>
          <button class="mini-btn" id="toggleQuickEventMode" title="איסוף מהיר ליום החלוקה">🎟️ איסוף יום החלוקה</button>
        </div>
      </div>
      <label for="orderSearch">חיפוש לפי שם או טלפון</label>
      <input type="text" id="orderSearch" placeholder="הקלידו שם או מספר טלפון...">
      <div class="filter-row">
        <div class="multiselect" id="msPaid">
          <button type="button" class="multiselect-btn" data-ms-toggle>סטטוס תשלום <span class="ms-count" data-ms-count></span></button>
          <div class="multiselect-panel" hidden>
            <label><input type="checkbox" class="filterPaidCheck" value="paid" checked> שולם מלא</label>
            <label><input type="checkbox" class="filterPaidCheck" value="coordinated" checked> תואם תשלום</label>
            <label><input type="checkbox" class="filterPaidCheck" value="partial_coordinated" checked> שולם חלקית ונסגרה ההזמנה</label>
            <label><input type="checkbox" class="filterPaidCheck" value="partial_open" checked> שולם חלקית ולא נסגרה ההזמנה</label>
            <label><input type="checkbox" class="filterPaidCheck" value="unpaid_none" checked> לא שולם כלל</label>
            <label><input type="checkbox" class="filterPaidCheck" value="credit" checked> יש זכות (שולם ביתר)</label>
          </div>
        </div>
        <div class="multiselect" id="msRedeemed">
          <button type="button" class="multiselect-btn" data-ms-toggle>סטטוס איסוף <span class="ms-count" data-ms-count></span></button>
          <div class="multiselect-panel" hidden>
            <label><input type="checkbox" class="filterRedeemedCheck" value="full" checked> נאסף במלואו</label>
            <label><input type="checkbox" class="filterRedeemedCheck" value="partial" checked> לא נאסף במלואו</label>
          </div>
        </div>
        <div class="multiselect" id="msSlot">
          <button type="button" class="multiselect-btn" data-ms-toggle>זמן חלוקה <span class="ms-count" data-ms-count></span></button>
          <div class="multiselect-panel" hidden>
            ${slots.map((s) => `<label><input type="checkbox" class="filterSlotCheck" value="${s.id}" checked> ${esc(s.name)}</label>`).join('')}
          </div>
        </div>
        <div class="multiselect" id="msMethod">
          <button type="button" class="multiselect-btn" data-ms-toggle>אופן תשלום <span class="ms-count" data-ms-count></span></button>
          <div class="multiselect-panel" hidden>
            ${Object.entries(METHOD_LABEL).map(([val, label]) => `<label><input type="checkbox" class="filterMethodCheck" value="${val}" checked> ${esc(label)}</label>`).join('')}
          </div>
        </div>
      </div>
      <div id="bulkSmsCard" hidden style="margin-top:10px">
        <label><input type="checkbox" id="bulkSmsManualMode"> בחירה ידנית של נמענים (במקום כל הרשימה המסוננת)</label>
        <div id="bulkSmsManualWrap" hidden style="margin:8px 0">
          <div class="row">
            <button class="mini-btn" type="button" id="bulkSmsSelectAll">בחר הכל</button>
            <button class="mini-btn" type="button" id="bulkSmsSelectNone">נקה הכל</button>
          </div>
          <div id="bulkSmsManualList" style="max-height:240px;overflow-y:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px"></div>
        </div>
        <label for="bulkSmsText">תוכן ההודעה</label>
        <textarea id="bulkSmsText" placeholder="ההודעה שתישלח לנמענים שנבחרו..."></textarea>
        <div class="spacer"></div>
        <button class="primary big-action" id="bulkSmsSend" style="width:100%">שליחה</button>
        <div id="bulkSmsMsg"></div>
      </div>
    </div>
    <div class="card" id="addOrderCard" hidden>
      <h2 style="margin:0 0 10px">➕ הזמנה ידנית חדשה</h2>
      <label for="newOrderPhone">טלפון</label>
      <input type="tel" id="newOrderPhone" inputmode="numeric" placeholder="05XXXXXXXX">
      <div id="newOrderCustomerIndicator"></div>
      <label for="newOrderName">שם הלקוח (נדרש רק ללקוח חדש — ללקוח קיים יישמר השם הקיים)</label>
      <input type="text" id="newOrderName">
      <label for="newOrderNotes">הערות (אופציונלי)</label>
      <textarea id="newOrderNotes"></textarea>
      <label>פריטים</label>
      <div id="newOrderItems"></div>
      <button class="secondary" type="button" id="newOrderAddItem">+ הוספת פריט</button>
      <div class="total-row"><span>סה"כ</span><span id="newOrderTotal">₪0</span></div>
      <button class="primary big-action" id="newOrderSubmit" style="width:100%">יצירת הזמנה</button>
      <div id="newOrderMsg"></div>
    </div>
    <div id="ordersListWrap"></div>
  `;

  updateOrdersHeader(customers.length, customers.length, false);
  let currentFiltered = customers;

  // מיפוי הזמנה בודדת לקטגוריית "סטטוס תשלום" לצורך הסינון. לקוח נחשב
  // תואם-לסינון אם יש לו לפחות הזמנה אחת שמתאימה לאחת הקטגוריות המסומנות —
  // בכוונה שיש חפיפה בין 'coordinated' ל-'partial_coordinated' (הזמנה ששולמה
  // חלקית ותואמה מתאימה לשתיהן), בדיוק כמו שהתבקש.
  function orderMatchesPaidCategory(o, cat) {
    switch (cat) {
      case 'paid': return o.paymentStatus === 'paid';
      case 'coordinated': return !!o.paymentCoordinated && o.paymentStatus !== 'paid';
      case 'unpaid_none': return o.paymentStatus === 'unpaid' && !o.paymentCoordinated;
      case 'partial_coordinated': return o.paymentStatus === 'partial' && !!o.paymentCoordinated;
      case 'partial_open': return o.paymentStatus === 'partial' && !o.paymentCoordinated;
      case 'credit': return o.balanceDue < 0;
      default: return false;
    }
  }

  // "נאסף במלואו" ביחס לזמני החלוקה המסוננים כרגע (לא ביחס לכל ההזמנות של
  // הלקוח): כשמסנן זמן חלוקה פעיל, בודקים איסוף רק מול הפריטים בזמני
  // החלוקה שנשארו מסומנים — כדי שמי שמימש במלואו ביום חמישי אך טרם הגיע
  // ביום ראשון לא ייחשב "לא נאסף" כשהמסנן מוגבל ליום חמישי בלבד.
  function isFullyRedeemedForSlots(c, checkedSlots, slotFilterActive) {
    const relevant = slotFilterActive ? c.bySlot.filter((s) => checkedSlots.includes(String(s.slotId))) : c.bySlot;
    if (!relevant.length) return c.fullyRedeemed;
    return relevant.every((s) => s.maleRedeemed >= s.male && s.femaleRedeemed >= s.female);
  }

  function applyFilters() {
    const q = document.getElementById('orderSearch').value.trim().toLowerCase();
    const allPaidChecks = document.querySelectorAll('.filterPaidCheck');
    const paidFilters = [...allPaidChecks].filter((cb) => cb.checked).map((cb) => cb.value);
    const allRedeemedChecks = document.querySelectorAll('.filterRedeemedCheck');
    const redeemedFilters = [...allRedeemedChecks].filter((cb) => cb.checked).map((cb) => cb.value);
    const allSlotChecks = document.querySelectorAll('.filterSlotCheck');
    const checkedSlots = [...allSlotChecks].filter((cb) => cb.checked).map((cb) => cb.value);
    // כל הזמנים מסומנים = בלי סינון בכלל (כמו "כל הזמנים" הישן).
    const slotFilterActive = checkedSlots.length < allSlotChecks.length;
    const allMethodChecks = document.querySelectorAll('.filterMethodCheck');
    const methodFilters = [...allMethodChecks].filter((cb) => cb.checked).map((cb) => cb.value);
    const methodFilterActive = methodFilters.length < allMethodChecks.length;
    currentFiltered = customers.filter((c) => {
      if (q && !c.customerName.toLowerCase().includes(q) && !c.phone.includes(q)) return false;
      if (!c.orders.some((o) => paidFilters.some((cat) => orderMatchesPaidCategory(o, cat)))) return false;
      // הלקוח חייב פריט בלפחות אחד מהזמנים שנשארו מסומנים.
      if (slotFilterActive && !c.bySlot.some((s) => checkedSlots.includes(String(s.slotId)))) return false;
      const fullyRedeemed = isFullyRedeemedForSlots(c, checkedSlots, slotFilterActive);
      if (!(fullyRedeemed ? redeemedFilters.includes('full') : redeemedFilters.includes('partial'))) return false;
      // הלקוח חייב לפחות תשלום אחד באחד מאמצעי התשלום שנשארו מסומנים.
      if (methodFilterActive) {
        const usedMethods = paymentMethodsByPhone.get(c.phone);
        if (!usedMethods || !methodFilters.some((m) => usedMethods.has(m))) return false;
      }
      return true;
    });
    const filtersActive = !!q || paidFilters.length < allPaidChecks.length || redeemedFilters.length < allRedeemedChecks.length || slotFilterActive || methodFilterActive;
    updateOrdersHeader(currentFiltered.length, customers.length, filtersActive);
    renderList(currentFiltered);
  }

  function renderList(list) {
    const wrap = document.getElementById('ordersListWrap');
    wrap.innerHTML = list.length
      ? list.map((c) => `<div id="custcard-${panelSafeId(c.phone)}">${customerCardHtml(c)}</div>`).join('')
      : `<div class="card"><p class="hint">לא נמצאו לקוחות תואמים.</p></div>`;
    wireCustomerCardButtons(wrap);
  }

  document.getElementById('orderSearch').oninput = applyFilters;
  wireMultiSelectDropdown('msPaid', '.filterPaidCheck', applyFilters);
  wireMultiSelectDropdown('msRedeemed', '.filterRedeemedCheck', applyFilters);
  wireMultiSelectDropdown('msSlot', '.filterSlotCheck', applyFilters);
  wireMultiSelectDropdown('msMethod', '.filterMethodCheck', applyFilters);
  document.getElementById('toggleQuickEventMode').onclick = () => {
    quickEventModeOn = true;
    renderOrdersTab();
  };

  document.getElementById('toggleBulkSms').onclick = () => {
    const card = document.getElementById('bulkSmsCard');
    card.hidden = !card.hidden;
  };

  // בחירה ידנית: מצלמים "תמונת מצב" של הרשימה המסוננת כרגע לתוך רשימת
  // צ'קבוקסים (כולם מסומנים כברירת מחדל) — משם המנהל מסמן/מבטל לפי רצונו,
  // בלי שהרשימה תתאפס אם הוא ממשיך לשנות את הסינון למעלה אחרי זה.
  function bulkSmsManualListHtml(list) {
    return list.length
      ? list.map((c) => `<label style="display:block;padding:4px 0"><input type="checkbox" class="bulkSmsManualCheck" value="${esc(c.phone)}" checked> ${esc(c.customerName)} · ${esc(c.phone)}</label>`).join('')
      : `<p class="hint">אין לקוחות ברשימה המסוננת כרגע.</p>`;
  }
  document.getElementById('bulkSmsManualMode').onchange = (e) => {
    document.getElementById('bulkSmsManualWrap').hidden = !e.target.checked;

      document.getElementById('bulkSmsManualList').innerHTML = bulkSmsManualListHtml(currentFiltered);
    }
  };

    document.querySelectorAll('.bulkSmsManualCheck').forEach((cb) => { cb.checked = true; });
  };
  document.getElementById('bulkSmsSelectNone').onclick = () => {
    document.querySelectorAll('.bulkSmsManualCheck').forEach((cb) => { cb.checked = false; });
  };

  document.getElementById('bulkSmsSend').onclick = async () => {
    const message = document.getElementById('bulkSmsText').value.trim();
    if (!message) return;
    const manualMode = document.getElementById('bulkSmsManualMode').checked;
    const recipients = manualMode
      ? [...document.querySelectorAll('.bulkSmsManualCheck:checked')].map((cb) => cb.value)
      : currentFiltered.map((c) => c.phone);
    if (!recipients.length) { alert('לא נבחרו נמענים לשליחה.'); return; }
    if (!confirm(`לשלוח את ההודעה ל-${recipients.length} נמענים?`)) return;
    try {
      const result = await api('/admin/sms/bulk', { method: 'POST', body: { phones: recipients, message } });
      const failedNote = result.failedCount ? ` (נכשל עבור ${result.failedCount} נמענים)` : '';
      document.getElementById('bulkSmsMsg').innerHTML = `<div class="success">נשלח ל-${result.recipientCount ?? recipients.length} נמענים.${failedNote}</div>`;

      <div class="modal">

        <button class="primary" id="exportFullBtn" style="margin-bottom:8px">📄 דוח מלא (${customers.length} לקוחות)</button>
        <button class="secondary" id="exportFilteredBtn">🔍 לפי הסינון הנוכחי (${currentFiltered.length} לקוחות)</button>
        <button class="ghost" id="exportCancelBtn" style="width:100%;margin-top:12px">ביטול</button>
      </div>
    `;
    document.body.appendChild(backdrop);
    const close = () => backdrop.remove();
    backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
    document.getElementById('exportCancelBtn').onclick = close;
    document.getElementById('exportFullBtn').onclick = () => { close(); downloadPaymentsCsv(null); };
    document.getElementById('exportFilteredBtn').onclick = () => { close(); downloadPaymentsCsv(currentFiltered.map((c) => c.phone)); };
  };

  // ---- הוספת הזמנה ידנית ----
  document.getElementById('toggleAddOrder').onclick = () => {
    const card = document.getElementById('addOrderCard');
    card.hidden = !card.hidden;
  };
  document.getElementById('newOrderPhone').oninput = () => {
    const nameInput = document.getElementById('newOrderName');
    const indicator = document.getElementById('newOrderCustomerIndicator');
    const normalized = normalizePhoneClient(document.getElementById('newOrderPhone').value);
    const match = normalized.length >= 9 ? allCustomersCache.find((c) => normalizePhoneClient(c.phone) === normalized) : null;
    if (match) {
      indicator.innerHTML = `<div class="notice">✅ מעדכן הזמנה קיימת עבור לקוח זה: <b>${esc(match.customerName)}</b></div>`;
      nameInput.value = match.customerName;
      nameInput.disabled = true;
    } else {
      indicator.innerHTML = '';
      nameInput.disabled = false;
    }
  };
  let newOrderItems = [];
  function newOrderPriceFor(item) {
    const slot = slots.find((s) => s.id === item.slotId);
    if (!slot) return 0;
    return item.gender === 'female' ? slot.priceFemale : slot.priceMale;
  }
  function renderNewOrderItems() {
    const box = document.getElementById('newOrderItems');
    box.innerHTML = newOrderItems.map((item, idx) => `
      <div class="item-select-row" data-idx="${idx}">
        ${newOrderItems.length > 1 ? `<button type="button" class="remove-item" data-remove-new-item="${idx}">✕ הסר</button>` : ''}
        <div class="cols2">
          <div>
            <label>זמן חלוקה</label>
            <select data-new-field="slotId" data-idx="${idx}">
              ${slots.map((s) => `<option value="${s.id}" ${item.slotId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>סוג</label>
            <select data-new-field="gender" data-idx="${idx}">
              <option value="male" ${item.gender === 'male' ? 'selected' : ''}>זכרים</option>
              <option value="female" ${item.gender === 'female' ? 'selected' : ''}>נקבות</option>
            </select>
          </div>
        </div>
        <label>כמות</label>
        <div class="stepper">
          <button type="button" data-new-step="-1" data-idx="${idx}">−</button>
          <span>${item.quantity}</span>
          <button type="button" data-new-step="1" data-idx="${idx}">+</button>
        </div>
      </div>
    `).join('');
    const total = newOrderItems.reduce((sum, it) => sum + newOrderPriceFor(it) * it.quantity, 0);
    document.getElementById('newOrderTotal').textContent = money(total);
    box.querySelectorAll('select').forEach((sel) => {
      sel.onchange = () => {
        const idx = Number(sel.dataset.idx);
        const value = sel.dataset.newField === 'slotId' ? Number(sel.value) : sel.value;
        newOrderItems[idx][sel.dataset.newField] = value;
        renderNewOrderItems();
      };
    });
    box.querySelectorAll('[data-new-step]').forEach((b) => {
      b.onclick = () => {
        const idx = Number(b.dataset.idx);
        newOrderItems[idx].quantity = Math.max(1, newOrderItems[idx].quantity + Number(b.dataset.newStep));
        renderNewOrderItems();
      };
    });
    box.querySelectorAll('[data-remove-new-item]').forEach((b) => {
      b.onclick = () => {
        newOrderItems.splice(Number(b.dataset.removeNewItem), 1);
        renderNewOrderItems();
      };
    });
  }
  if (slots.length) {
    newOrderItems = [{ slotId: slots[0].id, gender: 'male', quantity: 1 }];
    renderNewOrderItems();
  }
  document.getElementById('newOrderAddItem').onclick = () => {
    if (!slots.length) return;
    newOrderItems.push({ slotId: slots[0].id, gender: 'male', quantity: 1 });
    renderNewOrderItems();
  };
  document.getElementById('newOrderSubmit').onclick = async () => {
    try {
      await api('/admin/orders', { method: 'POST', body: {
        phone: document.getElementById('newOrderPhone').value,
        customerName: document.getElementById('newOrderName').value,
        notes: document.getElementById('newOrderNotes').value,
        items: newOrderItems,
      }});
      renderOrdersTab();
    } catch (err) {
      document.getElementById('newOrderMsg').innerHTML = `<div class="error">${err.message}</div>`;
    }
  };

  renderList(customers);
}

// בונה HTML לגרף עמודות פשוט (בלי ספריית צד ג') — items: [{label, value}].
// גובה כל עמודה יחסי לערך המקסימלי ברשימה; color אופציונלי (ברירת מחדל --accent).
function barChartHtml(items, color) {
  if (!items.length) return `<p class="chart-empty">אין עדיין נתונים להצגה.</p>`;
  const max = Math.max(...items.map((it) => it.value), 1);
  return `
    <div class="chart-wrap">
      <div class="chart-bars">
        ${items.map((it) => `
          <div class="chart-bar-col">
            <div class="chart-bar" style="height:${Math.max(3, Math.round((it.value / max) * 100))}%${color ? `;background:${esc(color)}` : ''}">
              <span class="chart-bar-value">${it.value}</span>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="chart-labels">${items.map((it) => `<span>${esc(it.label)}</span>`).join('')}</div>
    </div>
  `;
}

function formatChartDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getDate()}.${d.getMonth() + 1}`;
}

function formatChartClock(d) {
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function bucketRangeLabel(bucketStartDate) {
  const end = new Date(bucketStartDate.getTime() + 9 * 60_000);
  return `${formatChartClock(bucketStartDate)}-${formatChartClock(end)}`;
}

// ממלא את הדילוגים בין ה-buckets שהתקבלו מהשרת (אין רשומה = 0 עופות באותו
// חלון 10 דקות) כדי שהגרף יראה רצף אחיד לפי שעון-קיר, מהחלון הראשון שבו
// היה איסוף ועד האחרון (5:30-5:39, 5:40-5:49 וכו').
function denseRedemptionBuckets(buckets) {
  if (!buckets.length) return [];
  const times = buckets.map((b) => new Date(b.bucketStart).getTime());
  const minTime = Math.min(...times);
  const maxTime = Math.max(...times);
  const byTime = new Map(buckets.map((b) => [new Date(b.bucketStart).getTime(), b.total]));
  const items = [];
  for (let t = minTime; t <= maxTime; t += 600_000) {
    items.push({ label: bucketRangeLabel(new Date(t)), value: byTime.get(t) || 0 });
  }
  return items;
}

function actionSummaryHtml(a) {
  const d = a.details || {};
  switch (a.actionType) {
    case 'order_created':
      return `${esc(d.customerName || '')} · ${esc(d.phone || '')} · הזמנה מס' ${d.orderNumber ?? ''} · ${money(d.totalAmount || 0)}`;
    case 'payment_recorded_manual':
      return d.orderId != null
        ? `הזמנה #${d.orderId} · ${money(d.amount || 0)} · ${esc(d.method || '')} · ע"י ${esc(d.recordedBy || '')}`
        : `${esc(d.phone || '')} · ${money(d.amount || 0)} · ${esc(d.method || '')} · ע"י ${esc(d.recordedBy || '')}`;
    case 'payment_edited':
      return `הזמנה #${d.orderId ?? ''} · ${money(d.oldAmount || 0)} (${esc(d.oldMethod || '')}) → ${money(d.newAmount || 0)} (${esc(d.newMethod || '')}) · ע"י ${esc(d.adminName || '')}`;
    case 'payment_deleted':
      return `הזמנה #${d.orderId ?? ''} · ${money(d.amount || 0)} · ${esc(d.method || '')} · ע"י ${esc(d.adminName || '')}`;
    case 'payment_received_nedarim':
      return `${esc(d.phone || '')} · ${money(d.paidAmount || 0)} · עסקה ${esc(d.transactionId || '')}`;
    case 'payment_received_nedarim_ivr':
      return `הזמנה #${d.orderId ?? ''} · ${money(d.amount || 0)}${d.note ? ` · ${esc(d.note)}` : ''}`;
    case 'ivr_payment_orphaned':
      return `<span style="color:var(--wine)">${esc(d.customerName || '')} · ${esc(d.phone || '')} · שגיאה: ${esc(d.error || '')}${d.apiCallId ? ` · שיחה ${esc(d.apiCallId)}` : ''}</span>`;
    case 'payment_client_confirmed':
      return `${esc(d.phone || '')} · ${money(d.amount || 0)} · עסקה ${esc(d.transactionId || '')}`;
    case 'redemption_manual_override':
      return `שורה #${d.itemId ?? ''} · ${d.oldQuantityRedeemed ?? 0} → ${d.newQuantityRedeemed ?? 0} · ע"י ${esc(d.adminName || '')}`;
    case 'order_item_edited':
      return `הזמנה #${d.orderId ?? ''} · כמות ${d.oldQuantity ?? ''} → ${d.newQuantity ?? ''} · ע"י ${esc(d.adminName || '')}`;
    case 'order_item_deleted':
      return `הזמנה #${d.orderId ?? ''} · ${esc(d.gender === 'female' ? 'נקבות' : 'זכרים')} × ${d.quantity ?? ''} · ע"י ${esc(d.adminName || '')}`;
    case 'order_deleted':
      return `הזמנה #${d.orderId ?? ''} (מס' ${d.orderNumber ?? ''}) · ${esc(d.customerName || '')} · ע"י ${esc(d.adminName || '')}`;
    case 'payments_reassigned_from_deleted_order':
      return `<span style="color:var(--sage)">הזמנה #${d.fromOrderId ?? ''} ← הזמנה #${d.toOrderId ?? ''} · ${money(d.totalAmount || 0)} (${(d.paymentIds || []).length} תשלומים) · ${esc(d.adminName || '')}</span>`;
    case 'payment_reassign_failed_no_active_order':
      return `<span style="color:var(--wine)">${esc(d.customerName || '')} · ${esc(d.phone || '')} · ${money(d.totalAmount || 0)} נתקעו על הזמנה #${d.fromOrderId ?? ''} שנמחקה, אין ללקוח הזמנה פעילה אחרת</span>`;
    case 'order_cancelled_by_customer':
      return `הזמנה #${d.orderId ?? ''} (מס' ${d.orderNumber ?? ''}) · ${esc(d.customerName || '')} · ${esc(d.phone || '')}`;
    case 'payment_coordinated_set':
      return d.orderIds
        ? `${esc(d.customerName || '')} · ${esc(d.phone || '')} · ${d.orderIds.length} הזמנות · ${d.coordinated ? 'סומן כתואם' : 'בוטל תיאום'} · ע"י ${esc(d.adminName || '')}`
        : `הזמנה #${d.orderId ?? ''} (מס' ${d.orderNumber ?? ''}) · ${esc(d.customerName || '')} · ${d.coordinated ? 'סומן כתואם' : 'בוטל תיאום'} · ע"י ${esc(d.adminName || '')}`;
    case 'sms_bulk_sent': {
      if (d.error) {
        return `<span style="color:var(--wine)">כישלון מוחלט (${d.failedCount ?? 0} נמענים) — ${esc(d.error)}</span> · ע"י ${esc(d.sentBy || '')}`;

      return `${esc(d.phone || '')} · ${money(d.amount || 0)} · ע"י ${esc(d.adminName || '')}`;

      return `${esc(d.customerName || '')} · ${esc(d.slotName || '')} · ${d.maleQuantity || 0} זכרים + ${d.femaleQuantity || 0} נקבות · קוד ${esc(d.confirmationCode || '')}`;
    case 'settings_updated':
      return `שדות: ${esc((d.changedKeys || []).join(', '))}`;
    case 'slot_created':
    case 'slot_updated':
      return esc(d.name || '');
    case 'slot_deleted':
      return `${esc(d.name || '')} (נמחק לגמרי)`;
    case 'admin_created':
    case 'admin_updated':
      return `${esc(d.name || '')} · ${esc(d.phone || '')}`;
    case 'admin_deleted':
      return `${esc(d.name || '')} · ${esc(d.phone || '')}`;
    case 'admin_login':
      return `${esc(d.name || d.phone || '')} · ${d.method === 'otp' ? 'קוד סמס' : d.method === 'password_bootstrap' ? 'סיסמת בוטסטרפ' : 'סיסמה'}`;
    case 'hard_reset':
      return `בוצע ע"י ${esc(d.performedBy || '')}`;
    default:
      return esc(JSON.stringify(d));
  }
}

async function renderActionLogTab(presetQuery = '') {
  let loadedActions = await api(`/admin/action-log?limit=${ACTION_LOG_PAGE_SIZE}&offset=0`);
  let hasMore = loadedActions.length === ACTION_LOG_PAGE_SIZE;
  // רק סוגי פעולות שבאמת מופיעים בעמוד שנטען (לא כל הסוגים האפשריים
  // במערכת) — כדי שהפאנל לא יתמלא באפשרויות סינון ריקות. כשטוענים עוד
  // (טען עוד) מוסיפים לפאנל סוגים חדשים שעוד לא הופיעו, ראו addMissingActionTypeCheckboxes.
  const initialTypes = [...new Set(loadedActions.map((a) => a.actionType))];

  document.getElementById('tabContent').innerHTML = `
    <div class="card">
      <div class="tab-header-row">
        <div>
          <h2 style="margin:0">יומן פעולות</h2>
          <p class="hint" style="margin:4px 0 0" id="actionLogCountHint"></p>
        </div>
      </div>
      <label for="actionLogSearch">חיפוש (טלפון, שם, מספר הזמנה וכו')</label>
      <input type="text" id="actionLogSearch" placeholder="הקלידו טלפון, שם, מספר הזמנה..." value="${esc(presetQuery)}">
      <div class="filter-row">
        <div class="multiselect" id="msActionType">
          <button type="button" class="multiselect-btn" data-ms-toggle>סוג פעולה <span class="ms-count" data-ms-count></span></button>
          <div class="multiselect-panel" hidden>
            ${initialTypes.map((t) => `<label><input type="checkbox" class="filterActionTypeCheck" value="${esc(t)}" checked> ${esc(ACTION_LABELS[t] || t)}</label>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <table class="compact-table" id="actionLogTable"></table>
      <button class="secondary" type="button" id="actionLogLoadMore" style="width:100%;margin-top:10px" ${hasMore ? '' : 'hidden'}>טען עוד</button>
    </div>
  `;

  function updateCountHint() {
    document.getElementById('actionLogCountHint').textContent = `${loadedActions.length} פעולות נטענו, מהחדשה לישנה.`;
  }

  function renderRows(list) {
    document.getElementById('actionLogTable').innerHTML = list.length
      ? list.map(actionLogRowHtml).join('')
      : `<tr><td class="hint">${loadedActions.length ? 'לא נמצאו פעולות תואמות לסינון.' : 'אין עדיין פעולות רשומות.'}</td></tr>`;
  }

  function applyActionLogFilter() {
    const checked = [...document.querySelectorAll('.filterActionTypeCheck:checked')].map((cb) => cb.value);
    const q = document.getElementById('actionLogSearch').value.trim().toLowerCase();
    renderRows(loadedActions.filter((a) => checked.includes(a.actionType) && (!q || actionLogSearchText(a).includes(q))));
  }

  function addMissingActionTypeCheckboxes(types) {
    const panel = document.querySelector('#msActionType .multiselect-panel');
    const existing = new Set([...panel.querySelectorAll('.filterActionTypeCheck')].map((cb) => cb.value));
    const missing = types.filter((t) => !existing.has(t));
    if (!missing.length) return;
    panel.insertAdjacentHTML('beforeend', missing.map((t) => `<label><input type="checkbox" class="filterActionTypeCheck" value="${esc(t)}" checked> ${esc(ACTION_LABELS[t] || t)}</label>`).join(''));
    wireMultiSelectDropdown('msActionType', '.filterActionTypeCheck', applyActionLogFilter);
  }

  document.getElementById('actionLogLoadMore').onclick = async () => {
    const btn = document.getElementById('actionLogLoadMore');
    btn.disabled = true;
    btn.textContent = 'טוען...';
    try {
      const next = await api(`/admin/action-log?limit=${ACTION_LOG_PAGE_SIZE}&offset=${loadedActions.length}`);
      loadedActions = loadedActions.concat(next);
      hasMore = next.length === ACTION_LOG_PAGE_SIZE;
      addMissingActionTypeCheckboxes([...new Set(next.map((a) => a.actionType))]);
      updateCountHint();
      applyActionLogFilter();
    } finally {
      btn.disabled = false;
      btn.textContent = 'טען עוד';
      btn.hidden = !hasMore;
    }
  };

  document.getElementById('actionLogSearch').oninput = applyActionLogFilter;
  updateCountHint();
  applyActionLogFilter();
  wireMultiSelectDropdown('msActionType', '.filterActionTypeCheck', applyActionLogFilter);
}

// ============== אתחול ==============

async function init() {
  const session = await api('/admin/session');
  if (session.isAdmin) loadShell(session);
  else screenLogin();
}
init().catch((err) => render(`<div class="error">שגיאה בטעינת המערכת: ${err.message}</div>`));
</script>
</body>
</html>
