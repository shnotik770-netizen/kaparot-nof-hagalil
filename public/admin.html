<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול — כפרות נוף הגליל</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .wrap{max-width:760px}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
  .tabs button{white-space:nowrap;background:var(--surface);border:1.5px solid var(--line);color:var(--ink-dim)}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--ink-dim);font-size:12px}
  .row{display:flex;gap:10px;align-items:center}
  .row > *{flex:1}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .toggle-row:first-child{border-top:none}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px}
  legend{font-size:12.5px;font-weight:700;color:var(--ink-dim);padding:0 6px}
  .perm-checks{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}
  .perm-checks label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink);margin:0}
  .perm-checks input{width:auto}
  .slot-card{border-inline-start:5px solid var(--accent);position:relative}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .filter-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .filter-row > div{flex:1 1 130px;min-width:0}
  .filter-row label{font-size:11px;margin:0 0 3px}
  .filter-row select{font-size:13px;padding:9px 8px}
  .multiselect{position:relative}
  .multiselect-btn{width:100%;text-align:right;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .multiselect-btn .ms-count{color:var(--ink-dim);font-weight:700;font-size:11.5px}
  .multiselect-panel{position:absolute;z-index:20;top:calc(100% + 4px);right:0;left:0;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
  .multiselect-panel[hidden]{display:none}
  .multiselect-panel label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);margin:0;white-space:nowrap}
  .colorpick{display:flex;align-items:center;gap:8px}
  .colorpick input[type=color]{width:44px;height:38px;padding:2px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
  .inline-hint{font-size:12px;color:var(--ink-dim);margin:2px 0 0}
  .admin-card .row{margin-bottom:8px}
  .big-action{font-size:16.5px;padding:15px 18px}
  .compact-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .compact-row .swatch{width:16px;height:16px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .compact-row .compact-main{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:2px}
  .compact-row .compact-main b{font-size:14.5px}
  .compact-row .pill{white-space:nowrap}
  .edit-panel{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .compact-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .compact-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .compact-table tr:last-child td{border-bottom:none}
  .pending-payment-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
  .pending-payment-line .ghost{color:inherit;text-decoration:underline;font-size:12px;padding:2px 4px;width:auto}
  .redeem-group-card{border-inline-start:5px solid var(--accent)}
  .redeem-group-card .warn-pill{background:var(--wine-soft);color:var(--wine);font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
  .tab-header-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:4px}
  .corner-actions{display:flex;gap:6px;flex-wrap:wrap}
  .mini-btn{font-size:12px;font-weight:700;padding:7px 11px;border-radius:20px;background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--line);cursor:pointer;width:auto}
  .mini-btn:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .fully-pill{background:var(--sage-soft);color:var(--sage);font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
  .phone-sms-trigger{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
  .phone-sms-trigger:hover{color:var(--accent-ink)}
  .agg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .agg-row:first-child{border-top:none}
  .agg-row .agg-label{flex:1 1 140px;min-width:0;font-size:13.5px;font-weight:700}
  .agg-row .agg-controls{display:flex;align-items:center;gap:8px}
  .agg-row .agg-controls input{width:64px;padding:8px}
  #slotStatusBar{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  #slotStatusBar:empty{display:none}
  .slot-status-chip{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11.5px;font-weight:700;border-inline-start:3px solid var(--accent);padding-inline-start:8px;flex:none}
  .slot-status-chip .pill{font-size:10px;padding:2px 7px}
  .chart-wrap{overflow-x:auto;padding-top:22px}
  .chart-bars{display:flex;align-items:flex-end;gap:6px;height:140px;min-width:min-content;direction:ltr}
  .chart-bar-col{flex:0 0 30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .chart-bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;position:relative}
  .chart-bar-value{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-dim);white-space:nowrap}
  .chart-labels{display:flex;gap:6px;direction:ltr;margin-top:6px}
  .chart-labels span{flex:0 0 30px;font-size:10px;color:var(--ink-dim);text-align:center;white-space:nowrap}
  .chart-empty{color:var(--ink-dim);font-size:13px}
</style>
</head>
<body>
<div class="topbar"><h1>🐔 ניהול כפרות</h1><span class="badge" id="whoBadge"></span></div>
<div id="slotStatusBar"></div>
<div class="wrap" id="app"><div class="loading">טוען…</div></div>

<script>
const GENDER_LABEL = { male: 'זכרים', female: 'נקבות' };
const STATUS_LABEL = { paid: 'שולם', partial: 'חלקי', unpaid: 'לא שולם' };

// תג סטטוס תשלום ללקוח: אם "לא שולם" אבל כל ההזמנות הפתוחות שלו תואמו מול
// המשרד (payment_coordinated), מוסיפים "· מתואם" ומחליפים את האדום המזהיר
// בצבע רגוע יותר — זה חוב ידוע ועקוב, לא בעיה שצריך לטפל בה.
function customerPaymentPillHtml(c) {
  const openOrders = c.orders.filter((o) => o.paymentStatus !== 'paid');
  const coordinated = c.paymentStatus === 'unpaid' && openOrders.length > 0 && openOrders.every((o) => o.paymentCoordinated);
  return `<span class="pill ${c.paymentStatus}${coordinated ? ' coordinated' : ''}">${STATUS_LABEL[c.paymentStatus]}${coordinated ? ' · מתואם' : ''}</span>`;
}
const METHOD_LABEL = { nedarim_plus: 'נדרים פלוס', manual_cash: 'מזומן', manual_card: 'אשראי ידני', manual_admin: 'אחר' };

// דוח CSV של כל התשלומים — phonesFilter=null להורדת הכל, או מערך טלפונים
// (מהסינון הנוכחי בטאב הזמנות) להורדת רק תשלומי הלקוחות שעברו את הסינון.
async function downloadPaymentsCsv(phonesFilter) {
  const payments = await api('/admin/payments');
  const filtered = phonesFilter ? payments.filter((p) => phonesFilter.includes(p.phone)) : payments;
  const header = ['תאריך', 'הזמנה מס\'', 'שם לקוח', 'טלפון', 'סכום', 'אמצעי', 'נרשם ע"י'];
  const rows = filtered.map((p) => [
    new Date(p.createdAt).toLocaleString('he-IL'), p.orderNumber, p.customerName, p.phone,
    p.amount, METHOD_LABEL[p.method] || p.method, p.recordedBy,
  ]);
  const csv = '﻿' + [header, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `דוח-תשלומים${phonesFilter ? '-מסונן' : ''}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
// סדר המפתחות כאן קובע את סדר הטאבים בתפריט. 'settings' ו'slots' אוחדו
// לכפתור אחד (ראו renderSettingsTab) — עדיין שתי הרשאות נפרדות, אבל ניווט משותף.
const TAB_TITLES = { orders: 'הזמנות ותשלומים', dashboard: 'דשבורד', settings: 'הגדרות וזמני חלוקה', actionLog: 'יומן פעולות' };
// 'יומן פעולות' משתמש בהרשאת 'הגדרות' (אין לו הרשאה נפרדת משלו — כל מי שרואה הגדרות רואה גם את היומן)
const TAB_PERMISSION = { actionLog: 'settings' };

let currentTab = null;
let myPermissions = {};

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'שגיאה לא צפויה.'); err.data = data; throw err; }
  return data;
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function render(html) { document.getElementById('app').innerHTML = html; }
function money(n) { return `₪${Number(n).toLocaleString('he-IL', { maximumFractionDigits: 0 })}`; }
function esc(s) { return String(s ?? '').replace(/"/g, '&quot;'); }
// הבדל מ-esc(): מיועד לתוכן טקסט (לא attribute) שמקורו חיצוני (תגובות ימות
// המשיח) — חוסם גם < > & כדי שלא יישברו את ה-HTML או יריצו תגיות.
function escHtml(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
// תצוגת תוצאות קריאות בדיקה חופשיות לימות המשיח: לכל שורה — מה נשלח
// (בלי token) ומה חזר, כולל קוד HTTP.
function yemotResultsHtml(results) {
  return results.map((r) => {
    const ok = r.response?.responseStatus === 'OK';
    return `
      <div class="notice${ok ? '' : ' critical'}" style="margin-top:10px;text-align:right">
        ${r.webService ? `<div><b>שירות:</b> ${escHtml(r.webService)}</div>` : ''}
        <div style="margin-top:6px"><b>נשלח:</b></div>
        <pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;margin:4px 0">${escHtml(JSON.stringify(r.sentParams, null, 2))}</pre>
        <div style="margin-top:6px"><b>תגובת ימות המשיח (HTTP ${r.httpStatus ?? '—'}):</b></div>
        <pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;margin:4px 0">${escHtml(JSON.stringify(r.response, null, 2))}</pre>
      </div>
    `;
  }).join('');
}
// זהה ללוגיקת normalizePhone בשרת (src/lib/normalize.js) — לזיהוי לקוח קיים בצד הלקוח בלבד.
function normalizePhoneClient(phone) {
  let digits = String(phone || '').replace(/\D/g, '');
  if (digits.indexOf('972') === 0) digits = '0' + digits.substring(3);
  else if (digits.length === 9 && digits.charAt(0) !== '0') digits = '0' + digits;
  return digits;
}

function toDateInputValue(dateStr) {
  if (!dateStr) return '';
  return String(dateStr).slice(0, 10);
}
function toLocalDatetimeInputValue(isoString) {
  if (!isoString) return '';
  const d = new Date(isoString);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalDatetimeInputValue(value) {
  if (!value) return null;
  return new Date(value).toISOString();
}

// ============== כניסה ==============

function screenLogin(errorMsg, mode = 'password') {
  render(`
    <div class="card">
      <h2>כניסת מנהל</h2>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      <div class="tabs">
        <button class="${mode === 'password' ? 'active' : ''}" id="tabPassword">סיסמה קבועה</button>
        <button class="${mode === 'otp' ? 'active' : ''}" id="tabOtp">קוד חד-פעמי בסמס</button>
      </div>
      <label for="phoneInput">מספר טלפון מנהל</label>
      <input type="tel" id="phoneInput" inputmode="numeric" placeholder="05XXXXXXXX">
      ${mode === 'password' ? `
        <label for="pwInput">סיסמה</label>
        <input type="password" id="pwInput">
        <div class="spacer"></div>
        <button class="primary" id="pwSubmit">כניסה</button>
      ` : `
        <div class="spacer"></div>
        <button class="primary" id="otpRequest">שליחת קוד</button>
        <div id="otpVerifyBlock" style="display:none">
          <label for="codeInput">קוד</label>
          <input type="text" id="codeInput" inputmode="numeric" maxlength="6">
          <div class="spacer"></div>
          <button class="primary" id="otpVerify">כניסה</button>
        </div>
      `}
    </div>
  `);
  document.getElementById('tabPassword').onclick = () => screenLogin(null, 'password');
  document.getElementById('tabOtp').onclick = () => screenLogin(null, 'otp');
  if (mode === 'password') {
    document.getElementById('pwSubmit').onclick = async () => {
      try {
        const phone = document.getElementById('phoneInput').value.trim();
        const res = await api('/admin/login-password', { method: 'POST', body: { phone, password: document.getElementById('pwInput').value } });
        loadShell(res);
      } catch (err) { screenLogin(err.message, 'password'); }
    };
  } else {
    document.getElementById('otpRequest').onclick = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      try {
        await api('/admin/otp/request', { method: 'POST', body: { phone } });
        document.getElementById('otpVerifyBlock').style.display = 'block';
      } catch (err) { screenLogin(err.message, 'otp'); }
    };
    document.getElementById('otpVerify').onclick = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      try {
        const res = await api('/admin/otp/verify', { method: 'POST', body: { phone, code } });
        loadShell(res);
      } catch (err) { screenLogin(err.message, 'otp'); }
    };
  }
}

// ============== מעטפת + טאבים ==============

function loadShell(session) {
  myPermissions = session.permissions || {};
  document.getElementById('whoBadge').innerHTML = `
    ${esc(session.name || '')} · <button class="ghost" id="logoutBtn" style="color:#fff">יציאה</button>
  `;
  const availableTabs = Object.keys(TAB_TITLES).filter((t) => (
    t === 'settings' ? (myPermissions.settings || myPermissions.slots) : myPermissions[TAB_PERMISSION[t] || t]
  ));
  if (!availableTabs.length) {
    render(`<div class="card"><div class="error">לחשבון זה אין הרשאה לאף מסך ניהול. פנה למנהל אחר להוספת הרשאות.</div></div>`);
    return;
  }
  render(`
    <div class="tabs">
      ${availableTabs.map((t) => `<button data-tab="${t}">${TAB_TITLES[t]}</button>`).join('')}
    </div>
    <div id="tabContent"><div class="loading">טוען…</div></div>
  `);
  document.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
  document.getElementById('logoutBtn').onclick = async () => { await api('/admin/logout', { method: 'POST' }); screenLogin(); };
  renderSlotStatusBar();
  showTab(currentTab && availableTabs.includes(currentTab) ? currentTab : availableTabs[0]);
}

// ============== שורת מצב קלילה לזמני חלוקה — מתחת לכותרת, בכל טאב ==============

async function renderSlotStatusBar() {
  const bar = document.getElementById('slotStatusBar');
  if (!bar) return;
  if (!myPermissions.orders && !myPermissions.slots) { bar.innerHTML = ''; return; }
  try {
    const slots = await api('/admin/slots');
    bar.innerHTML = slots.map((s) => `
      <span class="slot-status-chip" style="border-inline-start-color:${esc(s.color || 'var(--accent)')}">
        <b>${esc(s.name)}</b>
        <span class="pill ${s.isOpenForRegistration ? 'paid' : 'unpaid'}">${s.isOpenForRegistration ? 'פתוח להזמנה' : 'סגור להזמנה'}</span>
        <span class="pill ${s.isOpenForPickup ? 'paid' : 'unpaid'}">${s.isOpenForPickup ? 'פתוח לאיסוף' : 'סגור לאיסוף'}</span>
      </span>
    `).join('');
  } catch {
    bar.innerHTML = '';
  }
}

async function attemptQuickRedeem(phone, slotId, maleQuantity, femaleQuantity, allowUnpaid, msgElementId, onDone) {
  const msgBox = document.getElementById(msgElementId);
  try {
    const result = await api('/admin/redeem/confirm-slot', {
      method: 'POST',
      body: { phone, slotId, maleQuantity, femaleQuantity, allowUnpaid },
    });
    if (msgBox) msgBox.innerHTML = `<div class="success">נאסף בהצלחה: ${result.maleQuantity} זכרים + ${result.femaleQuantity} נקבות מ"${esc(result.slotName)}".</div>`;
    if (onDone) onDone();
  } catch (err) {
    if (err.data?.paymentBlocked) {
      if (confirm(`${err.message}\nההזמנה לא שולמה (או שולמה חלקית). האם אתה בטוח שברצונך לממש בכל זאת?`)) {
        return attemptQuickRedeem(phone, slotId, maleQuantity, femaleQuantity, true, msgElementId, onDone);
      }
      return;
    }
    if (msgBox) msgBox.innerHTML = `<div class="error">${err.message}</div>`;
    else alert(err.message);
  }
}

function markActiveTab(tab) {
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
}

async function showTab(tab) {
  currentTab = tab;
  markActiveTab(tab);
  if (tab !== 'orders') quickEventModeOn = false;
  const content = document.getElementById('tabContent');
  content.innerHTML = '<div class="loading">טוען…</div>';
  if (tab === 'settings') return renderSettingsTab();
  if (tab === 'orders') return renderOrdersTab();
  if (tab === 'dashboard') return renderDashboardTab();
  if (tab === 'actionLog') return renderActionLogTab();
}

// פתיחת טאב היומן עם חיפוש ממולא מראש לפי טלפון — משמש מכפתור "היסטוריית
// שינויים" בכרטיס לקוח (ראו wireCustomerCardButtons).
async function openActionLogForPhone(phone) {
  currentTab = 'actionLog';
  markActiveTab('actionLog');
  quickEventModeOn = false;
  document.getElementById('tabContent').innerHTML = '<div class="loading">טוען…</div>';
  await renderActionLogTab(phone);
}

// ============== הגדרות ==============

async function renderSettingsTab() {
  const content = document.getElementById('tabContent');
  content.innerHTML = `<div id="settingsCore"></div><div id="slotsSubSection"></div>`;
  if (myPermissions.settings) await renderSettingsCore();
  if (myPermissions.slots) renderSlotsTab('slotsSubSection');
}

async function renderSettingsCore() {
  const s = await api('/admin/settings');
  const content = document.getElementById('settingsCore');
  content.innerHTML = `
    <div class="card">
      <h2>טקסטים ניתנים לעריכה</h2>
      <label>כותרת הטופס</label>
      <input type="text" id="orderTitle" value="${esc(s.orderTitle)}">
      <label>כותרת משנה (מוצגת מתחת לכותרת הראשית)</label>
      <input type="text" id="orderSubtitle" value="${esc(s.orderSubtitle)}">
      <label>הודעת "רישום סגור" (מוצגת גם כשאין זמן חלוקה פתוח, לא רק כשהרישום סגור ידנית)</label>
      <input type="text" id="closedRegMsg" value="${esc(s.closedRegistrationMessage)}">
      <label>הודעת "תשלום דחוי" (בסיום הרשמה)</label>
      <input type="text" id="deferredNotice" value="${esc(s.deferredPaymentNotice)}">

    <div class="card">

      <button class="primary" id="saveSheetsSync">שמירה</button>

    <div class="card admin-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">

        <button class="primary" id="toggleAddAdmin" style="width:auto">+ הוספת מנהל</button>
      </div>

      <div id="addAdminCard" hidden>
        <fieldset>
          <legend>הוספת מנהל חדש</legend>
          <label>שם</label>
          <input type="text" id="newAdminName">
          <label>טלפון</label>
          <input type="tel" id="newAdminPhone" inputmode="numeric" placeholder="05XXXXXXXX">
          <label>סיסמה (לפחות 6 תווים)</label>
          <input type="password" id="newAdminPassword">
          <div class="perm-checks">
            <label><input type="checkbox" id="newPermSettings" checked> הגדרות</label>
            <label><input type="checkbox" id="newPermOrders" checked> הזמנות ותשלומים</label>
            <label><input type="checkbox" id="newPermDashboard" checked> דשבורד</label>
            <label><input type="checkbox" id="newPermSlots" checked> זמני חלוקה</label>
          </div>
          <button class="primary big-action" id="addAdmin" style="width:100%">הוספת מנהל</button>
        </fieldset>
      </div>
      <div id="adminsList"><div class="loading">טוען…</div></div>
    </div>

    <div class="card">
      <h2>בדיקת קריאות API חופשיות לימות המשיח</h2>
      <p class="hint">כל שורה = קריאה בפורמט WebServiceName?param1=val1&param2=val2 (בדיוק כמו בכתובת ה-API עצמה, בלי הכתובת הבסיסית ובלי token — הטוקן מתווסף אוטומטית מהשרת ולעולם לא נלקח ממה שכתוב כאן). אפשר כמה שורות בבת אחת.</p>
      <textarea id="ivrTestCode" rows="4" placeholder="GetIVR2Dir?path=/&#10;GetCustomerData"></textarea>
      <div class="spacer"></div>
      <button class="primary" id="runIvrTest">שליחה לימות המשיח</button>
      <div id="ivrTestResults"></div>
    </div>

    <div class="card">
      <h2>איפוס קשיח</h2>
      <p class="hint">מוחק את כל ההזמנות, התשלומים והמשיכות. לא ניתן לשחזר. משתמשים בזה בסוף העונה או לניקוי בדיקות.</p>
      <label>הקלידו "איפוס" לאישור</label>
      <input type="text" id="resetConfirm">
      <div class="spacer"></div>
      <button class="danger" id="hardReset" style="width:100%">איפוס קשיח של כל הנתונים</button>
    </div>
    <div id="settingsMsg"></div>
    <div id="slotsSubSection"></div>
  `;

  document.getElementById('saveTexts').onclick = async () => {
    await api('/admin/settings', { method: 'PUT', body: {
      order_title: document.getElementById('orderTitle').value,
      order_subtitle: document.getElementById('orderSubtitle').value,
      closed_registration_message: document.getElementById('closedRegMsg').value,
      deferred_payment_notice: document.getElementById('deferredNotice').value,
      unpaid_block_message: document.getElementById('unpaidMsg').value,
      partial_payment_notice: document.getElementById('partialMsg').value,
      sms_otp_template: document.getElementById('otpTemplate').value,
    }});
    flash('נשמר.');
  };
  document.getElementById('saveWelcome').onclick = async () => {
    await api('/admin/settings', { method: 'PUT', body: {
      welcome_notice_title: document.getElementById('welcomeTitle').value,
      welcome_notice_body: document.getElementById('welcomeBody').value,
    }});
    flash('נשמר.');
  };
  document.getElementById('saveSheetsSync').onclick = async () => {
    await api('/admin/settings', { method: 'PUT', body: {
      sheets_sync_enabled: document.getElementById('sheetsSyncEnabled').checked,
    }});
    flash('נשמר.');
  };
  document.getElementById('runIvrTest').onclick = async () => {
    const btn = document.getElementById('runIvrTest');
    const out = document.getElementById('ivrTestResults');
    const code = document.getElementById('ivrTestCode').value;
    btn.disabled = true;
    out.innerHTML = `<p class="hint">שולח…</p>`;
    try {
      const { results } = await api('/admin/ivr/test-call', { method: 'POST', body: { code } });
      out.innerHTML = yemotResultsHtml(results);
    } catch (err) {
      out.innerHTML = `<div class="notice critical" style="margin-top:10px">${escHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  };
  document.getElementById('hardReset').onclick = async () => {
    const confirmText = document.getElementById('resetConfirm').value;
    try {
      await api('/admin/hard-reset', { method: 'POST', body: { confirmText } });
      flash('המערכת אופסה.');
    } catch (err) { flash(err.message, true); }
  };
  document.getElementById('toggleAddAdmin').onclick = () => {
    const card = document.getElementById('addAdminCard');
    card.hidden = !card.hidden;
  };
  document.getElementById('addAdmin').onclick = async () => {
    try {
      await api('/admin/admins', { method: 'POST', body: {
        name: document.getElementById('newAdminName').value,
        phone: document.getElementById('newAdminPhone').value,
        password: document.getElementById('newAdminPassword').value,
        permissions: {
          settings: document.getElementById('newPermSettings').checked,
          orders: document.getElementById('newPermOrders').checked,
          dashboard: document.getElementById('newPermDashboard').checked,
          slots: document.getElementById('newPermSlots').checked,
        },
      }});
      document.getElementById('newAdminName').value = '';
      document.getElementById('newAdminPhone').value = '';
      document.getElementById('newAdminPassword').value = '';
      document.getElementById('addAdminCard').hidden = true;
      flash('המנהל נוסף.');
      renderAdminsList();
    } catch (err) { flash(err.message, true); }
  };

  renderAdminsList();
}

const PERM_LABELS = { settings: 'הגדרות', orders: 'הזמנות', dashboard: 'דשבורד', slots: 'זמני חלוקה' };

async function renderAdminsList() {
  const box = document.getElementById('adminsList');
  const admins = await api('/admin/admins');
  if (!admins.length) {
    box.innerHTML = `<p class="hint">אין עדיין מנהלים רשומים.</p>`;
    return;
  }
  box.innerHTML = `
    <table class="compact-table">
      ${admins.map((a) => `
        <tr>
          <td><b>${esc(a.name)}</b><br><span class="meta">${esc(a.phone)}</span></td>
          <td class="meta">${Object.keys(PERM_LABELS).filter((k) => a.permissions[k]).map((k) => PERM_LABELS[k]).join(', ') || 'ללא הרשאות'}</td>
          <td style="text-align:left"><button class="ghost" data-toggle-admin="${a.id}">עריכה</button></td>
        </tr>
      `).join('')}
    </table>
    ${admins.map((a) => `
      <div class="edit-panel" id="adminEdit${a.id}" hidden>
        <div class="row">
          <div>
            <label>שם</label>
            <input type="text" data-field="name" data-id="${a.id}" value="${esc(a.name)}">
          </div>
          <div>
            <label>טלפון</label>
            <input type="tel" data-field="phone" data-id="${a.id}" value="${esc(a.phone)}">
          </div>
        </div>
        <label>סיסמה חדשה (השאירו ריק כדי לא לשנות)</label>
        <input type="password" data-field="password" data-id="${a.id}" placeholder="••••••">
        <div class="perm-checks">
          <label><input type="checkbox" data-perm="settings" data-id="${a.id}" ${a.permissions.settings ? 'checked' : ''}> הגדרות</label>
          <label><input type="checkbox" data-perm="orders" data-id="${a.id}" ${a.permissions.orders ? 'checked' : ''}> הזמנות ותשלומים</label>
          <label><input type="checkbox" data-perm="dashboard" data-id="${a.id}" ${a.permissions.dashboard ? 'checked' : ''}> דשבורד</label>
          <label><input type="checkbox" data-perm="slots" data-id="${a.id}" ${a.permissions.slots ? 'checked' : ''}> זמני חלוקה</label>
        </div>
        <div class="row">
          <button class="primary big-action" data-save-admin="${a.id}">שמירה</button>
          <button class="danger big-action" data-delete-admin="${a.id}">מחיקה</button>
        </div>
      </div>
    `).join('')}
  `;

  box.querySelectorAll('[data-toggle-admin]').forEach((b) => {
    b.onclick = () => {
      const panel = document.getElementById(`adminEdit${b.dataset.toggleAdmin}`);
      panel.hidden = !panel.hidden;
    };
  });
  box.querySelectorAll('[data-save-admin]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.saveAdmin;
      const name = box.querySelector(`[data-field="name"][data-id="${id}"]`).value;
      const phone = box.querySelector(`[data-field="phone"][data-id="${id}"]`).value;
      const password = box.querySelector(`[data-field="password"][data-id="${id}"]`).value;
      const permissions = {
        settings: box.querySelector(`[data-perm="settings"][data-id="${id}"]`).checked,
        orders: box.querySelector(`[data-perm="orders"][data-id="${id}"]`).checked,
        dashboard: box.querySelector(`[data-perm="dashboard"][data-id="${id}"]`).checked,
        slots: box.querySelector(`[data-perm="slots"][data-id="${id}"]`).checked,
      };
      try {
        await api(`/admin/admins/${id}`, { method: 'PUT', body: { name, phone, password, permissions } });
        flash('המנהל עודכן.');
        renderAdminsList();
      } catch (err) { flash(err.message, true); }
    };
  });
  box.querySelectorAll('[data-delete-admin]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('למחוק את המנהל הזה?')) return;
      await api(`/admin/admins/${b.dataset.deleteAdmin}`, { method: 'DELETE' });
      renderAdminsList();
    };
  });
}

function flash(msg, isError) {
  document.getElementById('settingsMsg').innerHTML = `<div class="${isError ? 'error' : 'success'}">${msg}</div>`;
}

// ============== זמני חלוקה ==============

function slotFormHtml(prefix, s) {
  s = s || {};
  return `
    <label>שם הזמן</label>
    <input type="text" id="${prefix}Name" placeholder="לדוגמה: חמישי בוקר" value="${esc(s.name)}">
    <div class="cols2">
      <div>
        <label>תאריך אספקה</label>
        <input type="date" id="${prefix}Date" value="${toDateInputValue(s.supplyDate)}">
      </div>
      <div>
        <label>יום (בעברית)</label>
        <div class="row">
          <input type="text" id="${prefix}DayLabel" value="${esc(s.dayLabel)}">
          <button type="button" class="ghost" id="${prefix}Suggest">הצעה אוטומטית</button>
        </div>
      </div>
    </div>
    <label>שעות</label>
    <input type="text" id="${prefix}Hours" placeholder="לדוגמה: 08:00–12:00" value="${esc(s.hoursLabel)}">
    <div class="cols2">
      <div>
        <label>מחיר זכר (₪)</label>
        <input type="number" min="0" step="1" id="${prefix}PriceMale" value="${s.priceMale ?? ''}">
      </div>
      <div>
        <label>מחיר נקבה (₪)</label>
        <input type="number" min="0" step="1" id="${prefix}PriceFemale" value="${s.priceFemale ?? ''}">
      </div>
    </div>
    <label>צבע לזיהוי (כרטיס האיסוף)</label>
    <div class="colorpick">
      <input type="color" id="${prefix}Color" value="${esc(s.color || '#a5741f')}">
      <span class="inline-hint">מוצג במסך "איסוף והצגה למחלק העופות"</span>
    </div>
    <label>זמן סגירת הרשמה</label>
    <input type="datetime-local" id="${prefix}CloseAt" value="${toLocalDatetimeInputValue(s.registrationCloseAt)}">
    <div class="toggle-row"><span>פתוח ידנית להרשמה גם אחרי זמן הסגירה</span><input type="checkbox" id="${prefix}Override" ${s.manualOpenOverride ? 'checked' : ''}></div>
    <div class="toggle-row"><span>פתוח כעת לאספקה (משיכת עופות)</span><input type="checkbox" id="${prefix}Pickup" ${s.openForPickup ? 'checked' : ''}></div>
    <label>קוד לשלוחה הטלפונית (ספרה 1-9, ריק = לא מופיע בתפריט הטלפוני)</label>
    <input type="text" id="${prefix}IvrCode" inputmode="numeric" maxlength="1" placeholder="לדוגמה: 1" value="${esc(s.ivrCode)}">
    <label>טקסט הקראה לשלוחה הטלפונית (ריק = לא יופיע בתפריט הטלפוני גם אם יש קוד)</label>
    <input type="text" id="${prefix}IvrAnnouncement" placeholder="לדוגמה: יום חמישי אחר הצהריים" value="${esc(s.ivrAnnouncement)}">
  `;
}

function readSlotForm(prefix) {
  return {
    name: document.getElementById(`${prefix}Name`).value.trim(),
    supplyDate: document.getElementById(`${prefix}Date`).value,
    dayLabel: document.getElementById(`${prefix}DayLabel`).value.trim(),
    hoursLabel: document.getElementById(`${prefix}Hours`).value.trim(),
    priceMale: Number(document.getElementById(`${prefix}PriceMale`).value),
    priceFemale: Number(document.getElementById(`${prefix}PriceFemale`).value),
    color: document.getElementById(`${prefix}Color`).value,
    registrationCloseAt: fromLocalDatetimeInputValue(document.getElementById(`${prefix}CloseAt`).value),
    manualOpenOverride: document.getElementById(`${prefix}Override`).checked,
    openForPickup: document.getElementById(`${prefix}Pickup`).checked,
    ivrCode: document.getElementById(`${prefix}IvrCode`).value.trim(),
    ivrAnnouncement: document.getElementById(`${prefix}IvrAnnouncement`).value.trim(),
  };
}

function slotCompactRowHtml(s) {
  return `
    <div class="compact-row">
      <span class="swatch" style="background:${esc(s.color)}"></span>
      <div class="compact-main">
        <b>${esc(s.name)}</b>
        <span class="meta">${esc(s.hebrewDate)}${s.hoursLabel ? ' · ' + esc(s.hoursLabel) : ''} · ${money(s.priceMale)}/${money(s.priceFemale)}</span>
      </div>
      <span class="pill ${s.isOpenForRegistration ? 'paid' : 'unpaid'}">${s.isOpenForRegistration ? 'פתוח להרשמה' : 'סגור להרשמה'}</span>
      <span class="pill ${s.isOpenForPickup ? 'paid' : 'unpaid'}">${s.isOpenForPickup ? 'פתוח לאספקה' : 'סגור לאספקה'}</span>
      ${s.ivrCode ? `<span class="pill partial">☎️ ${esc(s.ivrCode)}</span>` : ''}
      <button class="ghost" data-toggle-slot="${s.id}">עריכה</button>
    </div>
  `;
}

async function renderSlotsTab(containerId = 'tabContent') {
  const slots = await api('/admin/slots');
  renderSlotStatusBar();
  const content = document.getElementById(containerId);
  content.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="margin:0">זמני חלוקה קיימים</h2>
      <button class="primary" id="toggleAddSlot" style="width:auto">+ הוספת זמן חלוקה</button>
    </div>
    <div class="card" id="addSlotCard" hidden>
      <h2>הוספת זמן חלוקה חדש</h2>
      ${slotFormHtml('new', {})}
      <div class="spacer"></div>
      <button class="primary big-action" id="addSlot" style="width:100%">הוספת זמן חלוקה</button>
      <div id="newSlotMsg"></div>
    </div>
    ${slots.length ? slots.map((s) => `
      <div class="card slot-card" style="border-inline-start-color:${esc(s.color)}">
        ${slotCompactRowHtml(s)}
        <div class="edit-panel" id="editPanel${s.id}" hidden>
          ${slotFormHtml('s' + s.id, s)}
          <div class="spacer"></div>
          <button class="primary big-action" data-save-slot="${s.id}" style="width:100%">שמירת שינויים</button>
          <div class="spacer"></div>
          <button class="ghost" data-delete-slot="${s.id}" style="color:var(--wine);width:100%">מחיקת זמן חלוקה (רק אם אין לו הזמנות)</button>
          <div id="slotMsg${s.id}"></div>
        </div>
      </div>
    `).join('') : `<div class="card"><p class="hint">אין עדיין זמני חלוקה. הוסיפו אחד למעלה.</p></div>`}
  `;

  document.getElementById('toggleAddSlot').onclick = () => {
    const card = document.getElementById('addSlotCard');
    card.hidden = !card.hidden;
  };
  document.getElementById('newSuggest').onclick = () => {
    const date = document.getElementById('newDate').value;
    if (!date) return;
    api(`/admin/slots/suggest-day-label?date=${encodeURIComponent(date)}`).then((r) => {
      document.getElementById('newDayLabel').value = r.dayLabel;
    });
  };
  document.getElementById('addSlot').onclick = async () => {
    try {
      await api('/admin/slots', { method: 'POST', body: readSlotForm('new') });
      renderSlotsTab(containerId);
    } catch (err) {
      document.getElementById('newSlotMsg').innerHTML = `<div class="error">${err.message}</div>`;
    }
  };

  slots.forEach((s) => {
    const prefix = 's' + s.id;
    document.querySelector(`[data-toggle-slot="${s.id}"]`).onclick = () => {
      const panel = document.getElementById(`editPanel${s.id}`);
      panel.hidden = !panel.hidden;
    };
    document.getElementById(`${prefix}Suggest`).onclick = () => {
      const date = document.getElementById(`${prefix}Date`).value;
      if (!date) return;
      api(`/admin/slots/suggest-day-label?date=${encodeURIComponent(date)}`).then((r) => {
        document.getElementById(`${prefix}DayLabel`).value = r.dayLabel;
      });
    };
    document.querySelector(`[data-save-slot="${s.id}"]`).onclick = async () => {
      try {
        await api(`/admin/slots/${s.id}`, { method: 'PUT', body: readSlotForm(prefix) });
        document.getElementById(`slotMsg${s.id}`).innerHTML = `<div class="success">נשמר.</div>`;
        renderSlotsTab(containerId);
      } catch (err) {
        document.getElementById(`slotMsg${s.id}`).innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
    document.querySelector(`[data-delete-slot="${s.id}"]`).onclick = async () => {
      if (!confirm(`למחוק לגמרי את זמן החלוקה "${s.name}"? פעולה זו סופית.`)) return;
      try {
        await api(`/admin/slots/${s.id}`, { method: 'DELETE' });
        renderSlotsTab(containerId);
      } catch (err) {
        document.getElementById(`slotMsg${s.id}`).innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
  });
}

// ============== הזמנות ותשלומים (תצוגה מקובצת לפי לקוח) ==============

function panelSafeId(phone) { return 'p' + phone.replace(/\D/g, ''); }

// שורות תקציר לכרטיס המכווץ — זמן חלוקה + כמות, ומספר שכבר נמשך אם יש (0 לא מוצג, כדי לא להעמיס לפני יום החלוקה).
function customerSummaryRowsHtml(c) {
  return c.bySlot.map((s) => {
    const parts = [];
    if (s.male > 0) parts.push(`${s.male} זכרים${s.maleRedeemed > 0 ? ` (${s.maleRedeemed} נמשכו)` : ''}`);
    if (s.female > 0) parts.push(`${s.female} נקבות${s.femaleRedeemed > 0 ? ` (${s.femaleRedeemed} נמשכו)` : ''}`);
    return `
      <div class="item-row" style="border-inline-start:4px solid ${esc(s.slotColor || 'var(--accent)')};padding-inline-start:10px">
        <span>${esc(s.slotName)}</span>
        <span class="meta">${parts.join(' · ')}</span>
      </div>
    `;
  }).join('');
}

// התראת "ייתכן שיש תשלום שלא אושר" — שורה אחת בלבד ללקוח (גם אם היו כמה
// ניסיונות תשלום כושלים), ומוצגת רק אם עדיין יש לו חוב פתוח (ראו
// pendingUnconfirmedPayment ב-listCustomersSummary).
function pendingPaymentNoticeHtml(c) {
  const p = c.pendingUnconfirmedPayment;
  if (!p) return '';

        <button type="button" class="ghost" data-dismiss-pending data-phone="${esc(c.phone)}">✕ בדקתי, הסתר</button>

}

// התכתבות SMS דו-כיוונית מול ימות המשיח (נכנס+יוצא, ממוין כרונולוגית) —
// ראו getSmsHistoryForPhone בשרת. תצוגת "בועות" בסגנון צ'אט: הודעות
// שיצאו מאיתנו בצד ימין (flex-start ב-RTL), שהתקבלו מהלקוח בצד שמאל.
function smsComposerHtml(prefix) {
  return `
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
      <textarea id="${prefix}-compose" rows="2" placeholder="כתיבת הודעה אישית ללקוח…" style="resize:vertical"></textarea>
      <div id="${prefix}-compose-msg"></div>
      <button type="button" class="secondary" data-sms-send="${prefix}" style="width:auto;align-self:flex-start">📤 שליחה</button>
    </div>
  `;
}

function wireSmsComposer(phone, containerId) {
  const btn = document.querySelector(`[data-sms-send="${containerId}"]`);
  if (!btn) return;
  btn.onclick = async () => {
    const textarea = document.getElementById(`${containerId}-compose`);
    const msgBox = document.getElementById(`${containerId}-compose-msg`);
    const message = textarea.value.trim();
    if (!message) return;
    btn.disabled = true;
    msgBox.innerHTML = '';
    try {
      await api(`/admin/customers/${encodeURIComponent(phone)}/sms`, { method: 'POST', body: { message } });
      textarea.value = '';
      loadCustomerSmsHistory(phone, containerId);
    } catch (err) {
      msgBox.innerHTML = `<div class="error">${err.message}</div>`;
      btn.disabled = false;
    }
  };
}

async function loadCustomerSmsHistory(phone, containerId) {
  const box = document.getElementById(containerId);
  if (!box) return;
  box.innerHTML = smsComposerHtml(containerId) + `<div class="loading">טוען…</div>`;
  wireSmsComposer(phone, containerId);
  let messages;
  try {
    messages = await api(`/admin/customers/${encodeURIComponent(phone)}/sms-history`);
  } catch (err) {
    box.innerHTML = smsComposerHtml(containerId) + `<div class="error">${err.message}</div>`;
    wireSmsComposer(phone, containerId);
    return;
  }
  const threadHtml = !messages.length
    ? `<p class="hint">אין היסטוריית SMS עם הלקוח הזה בשבועיים האחרונים.</p>`
    : messages.map((m) => `
        <div style="display:flex;flex-direction:column;align-items:${m.direction === 'outgoing' ? 'flex-start' : 'flex-end'};margin-bottom:10px">
          <div style="max-width:85%;padding:8px 12px;border-radius:10px;background:${m.direction === 'outgoing' ? 'var(--surface-2)' : 'var(--accent-soft)'};font-size:13.5px;white-space:pre-wrap;word-break:break-word">${esc(m.message || '')}</div>
          <span class="meta" style="font-size:11px;margin-top:3px">${m.time ? new Date(m.time).toLocaleString('he-IL') : ''}${m.deliveryStatus ? ' · ' + esc(m.deliveryStatus) : ''}</span>
        </div>
      `).join('');
  box.innerHTML = smsComposerHtml(containerId) + threadHtml;
  wireSmsComposer(phone, containerId);
}

// "איסוף מהיר" על כרטיס לקוח סגור — אותה לוגיקה בדיוק כמו מסך "מצב איסוף"
// המלא (status + attemptQuickRedeem), רק שמוצג בתוך הכרטיס עצמו, ומאפשר גם
// "איסוף הכל" בלחיצה אחת על כל הפריטים הזמינים של הלקוח.
async function loadCustomerQuickRedeem(phone, containerId, { showHistory = true } = {}) {
  const box = document.getElementById(containerId);
  if (!box) return;
  box.innerHTML = `<div class="loading">טוען…</div>`;
  let status, redemptionLog;
  try {
    [status, redemptionLog] = await Promise.all([
      api(`/admin/redeem/status?phone=${encodeURIComponent(phone)}`),
      showHistory ? api(`/admin/customers/${encodeURIComponent(phone)}/redemption-history`) : Promise.resolve([]),
    ]);
  } catch (err) {
    box.innerHTML = `<div class="error">${err.message}</div>`;
    return;
  }

  const groups = new Map();
  const addToGroup = (it, hasPaymentIssue) => {
    if (!groups.has(it.slotId)) {
      groups.set(it.slotId, { slotId: it.slotId, slotName: it.slotName, slotColor: it.slotColor, male: 0, female: 0, hasPaymentIssue: false });
    }
    const g = groups.get(it.slotId);
    g[it.gender] += it.remaining;
    if (hasPaymentIssue) g.hasPaymentIssue = true;
  };
  status.available.forEach((it) => addToGroup(it, false));
  status.blocked.filter((it) => it.reason === 'unpaid' || it.reason === 'partial').forEach((it) => addToGroup(it, true));

  const chosen = {};
  groups.forEach((g) => { chosen[g.slotId] = { male: 0, female: 0 }; });
  const prefix = containerId;

  function genderLineHtml(g, gender) {
    if (g[gender] <= 0) return '';
    const label = gender === 'male' ? 'זכרים' : 'נקבות';
    return `
      <div class="gender-line">
        <span>${label} · נותרו ${g[gender]}</span>
        <div class="stepper">
          <button type="button" data-cqstep="-1" data-slot="${g.slotId}" data-gender="${gender}">−</button>
          <span id="${prefix}-qty-${g.slotId}-${gender}">0</span>
          <button type="button" data-cqstep="1" data-slot="${g.slotId}" data-gender="${gender}">+</button>
        </div>
        <button type="button" class="quick-all" data-cqall data-slot="${g.slotId}" data-gender="${gender}">הכל</button>
      </div>
    `;
  }

  const c = allCustomersCache.find((x) => x.phone === phone);
  const historyItems = [];
  if (showHistory && c) {
    c.orders.forEach((o) => {
      o.items.forEach((it) => historyItems.push({ ...it, orderId: o.id }));
    });
  }

  box.innerHTML = `
    ${!groups.size ? `<p class="hint">אין פריטים זמינים לאיסוף כרגע עבור לקוח זה.</p>` : ''}
    ${groups.size > 1 ? `<button type="button" class="primary" style="margin-bottom:10px" id="${prefix}-redeemAll">איסוף הכל (כל הפריטים הזמינים)</button>` : ''}
    ${[...groups.values()].map((g) => `
      <div class="card redeem-group-card" style="border-inline-start-color:${esc(g.slotColor)}">
        <div class="order-row-header">
          <b>${esc(g.slotName)}</b>
          ${g.hasPaymentIssue ? '<span class="warn-pill">⚠️ יש חוב</span>' : ''}
        </div>
        ${genderLineHtml(g, 'male')}
        ${genderLineHtml(g, 'female')}
        <div class="spacer"></div>
        <div id="${prefix}-msg-${g.slotId}"></div>
        <button type="button" class="primary" data-cqconfirm="${g.slotId}">איסוף</button>
      </div>
    `).join('')}
    ${historyItems.length ? `
      <h3 style="margin:18px 0 8px;font-size:14px">היסטוריית איסופים ועריכה</h3>
      ${historyItems.map((it) => `
        <div class="item-row" style="flex-wrap:wrap;gap:8px">
          <span>${esc(it.slotName)} · ${GENDER_LABEL[it.gender]} · הוזמנו ${it.quantity}</span>
          <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="meta">נמשך בפועל:</span>
            <input type="number" min="0" max="${it.quantity}" value="${it.quantityRedeemed}" id="${prefix}-hist-${it.id}" style="width:70px">
            <button type="button" class="ghost" data-hist-save="${it.id}">שמירה</button>
            <button type="button" class="ghost" data-hist-cancel="${it.id}" style="color:var(--wine)" ${it.quantityRedeemed === 0 ? 'disabled' : ''}>ביטול איסוף</button>
          </span>
        </div>
      `).join('')}
    ` : ''}
    ${redemptionLog && redemptionLog.length ? `
      <h3 style="margin:18px 0 8px;font-size:14px">יומן איסופים מפורט (תאריך ושעה)</h3>
      ${redemptionLog.map((r) => `
        <div class="item-row" style="flex-wrap:wrap;gap:8px">
          <span>${esc(r.slotName)} · ${GENDER_LABEL[r.gender]} × ${r.quantity}</span>
          <span class="meta">${new Date(r.redeemedAt).toLocaleString('he-IL')} · ${r.isManual ? `ידני ע"י מנהל (${esc(r.redeemedBy)})` : `מערכת · קוד ${esc(r.confirmationCode)}`}</span>
        </div>
      `).join('')}
    ` : ''}
  `;

  box.querySelectorAll('[data-hist-save]').forEach((b) => {
    b.onclick = async () => {
      const itemId = b.dataset.histSave;
      const quantityRedeemed = Number(document.getElementById(`${prefix}-hist-${itemId}`).value);
      if (c && c.balanceDue > 0 && !confirm(`ללקוח הזה יש חוב פתוח של ${money(c.balanceDue)} — ההזמנה לא שולמה במלואה. האם אתה בטוח שברצונך לממש בכל זאת?`)) {
        return;
      }
      try {
        await api(`/admin/order-items/${itemId}/redeemed`, { method: 'PUT', body: { quantityRedeemed } });
        refreshCustomerCard(phone, { keepRedeemOpen: true });
      } catch (err) { alert(err.message); }
    };
  });
  box.querySelectorAll('[data-hist-cancel]').forEach((b) => {
    b.onclick = async () => {
      const itemId = b.dataset.histCancel;
      if (!confirm('לבטל את האיסוף של שורה זו? הכמות שנמשכה עבורה תאופס ל-0.')) return;
      try {
        await api(`/admin/order-items/${itemId}/redeemed`, { method: 'PUT', body: { quantityRedeemed: 0 } });
        refreshCustomerCard(phone, { keepRedeemOpen: true });
      } catch (err) { alert(err.message); }
    };
  });
  box.querySelectorAll('[data-cqstep]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      const delta = Number(b.dataset.cqstep);
      const cur = chosen[slotId][gender];
      chosen[slotId][gender] = Math.max(0, Math.min(g[gender], cur + delta));
      document.getElementById(`${prefix}-qty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  box.querySelectorAll('[data-cqall]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      chosen[slotId][gender] = g[gender];
      document.getElementById(`${prefix}-qty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  box.querySelectorAll('[data-cqconfirm]').forEach((b) => {
    b.onclick = () => {
      const slotId = Number(b.dataset.cqconfirm);
      const c = chosen[slotId];
      if (c.male <= 0 && c.female <= 0) return;
      attemptQuickRedeem(phone, slotId, c.male, c.female, false, `${prefix}-msg-${slotId}`, () => refreshCustomerCard(phone, { keepRedeemOpen: true }));
    };
  });
  const allBtn = document.getElementById(`${prefix}-redeemAll`);
  if (allBtn) {
    allBtn.onclick = async () => {
      if (!confirm('לממש בבת אחת את כל הפריטים הזמינים עבור לקוח זה?')) return;
      for (const g of groups.values()) {
        if (g.male <= 0 && g.female <= 0) continue;
        await attemptQuickRedeem(phone, g.slotId, g.male, g.female, false, `${prefix}-msg-${g.slotId}`, null);
      }
      refreshCustomerCard(phone, { keepRedeemOpen: true });
    };
  }
}

// שורות עריכת כמות מסוכמות — אחת לכל שילוב זמן-חלוקה+מגדר שיש בו כמות
// (מ-c.bySlot, כבר מסוכם מכל ההזמנות יחד). זו הרמה היחידה שבה משנים כמות.
function aggregatedEditRowsHtml(c) {
  const pid = panelSafeId(c.phone);

      const redeemed = s[`${gender}Redeemed`];
      rows.push(`
        <div class="agg-row">
          <div class="agg-label" style="border-inline-start:4px solid ${esc(s.slotColor || 'var(--accent)')};padding-inline-start:8px">
            ${esc(s.slotName)} · ${GENDER_LABEL[gender]}
            ${redeemed > 0 ? `<div class="meta">(${redeemed} כבר נמשכו — לא ניתן להקטין מתחת לכך)</div>` : ''}

          <div class="agg-controls">

async function wireCustomerPaymentsPanel(c) {
  const pid = panelSafeId(c.phone);
  const panel = document.getElementById(`${pid}-pay`);

  const pmethodSelect = document.getElementById(`${pid}-pmethod`);
  const pnoteInput = document.getElementById(`${pid}-pnote`);
  pmethodSelect.onchange = () => { pnoteInput.hidden = pmethodSelect.value !== 'manual_admin'; };

  panel.querySelector('[data-cpay-submit]').onclick = async () => {
    const rawAmount = Number(document.getElementById(`${pid}-pamt`).value);
    const isCredit = document.getElementById(`${pid}-pcredit`).checked;
    const amount = isCredit ? -Math.abs(rawAmount) : rawAmount;
    const method = pmethodSelect.value;
    const note = pnoteInput.hidden ? undefined : pnoteInput.value.trim() || undefined;
    try {

          <select id="${pid}-paymethod-${p.id}">

        <button class="primary" type="button" data-pay-save="${p.id}" style="margin-top:8px;width:100%">שמירה</button>
        <div id="${pid}-paymsg-${p.id}"></div>

      const editMethodSelect = document.getElementById(`${pid}-paymethod-${p.id}`);

      editMethodSelect.onchange = () => { editNoteInput.hidden = editMethodSelect.value !== 'manual_admin'; };

  });

// מקטין כמות מסוכמת (עריכת "עריכת כמויות"): מפרק את ההפחתה על פני שורות
// order_items אמיתיות (מהחדשה לישנה), בלי לרדת מתחת למה שכבר נמשך בפועל
// בכל שורה — כדי לשמר היסטוריה נכונה ולא "לשקר" retroactively על מה שנמשך.
async function shrinkAggregatedQuantity(c, slotId, gender, reduceBy) {
  const items = [];
  c.orders.forEach((o) => {
    o.items.forEach((it) => {
      if (it.slotId === slotId && it.gender === gender) items.push({ ...it, orderId: o.id });
    });
  });
  items.sort((a, b) => b.orderId - a.orderId);
  let remaining = reduceBy;
  for (const it of items) {
    if (remaining <= 0) break;
    const reducible = it.quantity - it.quantityRedeemed;
    if (reducible <= 0) continue;
    const take = Math.min(reducible, remaining);
    const newQty = it.quantity - take;
    if (newQty === 0) {
      await api(`/admin/orders/${it.orderId}/items/${it.id}`, { method: 'DELETE' });
    } else {
      await api(`/admin/orders/${it.orderId}/items/${it.id}`, { method: 'PUT', body: { quantity: newQty } });
    }
    remaining -= take;
  }
  if (remaining > 0) {
    throw new Error(`לא ניתן להקטין ב-${reduceBy} — חלק מהכמות כבר נמשך בפועל.`);
  }
}

async function wireCustomerPanel(c, refetch) {
  const pid = panelSafeId(c.phone);
  const panel = document.getElementById(pid);

  panel.querySelectorAll('[data-agg-save]').forEach((b) => {
    b.onclick = async () => {
      const [slotIdStr, gender] = b.dataset.aggSave.split(':');
      const slotId = Number(slotIdStr);
      const s = c.bySlot.find((x) => x.slotId === slotId);
      const currentQty = s ? s[gender] : 0;
      const redeemed = s ? s[`${gender}Redeemed`] : 0;
      const newQty = Number(document.getElementById(`${pid}-agg-${slotId}-${gender}`).value);
      if (!Number.isInteger(newQty) || newQty < 0) { alert('כמות לא תקינה.'); return; }
      if (newQty < redeemed) { alert(`לא ניתן להקטין מתחת ל-${redeemed} — כבר נמשך בפועל.`); return; }
      const delta = newQty - currentQty;
      if (delta === 0) return;
      try {
        if (delta > 0) {
          await api('/admin/orders', { method: 'POST', body: { phone: c.phone, items: [{ slotId, gender, quantity: delta }] } });
        } else {
          await shrinkAggregatedQuantity(c, slotId, gender, -delta);
        }
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) {
        document.getElementById(`${pid}-msg`).innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
  });
  const newlineToggleBtn = panel.querySelector('[data-newline-toggle]');
  if (newlineToggleBtn) {
    newlineToggleBtn.onclick = () => {
      const form = document.getElementById(`${pid}-newline-form`);
      form.hidden = !form.hidden;
    };
  }
  let newlineQty = 1;
  const newlineQtyEl = document.getElementById(`${pid}-newline-qty`);
  panel.querySelectorAll('[data-newline-step]').forEach((b) => {
    b.onclick = () => {
      newlineQty = Math.max(1, newlineQty + Number(b.dataset.newlineStep));
      newlineQtyEl.textContent = newlineQty;
    };
  });
  const addLineBtn = panel.querySelector('[data-newline-add]');
  if (addLineBtn) {
    addLineBtn.onclick = async () => {
      const slotId = Number(document.getElementById(`${pid}-newline-slot`).value);
      const gender = document.getElementById(`${pid}-newline-gender`).value;
      try {
        await api('/admin/orders', { method: 'POST', body: { phone: c.phone, items: [{ slotId, gender, quantity: newlineQty }] } });
        document.getElementById(`${pid}-newline-msg`).innerHTML = `<div class="success">✓ ההזמנה נרשמה בהצלחה</div>`;
        setTimeout(() => refreshCustomerCard(c.phone, { keepEditOpen: true }), 900);
      } catch (err) {
        document.getElementById(`${pid}-newline-msg`).innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
  }
  panel.querySelectorAll('[data-del-item]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('למחוק את שורת ההזמנה הזו?')) return;
      const [orderId, itemId] = b.dataset.delItem.split(':');
      try {
        await api(`/admin/orders/${orderId}/items/${itemId}`, { method: 'DELETE' });
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) { alert(err.message); }
    };
  });
  panel.querySelectorAll('[data-del-order]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('למחוק את כל ההזמנה? פעולה זו מוחקת לגמרי, כולל אם כבר שולם/נמשך משהו ממנה.')) return;
      try {
        await api(`/admin/orders/${b.dataset.delOrder}`, { method: 'DELETE' });
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) { alert(err.message); }
    };
  });
}

// מחברת את ארבעת הכפתורים ברמת הכרטיס (הצג פירוט / תשלומים / איסוף /
// עריכת הזמנה) + הסתרת התראת תשלום, בתוך root נתון — עובד גם על כל
// הרשימה (renderList) וגם על כרטיס בודד (refreshCustomerCard), כי כל
// כפתור נושא את data-phone של עצמו.
function wireCustomerCardButtons(root) {
  // ארבעת הפאנלים הם תצוגות חלופיות של אותו כרטיס — פתיחת אחד סוגרת
  // אוטומטית את שלושת האחרים, כדי שלא ייפתחו כולם אחד מתחת לשני.
  function closeOtherCustomerPanels(phone, exceptId) {
    const ids = [`${panelSafeId(phone)}-view`, `${panelSafeId(phone)}-pay`, `${panelSafeId(phone)}-redeem`, `${panelSafeId(phone)}-sms`, panelSafeId(phone)];
    for (const id of ids) {
      if (id === exceptId) continue;
      const p = document.getElementById(id);
      if (p) p.hidden = true;
    }
  }

  root.querySelectorAll('[data-cust-view]').forEach((b) => {
    b.onclick = async () => {
      const phone = b.dataset.phone;
      const panelId = `${panelSafeId(phone)}-view`;
      const panel = document.getElementById(panelId);
      if (!panel.hidden) { panel.hidden = true; return; }
      closeOtherCustomerPanels(phone, panelId);
      const c = allCustomersCache.find((x) => x.phone === phone);
      panel.innerHTML = customerViewPanelHtml(c);
      panel.hidden = false;
      wireCustomerViewPanel(panel);
      loadCustomerViewPayments(c);
    };
  });
  root.querySelectorAll('[data-cust-pay]').forEach((b) => {
    b.onclick = async () => {
      const phone = b.dataset.phone;
      const panelId = `${panelSafeId(phone)}-pay`;
      const panel = document.getElementById(panelId);
      if (!panel.hidden) { panel.hidden = true; return; }
      closeOtherCustomerPanels(phone, panelId);
      const c = allCustomersCache.find((x) => x.phone === phone);
      panel.innerHTML = customerPaymentsPanelHtml(c);
      panel.hidden = false;
      wireCustomerPaymentsPanel(c);
    };
  });
  root.querySelectorAll('[data-cust-redeem]').forEach((b) => {
    b.onclick = () => {
      const phone = b.dataset.phone;
      const containerId = `${panelSafeId(phone)}-redeem`;
      const panel = document.getElementById(containerId);
      if (!panel.hidden) { panel.hidden = true; return; }
      closeOtherCustomerPanels(phone, containerId);
      panel.hidden = false;
      loadCustomerQuickRedeem(phone, containerId);
    };
  });
  root.querySelectorAll('[data-cust-edit]').forEach((b) => {
    b.onclick = async () => {
      const phone = b.dataset.phone;
      const panelId = panelSafeId(phone);
      const panel = document.getElementById(panelId);
      if (!panel.hidden) { panel.hidden = true; return; }
      closeOtherCustomerPanels(phone, panelId);
      const c = allCustomersCache.find((x) => x.phone === phone);
      panel.innerHTML = customerPanelHtml(c);
      panel.hidden = false;
      wireCustomerPanel(c);
    };
  });
  root.querySelectorAll('[data-cust-sms]').forEach((b) => {
    b.onclick = () => {
      const phone = b.dataset.phone;
      const containerId = `${panelSafeId(phone)}-sms`;
      const panel = document.getElementById(containerId);
      if (!panel.hidden) { panel.hidden = true; return; }
      closeOtherCustomerPanels(phone, containerId);
      panel.hidden = false;
      loadCustomerSmsHistory(phone, containerId);
    };
  });
  root.querySelectorAll('[data-dismiss-pending]').forEach((b) => {
    b.onclick = async () => {
      try {
        await api(`/admin/customers/${encodeURIComponent(b.dataset.phone)}/payment-sessions/dismiss`, { method: 'POST' });
        refreshCustomerCard(b.dataset.phone);

  });
}

// מרעננת כרטיס לקוח בודד במקום (בלי לבנות מחדש את כל הרשימה ולקפוץ לראש
// הדף) — משמשת אחרי כל שמירה/מחיקה בכל אחד מארבעת הפאנלים.
async function refreshCustomerCard(phone, { keepViewOpen = false, keepPayOpen = false, keepEditOpen = false, keepRedeemOpen = false } = {}) {
  const customers = await api('/admin/customers');
  allCustomersCache = customers;
  const c = customers.find((x) => x.phone === phone);
  const container = document.getElementById(`custcard-${panelSafeId(phone)}`);

  if (quickEventModeOn) {
    if (!container) return;
    if (!c || !customerHasRedeemableInSlots(c, quickEventOpenSlotIds)) { container.remove(); return; }
    container.innerHTML = quickEventCardHtml(c);
    wireQuickEventCard(container, c);
    return;
  }

  const headerH2 = document.querySelector('.tab-header-row h2');
  const headerHint = document.querySelector('.tab-header-row .hint');
  if (headerHint) headerHint.textContent = `${customers.length} לקוחות · ${customers.filter((x) => x.paymentStatus === 'paid').length} שולמו במלואם`;
  // אם מסנן פעיל כרגע לא נוגעים בכותרת (שמציגה "X מתוך Y") כדי לא להציג
  // מספר שגוי — היא תתעדכן בפעם הבאה שהמסננים יופעלו מחדש.
  if (headerH2 && (!lastOrdersHeaderState || !lastOrdersHeaderState.isFiltered)) {
    headerH2.textContent = `לקוחות (${customers.length})`;
  }

  if (!container) { return renderOrdersTab(); }
  if (!c) { container.remove(); return; }

  container.innerHTML = customerCardHtml(c);
  wireCustomerCardButtons(container);
  if (keepViewOpen) {
    const panel = document.getElementById(`${panelSafeId(phone)}-view`);
    panel.innerHTML = customerViewPanelHtml(c);
    panel.hidden = false;
    wireCustomerViewPanel(panel);
    loadCustomerViewPayments(c);
  }
  if (keepPayOpen) {
    const panel = document.getElementById(`${panelSafeId(phone)}-pay`);
    panel.innerHTML = customerPaymentsPanelHtml(c);
    panel.hidden = false;
    wireCustomerPaymentsPanel(c);
  }
  if (keepEditOpen) {
    const panel = document.getElementById(panelSafeId(phone));
    panel.innerHTML = customerPanelHtml(c);
    panel.hidden = false;
    wireCustomerPanel(c);
  }
  if (keepRedeemOpen) {
    const redeemPanel = document.getElementById(`${panelSafeId(phone)}-redeem`);
    redeemPanel.hidden = false;
    loadCustomerQuickRedeem(phone, `${panelSafeId(phone)}-redeem`);
  }
}

// מעדכן את "לקוחות (X)" שבראש טאב ההזמנות — כשמסנן פעיל, מציג "X מתוך Y"
// (X מסוננים מתוך Y סה"כ) במקום רק את המספר הכולל.
function updateOrdersHeader(filteredCount, totalCount, isFiltered) {
  const headerH2 = document.querySelector('.tab-header-row h2');

// הופך <div class="multiselect" id="..."> עם כפתור + פאנל checkboxes לתפריט
// נפתח: לחיצה על הכפתור פותחת/סוגרת, לחיצה מחוץ לפאנל סוגרת, ותקציר
// "(2/3)" מתעדכן על הכפתור בכל שינוי. משמש גם בטאב ההזמנות וגם ביומן הפעולות.
function wireMultiSelectDropdown(containerId, checkboxSelector, onChange) {
  const container = document.getElementById(containerId);
  const btn = container.querySelector('[data-ms-toggle]');
  const panel = container.querySelector('.multiselect-panel');
  const countEl = container.querySelector('[data-ms-count]');
  function updateCount() {
    const all = container.querySelectorAll(checkboxSelector);
    const checked = [...all].filter((cb) => cb.checked).length;
    countEl.textContent = `(${checked}/${all.length})`;
  }
  btn.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.multiselect-panel').forEach((p) => { if (p !== panel) p.hidden = true; });
    panel.hidden = !panel.hidden;
  };
  container.querySelectorAll(checkboxSelector).forEach((cb) => {
    cb.onchange = () => { updateCount(); onChange(); };
  });
  updateCount();

  // נרשם פעם אחת גלובלית (לא בכל קריאה ל-wireMultiSelectDropdown/רינדור
  // מחדש של הטאב) כדי לא לצבור מאזינים כפולים על document.
  if (!multiSelectOutsideClickWired) {
    multiSelectOutsideClickWired = true;
    document.addEventListener('click', (e) => {
      document.querySelectorAll('.multiselect-panel').forEach((p) => {
        if (!p.hidden && !p.closest('.multiselect').contains(e.target)) p.hidden = true;
      });
    });
  }
}

// ============== איסוף מהיר ליום החלוקה — בתוך טאב ההזמנות בלבד ==============
// מסך מצומצם: בלי כפתורי סינון/הזמנה חדשה, רק חיפוש חופשי, ורשימת לקוחות
// שיש להם עוד כמות לאיסוף בזמן החלוקה הפתוח כרגע. שולם → פאנל האיסוף המהיר
// פתוח אוטומטית; לא שולם → כפתור "תשלום" בלבד.

let quickEventModeOn = false;
let quickEventOpenSlotIds = new Set();

function customerHasRedeemableInSlots(c, openSlotIds) {
  return c.bySlot.some((s) => openSlotIds.has(s.slotId) && ((s.male - s.maleRedeemed) > 0 || (s.female - s.femaleRedeemed) > 0));
}

function quickEventCardHtml(c) {
  const pid = panelSafeId(c.phone);
  return `
    <div class="card">
      <div class="order-row-header">
        <b>${esc(c.customerName)} · ${esc(c.phone)}</b>
        ${customerPaymentPillHtml(c)}
      </div>
      ${customerSummaryRowsHtml(c)}
      ${c.paymentStatus === 'paid'
        ? `<div id="qeredeem-${pid}" style="margin-top:10px"></div>`
        : `
          <div style="margin-top:10px">
            <button class="secondary" type="button" data-qe-pay data-phone="${esc(c.phone)}">💳 תשלום</button>
          </div>
          <div class="edit-panel" id="qepay-${pid}" hidden></div>
        `}
    </div>
  `;
}

function quickEventPayFormHtml(phone) {
  const pid = panelSafeId(phone);
  return `
    <div class="row" style="margin-top:8px">
      <input type="number" min="0" placeholder="סכום" id="qe-amt-${pid}">
      <select id="qe-method-${pid}">
        <option value="manual_cash">מזומן</option>
        <option value="manual_card">אשראי ידני</option>
        <option value="manual_admin">אחר</option>
      </select>
    </div>
    <input type="text" id="qe-note-${pid}" placeholder="פרטו מהו אופן התשלום..." hidden style="margin-top:8px">
    <button class="primary" type="button" data-qe-pay-submit style="margin-top:8px;width:100%">רישום תשלום</button>
    <div id="qe-msg-${pid}"></div>
  `;
}

function wireQuickEventPayForm(phone) {
  const pid = panelSafeId(phone);
  const panel = document.getElementById(`qepay-${pid}`);
  const methodSelect = document.getElementById(`qe-method-${pid}`);
  const noteInput = document.getElementById(`qe-note-${pid}`);
  methodSelect.onchange = () => { noteInput.hidden = methodSelect.value !== 'manual_admin'; };
  panel.querySelector('[data-qe-pay-submit]').onclick = async () => {
    const amount = Number(document.getElementById(`qe-amt-${pid}`).value);
    const method = methodSelect.value;
    const note = noteInput.hidden ? undefined : noteInput.value.trim() || undefined;
    try {
      await api(`/admin/customers/${encodeURIComponent(phone)}/payments`, { method: 'POST', body: { amount, method, note } });
      refreshCustomerCard(phone);
    } catch (err) {
      document.getElementById(`qe-msg-${pid}`).innerHTML = `<div class="error">${err.message}</div>`;
    }
  };
}

function wireQuickEventCard(container, c) {
  if (!container) return;
  if (c.paymentStatus === 'paid') {
    loadCustomerQuickRedeem(c.phone, `qeredeem-${panelSafeId(c.phone)}`, { showHistory: false });
    return;
  }
  const btn = container.querySelector('[data-qe-pay]');
  if (btn) {
    btn.onclick = () => {
      const panel = document.getElementById(`qepay-${panelSafeId(c.phone)}`);
      if (!panel.hidden) { panel.hidden = true; return; }
      panel.hidden = false;
      panel.innerHTML = quickEventPayFormHtml(c.phone);
      wireQuickEventPayForm(c.phone);
    };
  }
}

// טוענים את פאנלי האיסוף המהיר (בקשת רשת לכל לקוח ששילם) בקבוצות קטנות,
// לא את כולם בבת אחת — ביום החלוקה זה בדיוק הרגע שגם לקוחות מממשים בעצמם
// דרך הקיוסק/האזור האישי, ופרץ של עשרות בקשות מקבילות מהמנהל בפתיחת המסך
// רק מתחרה על אותו דאטהבייס בזמן הכי עמוס.
async function renderQuickEventList(list) {
  const wrap = document.getElementById('quickEventListWrap');
  wrap.innerHTML = list.length
    ? list.map((c) => `<div id="custcard-${panelSafeId(c.phone)}">${quickEventCardHtml(c)}</div>`).join('')
    : `<div class="card"><p class="hint">אין כרגע לקוחות עם כמות זמינה לאיסוף בזמן החלוקה הפתוח.</p></div>`;

  const paid = [];
  for (const c of list) {
    const container = document.getElementById(`custcard-${panelSafeId(c.phone)}`);
    if (!container) continue;
    if (c.paymentStatus === 'paid') { paid.push(c); continue; }
    wireQuickEventCard(container, c); // מיידי — חיבור כפתור תשלום בלבד, בלי בקשת רשת
  }
  const BATCH_SIZE = 4;
  for (let i = 0; i < paid.length; i += BATCH_SIZE) {
    const batch = paid.slice(i, i + BATCH_SIZE);
    await Promise.all(batch.map((c) => loadCustomerQuickRedeem(c.phone, `qeredeem-${panelSafeId(c.phone)}`, { showHistory: false })));
  }
}

// חיפוש חי בדיוק כמו בתצוגה הרגילה: כל הכרטיסים כבר מרונדרים (עם פאנל
// האיסוף המהיר טעון פעם אחת לכל לקוח ששילם) — הקלדה רק מציגה/מסתירה
// כרטיסים קיימים לפי טקסט, בלי לבנות מחדש את הרשימה ובלי לטעון מחדש את
// האיסוף המהיר על כל הקשת מקש (מה שהיה מהביל ואיטי).
function filterQuickEventList(list, query) {
  const q = query.trim().toLowerCase();
  let visibleCount = 0;
  list.forEach((c) => {
    const el = document.getElementById(`custcard-${panelSafeId(c.phone)}`);
    if (!el) return;
    const matches = !q || c.customerName.toLowerCase().includes(q) || c.phone.includes(q);
    el.hidden = !matches;
    if (matches) visibleCount++;
  });
  const noResults = document.getElementById('quickEventNoResults');
  if (noResults) noResults.hidden = list.length === 0 || visibleCount > 0;
}

  quickEventOpenSlotIds = new Set(slots.filter((s) => s.isOpenForPickup).map((s) => s.id));
  const redeemable = customers.filter((c) => customerHasRedeemableInSlots(c, quickEventOpenSlotIds));

  document.getElementById('tabContent').innerHTML = `

          <p class="hint" style="margin:4px 0 0">${redeemable.length} לקוחות עם כמות זמינה לאיסוף בזמן החלוקה הפתוח כרגע.</p>
        </div>
        <button class="mini-btn" id="quickEventBack">🔙 חזרה לתצוגה הרגילה</button>
      </div>
      <label for="quickEventSearch">חיפוש לפי שם או טלפון</label>
      <input type="text" id="quickEventSearch" placeholder="הקלידו שם או מספר טלפון...">
    </div>
    <div id="quickEventListWrap"></div>
    <div class="card" id="quickEventNoResults" hidden><p class="hint">לא נמצאו לקוחות תואמים.</p></div>

async function renderOrdersTab() {

  allSlotsForFilter = slots;

  if (quickEventModeOn) {
    return renderQuickEventModeScreen(customers, slots);
  }

  // אילו אמצעי תשלום שימשו את הלקוח בפועל (לפחות תשלום אחד) — לסינון "אופן
  // תשלום". לקוח יכול להופיע במספר אמצעים (למשל שילם חלק במזומן וחלק באשראי).
  // נטען רק כאן (לא במסך איסוף יום החלוקה) כדי לא להעמיס בקשת רשת נוספת

  const paymentMethodsByPhone = new Map();
