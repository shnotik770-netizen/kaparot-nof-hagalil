<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול — כפרות נוף הגליל</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .wrap{max-width:760px}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
  .tabs button{white-space:nowrap;background:var(--surface);border:1.5px solid var(--line);color:var(--ink-dim)}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--ink-dim);font-size:12px}
  .row{display:flex;gap:10px;align-items:center}
  .row > *{flex:1}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .toggle-row:first-child{border-top:none}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px}
  legend{font-size:12.5px;font-weight:700;color:var(--ink-dim);padding:0 6px}
  .perm-checks{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}
  .perm-checks label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink);margin:0}
  .perm-checks input{width:auto}
  .slot-card{border-inline-start:5px solid var(--accent);position:relative}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .colorpick{display:flex;align-items:center;gap:8px}
  .colorpick input[type=color]{width:44px;height:38px;padding:2px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
  .inline-hint{font-size:12px;color:var(--ink-dim);margin:2px 0 0}
  .admin-card .row{margin-bottom:8px}
  .big-action{font-size:16.5px;padding:15px 18px}
  .compact-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .compact-row .swatch{width:16px;height:16px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .compact-row .compact-main{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:2px}
  .compact-row .compact-main b{font-size:14.5px}
  .compact-row .pill{white-space:nowrap}
  .edit-panel{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .compact-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .compact-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .compact-table tr:last-child td{border-bottom:none}
</style>
</head>
<body>
<div class="topbar"><h1>🐔 ניהול כפרות</h1><span class="badge" id="whoBadge"></span></div>
<div class="wrap" id="app"><div class="loading">טוען…</div></div>

<script>
const GENDER_LABEL = { male: 'זכרים', female: 'נקבות' };
const STATUS_LABEL = { paid: 'שולם', partial: 'חלקי', unpaid: 'לא שולם' };
const TAB_TITLES = { settings: 'הגדרות', slots: 'זמני חלוקה', orders: 'הזמנות ותשלומים', dashboard: 'דשבורד', actionLog: 'יומן פעולות' };
// 'יומן פעולות' משתמש בהרשאת 'הגדרות' (אין לו הרשאה נפרדת משלו — כל מי שרואה הגדרות רואה גם את היומן)
const TAB_PERMISSION = { actionLog: 'settings' };

let currentTab = null;
let myPermissions = {};

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'שגיאה לא צפויה.'); err.data = data; throw err; }
  return data;
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function render(html) { document.getElementById('app').innerHTML = html; }
function money(n) { return `₪${Number(n).toLocaleString('he-IL', { maximumFractionDigits: 0 })}`; }
function esc(s) { return String(s ?? '').replace(/"/g, '&quot;'); }

function toDateInputValue(dateStr) {
  if (!dateStr) return '';
  return String(dateStr).slice(0, 10);
}
function toLocalDatetimeInputValue(isoString) {
  if (!isoString) return '';
  const d = new Date(isoString);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalDatetimeInputValue(value) {
  if (!value) return null;
  return new Date(value).toISOString();
}

// ============== כניסה ==============

function screenLogin(errorMsg, mode = 'password') {
  render(`
    <div class="card">
      <h2>כניסת מנהל</h2>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      <div class="tabs">
        <button class="${mode === 'password' ? 'active' : ''}" id="tabPassword">סיסמה קבועה</button>
        <button class="${mode === 'otp' ? 'active' : ''}" id="tabOtp">קוד חד-פעמי בסמס</button>
      </div>
      <label for="phoneInput">מספר טלפון מנהל</label>
      <input type="tel" id="phoneInput" inputmode="numeric" placeholder="05XXXXXXXX">
      ${mode === 'password' ? `
        <label for="pwInput">סיסמה</label>
        <input type="password" id="pwInput">
        <div class="spacer"></div>
        <button class="primary" id="pwSubmit">כניסה</button>
      ` : `
        <div class="spacer"></div>
        <button class="primary" id="otpRequest">שליחת קוד</button>
        <div id="otpVerifyBlock" style="display:none">
          <label for="codeInput">קוד</label>
          <input type="text" id="codeInput" inputmode="numeric" maxlength="6">
          <div class="spacer"></div>
          <button class="primary" id="otpVerify">כניסה</button>
        </div>
      `}
    </div>
  `);
  document.getElementById('tabPassword').onclick = () => screenLogin(null, 'password');
  document.getElementById('tabOtp').onclick = () => screenLogin(null, 'otp');
  if (mode === 'password') {
    document.getElementById('pwSubmit').onclick = async () => {
      try {
        const phone = document.getElementById('phoneInput').value.trim();
        const res = await api('/admin/login-password', { method: 'POST', body: { phone, password: document.getElementById('pwInput').value } });
        loadShell(res);
      } catch (err) { screenLogin(err.message, 'password'); }
    };
  } else {
    document.getElementById('otpRequest').onclick = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      try {
        await api('/admin/otp/request', { method: 'POST', body: { phone } });
        document.getElementById('otpVerifyBlock').style.display = 'block';
      } catch (err) { screenLogin(err.message, 'otp'); }
    };
    document.getElementById('otpVerify').onclick = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      try {
        const res = await api('/admin/otp/verify', { method: 'POST', body: { phone, code } });
        loadShell(res);
      } catch (err) { screenLogin(err.message, 'otp'); }
    };
  }
}

// ============== מעטפת + טאבים ==============

function loadShell(session) {
  myPermissions = session.permissions || {};
  document.getElementById('whoBadge').innerHTML = `${esc(session.name || '')} · <button class="ghost" id="logoutBtn" style="color:#fff">יציאה</button>`;
  const availableTabs = Object.keys(TAB_TITLES).filter((t) => myPermissions[TAB_PERMISSION[t] || t]);
  if (!availableTabs.length) {
    render(`<div class="card"><div class="error">לחשבון זה אין הרשאה לאף מסך ניהול. פנה למנהל אחר להוספת הרשאות.</div></div>`);
    return;
  }
  render(`
    <div class="tabs">
      ${availableTabs.map((t) => `<button data-tab="${t}">${TAB_TITLES[t]}</button>`).join('')}
    </div>
    <div id="tabContent"><div class="loading">טוען…</div></div>
  `);
  document.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
  document.getElementById('logoutBtn').onclick = async () => { await api('/admin/logout', { method: 'POST' }); screenLogin(); };
  showTab(currentTab && availableTabs.includes(currentTab) ? currentTab : availableTabs[0]);
}

function markActiveTab(tab) {
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
}

async function showTab(tab) {
  currentTab = tab;
  markActiveTab(tab);
  const content = document.getElementById('tabContent');
  content.innerHTML = '<div class="loading">טוען…</div>';
  if (tab === 'settings') return renderSettingsTab();
  if (tab === 'slots') return renderSlotsTab();
  if (tab === 'orders') return renderOrdersTab();
  if (tab === 'dashboard') return renderDashboardTab();
  if (tab === 'actionLog') return renderActionLogTab();
}

// ============== הגדרות ==============

async function renderSettingsTab() {
  const s = await api('/admin/settings');
  const content = document.getElementById('tabContent');
  content.innerHTML = `
    <div class="card">
      <h2>טקסטים ניתנים לעריכה</h2>
      <label>כותרת הטופס</label>
      <input type="text" id="orderTitle" value="${esc(s.orderTitle)}">
      <label>כותרת משנה (מוצגת מתחת לכותרת הראשית)</label>
      <input type="text" id="orderSubtitle" value="${esc(s.orderSubtitle)}">
      <label>הודעת "רישום סגור" (מוצגת גם כשאין זמן חלוקה פתוח, לא רק כשהרישום סגור ידנית)</label>
      <input type="text" id="closedRegMsg" value="${esc(s.closedRegistrationMessage)}">
      <label>הודעת "תשלום דחוי" (בסיום הרשמה)</label>
      <input type="text" id="deferredNotice" value="${esc(s.deferredPaymentNotice)}">
      <label>הודעת חסימה — לא שולם כלל</label>
      <input type="text" id="unpaidMsg" value="${esc(s.unpaidBlockMessage)}">
      <label>הודעת תשלום חלקי</label>
      <input type="text" id="partialMsg" value="${esc(s.partialPaymentNotice)}">
      <label>תבנית הודעת SMS לקוד אימות (חייבת להכיל {code})</label>
      <input type="text" id="otpTemplate" value="${esc(s.smsOtpTemplate)}">
      <div class="spacer"></div>
      <button class="primary" id="saveTexts">שמירת טקסטים</button>
    </div>

    <div class="card">
      <h2>חלונית הסבר במסך הראשי</h2>
      <p class="hint">מוצגת ללקוח בכניסה למערכת. השאירו כותרת ריקה כדי לבטל את הצגתה.</p>
      <label>כותרת</label>
      <input type="text" id="welcomeTitle" value="${esc(s.welcomeNoticeTitle)}">
      <label>תוכן</label>
      <textarea id="welcomeBody">${esc(s.welcomeNoticeBody)}</textarea>
      <div class="spacer"></div>
      <button class="primary" id="saveWelcome">שמירת חלונית ההסבר</button>
    </div>

    <div class="card admin-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h2 style="margin:0">ניהול מנהלים</h2>
        <button class="primary" id="toggleAddAdmin" style="width:auto">+ הוספת מנהל</button>
      </div>
      <p class="hint">כל מנהל נכנס עם הטלפון והסיסמה שלו, ורואה רק את הטאבים שסומנו לו כאן.</p>
      <div id="addAdminCard" hidden>
        <fieldset>
          <legend>הוספת מנהל חדש</legend>
          <label>שם</label>
          <input type="text" id="newAdminName">
          <label>טלפון</label>
          <input type="tel" id="newAdminPhone" inputmode="numeric" placeholder="05XXXXXXXX">
          <label>סיסמה (לפחות 6 תווים)</label>
          <input type="password" id="newAdminPassword">
          <div class="perm-checks">
            <label><input type="checkbox" id="newPermSettings" checked> הגדרות</label>
            <label><input type="checkbox" id="newPermOrders" checked> הזמנות ותשלומים</label>
            <label><input type="checkbox" id="newPermDashboard" checked> דשבורד</label>
            <label><input type="checkbox" id="newPermSlots" checked> זמני חלוקה</label>
          </div>
          <button class="primary big-action" id="addAdmin" style="width:100%">הוספת מנהל</button>
        </fieldset>
      </div>
      <div id="adminsList"><div class="loading">טוען…</div></div>
    </div>

    <div class="card">
      <h2>איפוס קשיח</h2>
      <p class="hint">מוחק את כל ההזמנות, התשלומים והמשיכות. לא ניתן לשחזר. משתמשים בזה בסוף העונה או לניקוי בדיקות.</p>
      <label>הקלידו "איפוס" לאישור</label>
      <input type="text" id="resetConfirm">
      <div class="spacer"></div>
      <button class="danger" id="hardReset" style="width:100%">איפוס קשיח של כל הנתונים</button>
    </div>
    <div id="settingsMsg"></div>
  `;

  document.getElementById('saveTexts').onclick = async () => {
    await api('/admin/settings', { method: 'PUT', body: {
      order_title: document.getElementById('orderTitle').value,
      order_subtitle: document.getElementById('orderSubtitle').value,
      closed_registration_message: document.getElementById('closedRegMsg').value,
      deferred_payment_notice: document.getElementById('deferredNotice').value,
      unpaid_block_message: document.getElementById('unpaidMsg').value,
      partial_payment_notice: document.getElementById('partialMsg').value,
      sms_otp_template: document.getElementById('otpTemplate').value,
    }});
    flash('נשמר.');
  };
  document.getElementById('saveWelcome').onclick = async () => {
    await api('/admin/settings', { method: 'PUT', body: {
      welcome_notice_title: document.getElementById('welcomeTitle').value,
      welcome_notice_body: document.getElementById('welcomeBody').value,
    }});
    flash('נשמר.');
  };
  document.getElementById('hardReset').onclick = async () => {
    const confirmText = document.getElementById('resetConfirm').value;
    try {
      await api('/admin/hard-reset', { method: 'POST', body: { confirmText } });
      flash('המערכת אופסה.');
    } catch (err) { flash(err.message, true); }
  };
  document.getElementById('toggleAddAdmin').onclick = () => {
    const card = document.getElementById('addAdminCard');
    card.hidden = !card.hidden;
  };
  document.getElementById('addAdmin').onclick = async () => {
    try {
      await api('/admin/admins', { method: 'POST', body: {
        name: document.getElementById('newAdminName').value,
        phone: document.getElementById('newAdminPhone').value,
        password: document.getElementById('newAdminPassword').value,
        permissions: {
          settings: document.getElementById('newPermSettings').checked,
          orders: document.getElementById('newPermOrders').checked,
          dashboard: document.getElementById('newPermDashboard').checked,
          slots: document.getElementById('newPermSlots').checked,
        },
      }});
      document.getElementById('newAdminName').value = '';
      document.getElementById('newAdminPhone').value = '';
      document.getElementById('newAdminPassword').value = '';
      document.getElementById('addAdminCard').hidden = true;
      flash('המנהל נוסף.');
      renderAdminsList();
    } catch (err) { flash(err.message, true); }
  };

  renderAdminsList();
}

const PERM_LABELS = { settings: 'הגדרות', orders: 'הזמנות', dashboard: 'דשבורד', slots: 'זמני חלוקה' };

async function renderAdminsList() {
  const box = document.getElementById('adminsList');
  const admins = await api('/admin/admins');
  if (!admins.length) {
    box.innerHTML = `<p class="hint">אין עדיין מנהלים רשומים.</p>`;
    return;
  }
  box.innerHTML = `
    <table class="compact-table">
      ${admins.map((a) => `
        <tr>
          <td><b>${esc(a.name)}</b><br><span class="meta">${esc(a.phone)}</span></td>
          <td class="meta">${Object.keys(PERM_LABELS).filter((k) => a.permissions[k]).map((k) => PERM_LABELS[k]).join(', ') || 'ללא הרשאות'}</td>
          <td style="text-align:left"><button class="ghost" data-toggle-admin="${a.id}">עריכה</button></td>
        </tr>
      `).join('')}
    </table>
    ${admins.map((a) => `
      <div class="edit-panel" id="adminEdit${a.id}" hidden>
        <div class="row">
          <div>
            <label>שם</label>
            <input type="text" data-field="name" data-id="${a.id}" value="${esc(a.name)}">
          </div>
          <div>
            <label>טלפון</label>
            <input type="tel" data-field="phone" data-id="${a.id}" value="${esc(a.phone)}">
          </div>
        </div>
        <label>סיסמה חדשה (השאירו ריק כדי לא לשנות)</label>
        <input type="password" data-field="password" data-id="${a.id}" placeholder="••••••">
        <div class="perm-checks">
          <label><input type="checkbox" data-perm="settings" data-id="${a.id}" ${a.permissions.settings ? 'checked' : ''}> הגדרות</label>
          <label><input type="checkbox" data-perm="orders" data-id="${a.id}" ${a.permissions.orders ? 'checked' : ''}> הזמנות ותשלומים</label>
          <label><input type="checkbox" data-perm="dashboard" data-id="${a.id}" ${a.permissions.dashboard ? 'checked' : ''}> דשבורד</label>
          <label><input type="checkbox" data-perm="slots" data-id="${a.id}" ${a.permissions.slots ? 'checked' : ''}> זמני חלוקה</label>
        </div>
        <div class="row">
          <button class="primary big-action" data-save-admin="${a.id}">שמירה</button>
          <button class="danger big-action" data-delete-admin="${a.id}">מחיקה</button>
        </div>
      </div>
    `).join('')}
  `;

  box.querySelectorAll('[data-toggle-admin]').forEach((b) => {
    b.onclick = () => {
      const panel = document.getElementById(`adminEdit${b.dataset.toggleAdmin}`);
      panel.hidden = !panel.hidden;
    };
  });
  box.querySelectorAll('[data-save-admin]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.saveAdmin;
      const name = box.querySelector(`[data-field="name"][data-id="${id}"]`).value;
      const phone = box.querySelector(`[data-field="phone"][data-id="${id}"]`).value;
      const password = box.querySelector(`[data-field="password"][data-id="${id}"]`).value;
      const permissions = {
        settings: box.querySelector(`[data-perm="settings"][data-id="${id}"]`).checked,
        orders: box.querySelector(`[data-perm="orders"][data-id="${id}"]`).checked,
        dashboard: box.querySelector(`[data-perm="dashboard"][data-id="${id}"]`).checked,
        slots: box.querySelector(`[data-perm="slots"][data-id="${id}"]`).checked,
      };
      try {
        await api(`/admin/admins/${id}`, { method: 'PUT', body: { name, phone, password, permissions } });
        flash('המנהל עודכן.');
        renderAdminsList();
      } catch (err) { flash(err.message, true); }
    };
  });
  box.querySelectorAll('[data-delete-admin]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('למחוק את המנהל הזה?')) return;
      await api(`/admin/admins/${b.dataset.deleteAdmin}`, { method: 'DELETE' });
      renderAdminsList();
    };
  });
}

function flash(msg, isError) {
  document.getElementById('settingsMsg').innerHTML = `<div class="${isError ? 'error' : 'success'}">${msg}</div>`;
}

// ============== זמני חלוקה ==============

function slotFormHtml(prefix, s) {
  s = s || {};
  return `
    <label>שם הזמן</label>
    <input type="text" id="${prefix}Name" placeholder="לדוגמה: חמישי בוקר" value="${esc(s.name)}">
    <div class="cols2">
      <div>
        <label>תאריך אספקה</label>
        <input type="date" id="${prefix}Date" value="${toDateInputValue(s.supplyDate)}">
      </div>
      <div>
        <label>יום (בעברית)</label>
        <div class="row">
          <input type="text" id="${prefix}DayLabel" value="${esc(s.dayLabel)}">
          <button type="button" class="ghost" id="${prefix}Suggest">הצעה אוטומטית</button>
        </div>
      </div>
    </div>
    <label>שעות</label>
    <input type="text" id="${prefix}Hours" placeholder="לדוגמה: 08:00–12:00" value="${esc(s.hoursLabel)}">
    <div class="cols2">
      <div>
        <label>מחיר זכר (₪)</label>
        <input type="number" min="0" step="1" id="${prefix}PriceMale" value="${s.priceMale ?? ''}">
      </div>
      <div>
        <label>מחיר נקבה (₪)</label>
        <input type="number" min="0" step="1" id="${prefix}PriceFemale" value="${s.priceFemale ?? ''}">
      </div>
    </div>
    <label>צבע לזיהוי (כרטיס המימוש)</label>
    <div class="colorpick">
      <input type="color" id="${prefix}Color" value="${esc(s.color || '#a5741f')}">
      <span class="inline-hint">מוצג במסך "מימוש והצגה למחלק העופות"</span>
    </div>
    <label>זמן סגירת הרשמה</label>
    <input type="datetime-local" id="${prefix}CloseAt" value="${toLocalDatetimeInputValue(s.registrationCloseAt)}">
    <div class="toggle-row"><span>פתוח ידנית להרשמה גם אחרי זמן הסגירה</span><input type="checkbox" id="${prefix}Override" ${s.manualOpenOverride ? 'checked' : ''}></div>
    <div class="toggle-row"><span>פתוח כעת לאספקה (משיכת עופות)</span><input type="checkbox" id="${prefix}Pickup" ${s.openForPickup ? 'checked' : ''}></div>
    <div class="toggle-row"><span>זמן פעיל (מוצג בכלל במערכת)</span><input type="checkbox" id="${prefix}Active" ${s.active !== false ? 'checked' : ''}></div>
  `;
}

function readSlotForm(prefix) {
  return {
    name: document.getElementById(`${prefix}Name`).value.trim(),
    supplyDate: document.getElementById(`${prefix}Date`).value,
    dayLabel: document.getElementById(`${prefix}DayLabel`).value.trim(),
    hoursLabel: document.getElementById(`${prefix}Hours`).value.trim(),
    priceMale: Number(document.getElementById(`${prefix}PriceMale`).value),
    priceFemale: Number(document.getElementById(`${prefix}PriceFemale`).value),
    color: document.getElementById(`${prefix}Color`).value,
    registrationCloseAt: fromLocalDatetimeInputValue(document.getElementById(`${prefix}CloseAt`).value),
    manualOpenOverride: document.getElementById(`${prefix}Override`).checked,
    openForPickup: document.getElementById(`${prefix}Pickup`).checked,
    active: document.getElementById(`${prefix}Active`).checked,
  };
}

function slotCompactRowHtml(s) {
  return `
    <div class="compact-row">
      <span class="swatch" style="background:${esc(s.color)}"></span>
      <div class="compact-main">
        <b>${esc(s.name)}</b>
        <span class="meta">${esc(s.hebrewDate)}${s.hoursLabel ? ' · ' + esc(s.hoursLabel) : ''} · ${money(s.priceMale)}/${money(s.priceFemale)}</span>
      </div>
      <span class="pill ${s.isOpenForRegistration ? 'paid' : 'unpaid'}">${s.isOpenForRegistration ? 'פתוח להרשמה' : 'סגור להרשמה'}</span>
      <span class="pill ${s.isOpenForPickup ? 'paid' : 'unpaid'}">${s.isOpenForPickup ? 'פתוח לאספקה' : 'סגור לאספקה'}</span>
      <button class="ghost" data-toggle-slot="${s.id}">עריכה</button>
    </div>
  `;
}

async function renderSlotsTab() {
  const slots = await api('/admin/slots');
  const content = document.getElementById('tabContent');
  content.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="margin:0">זמני חלוקה קיימים</h2>
      <button class="primary" id="toggleAddSlot" style="width:auto">+ הוספת זמן חלוקה</button>
    </div>
    <div class="card" id="addSlotCard" hidden>
      <h2>הוספת זמן חלוקה חדש</h2>
      ${slotFormHtml('new', {})}
      <div class="spacer"></div>
      <button class="primary big-action" id="addSlot" style="width:100%">הוספת זמן חלוקה</button>
      <div id="newSlotMsg"></div>
    </div>
    ${slots.length ? slots.map((s) => `
      <div class="card slot-card" style="border-inline-start-color:${esc(s.color)}">
        ${slotCompactRowHtml(s)}
        <div class="edit-panel" id="editPanel${s.id}" hidden>
          ${slotFormHtml('s' + s.id, s)}
          <div class="spacer"></div>
          <button class="primary big-action" data-save-slot="${s.id}" style="width:100%">שמירת שינויים</button>
          <div id="slotMsg${s.id}"></div>
        </div>
      </div>
    `).join('') : `<div class="card"><p class="hint">אין עדיין זמני חלוקה. הוסיפו אחד למעלה.</p></div>`}
  `;

  document.getElementById('toggleAddSlot').onclick = () => {
    const card = document.getElementById('addSlotCard');
    card.hidden = !card.hidden;
  };
  document.getElementById('newSuggest').onclick = () => {
    const date = document.getElementById('newDate').value;
    if (!date) return;
    api(`/admin/slots/suggest-day-label?date=${encodeURIComponent(date)}`).then((r) => {
      document.getElementById('newDayLabel').value = r.dayLabel;
    });
  };
  document.getElementById('addSlot').onclick = async () => {
    try {
      await api('/admin/slots', { method: 'POST', body: readSlotForm('new') });
      renderSlotsTab();
    } catch (err) {
      document.getElementById('newSlotMsg').innerHTML = `<div class="error">${err.message}</div>`;
    }
  };

  slots.forEach((s) => {
    const prefix = 's' + s.id;
    document.querySelector(`[data-toggle-slot="${s.id}"]`).onclick = () => {
      const panel = document.getElementById(`editPanel${s.id}`);
      panel.hidden = !panel.hidden;
    };
    document.getElementById(`${prefix}Suggest`).onclick = () => {
      const date = document.getElementById(`${prefix}Date`).value;
      if (!date) return;
      api(`/admin/slots/suggest-day-label?date=${encodeURIComponent(date)}`).then((r) => {
        document.getElementById(`${prefix}DayLabel`).value = r.dayLabel;
      });
    };
    document.querySelector(`[data-save-slot="${s.id}"]`).onclick = async () => {
      try {
        await api(`/admin/slots/${s.id}`, { method: 'PUT', body: readSlotForm(prefix) });
        document.getElementById(`slotMsg${s.id}`).innerHTML = `<div class="success">נשמר.</div>`;
        renderSlotsTab();
      } catch (err) {
        document.getElementById(`slotMsg${s.id}`).innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
  });
}

// ============== הזמנות ותשלומים ==============

function orderCardHtml(o) {
  return `
    <div class="card">
      <div class="order-row-header">
        <b>${esc(o.customerName)} · ${esc(o.phone)}</b>
        <span class="pill ${o.paymentStatus}">${STATUS_LABEL[o.paymentStatus]}</span>
      </div>
      <p class="hint">הזמנה מספר ${o.orderSequence} (מס' ${o.orderNumber}) · ${new Date(o.createdAt).toLocaleString('he-IL')}</p>
      ${o.notes ? `<div class="notice">הערות: ${esc(o.notes)}</div>` : ''}
      ${o.items.map((it) => `
        <div class="item-row">
          <span>${esc(it.slotName)} · ${GENDER_LABEL[it.gender]} × ${it.quantity}</span>
          <span class="meta">${it.quantityRedeemed}/${it.quantity} נמשך · ${money(it.lineTotal)}</span>
        </div>
      `).join('')}
      <div class="total-row"><span>סה"כ ${money(o.totalAmount)}</span><span class="meta" style="font-weight:400">שולם ${money(o.amountPaid)} · יתרה ${money(o.balanceDue)}</span></div>
      <details>
        <summary style="cursor:pointer;font-size:13px;color:var(--accent-ink);font-weight:700">רישום תשלום ידני</summary>
        <div class="row" style="margin-top:10px">
          <input type="number" min="0" placeholder="סכום" id="amt-${o.id}">
          <select id="method-${o.id}">
            <option value="manual_cash">מזומן</option>
            <option value="manual_card">אשראי ידני</option>
            <option value="manual_admin">אחר</option>
          </select>
          <button class="secondary" data-pay="${o.id}">רישום</button>
        </div>
      </details>
    </div>
  `;
}

async function renderOrdersTab() {
  const orders = await api('/admin/orders');
  document.getElementById('tabContent').innerHTML = `
    <div class="card">
      <h2>כל ההזמנות (${orders.length})</h2>
      <p class="hint">${orders.length} הזמנות · ${orders.filter((o) => o.paymentStatus === 'paid').length} שולמו במלואן</p>
      <label for="orderSearch">חיפוש לפי שם או טלפון</label>
      <input type="text" id="orderSearch" placeholder="הקלידו שם או מספר טלפון...">
    </div>
    <div id="ordersListWrap"></div>
  `;

  function renderList(list) {
    const wrap = document.getElementById('ordersListWrap');
    wrap.innerHTML = list.length
      ? list.map(orderCardHtml).join('')
      : `<div class="card"><p class="hint">לא נמצאו הזמנות תואמות לחיפוש.</p></div>`;
    wrap.querySelectorAll('[data-pay]').forEach((b) => {
      b.onclick = async () => {
        const id = b.dataset.pay;
        const amount = Number(document.getElementById(`amt-${id}`).value);
        const method = document.getElementById(`method-${id}`).value;
        try {
          await api(`/admin/orders/${id}/payments`, { method: 'POST', body: { amount, method } });
          renderOrdersTab();
        } catch (err) { alert(err.message); }
      };
    });
  }

  renderList(orders);
  document.getElementById('orderSearch').oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { renderList(orders); return; }
    renderList(orders.filter((o) => o.customerName.toLowerCase().includes(q) || o.phone.includes(q)));
  };
}

// ============== דשבורד ==============

async function renderDashboardTab() {
  const stats = await api('/admin/dashboard');
  document.getElementById('tabContent').innerHTML = `
    <div class="card">
      <h2>סה"כ שולם בפועל</h2>
      <div class="total-row"><span>סכום</span><span>${money(stats.totalPaid)}</span></div>
    </div>
    <div class="card">
      <h2>מוזמן מול נמשך</h2>
      <table>
        <thead><tr><th>זמן חלוקה</th><th>סוג</th><th>הוזמן</th><th>נמשך</th></tr></thead>
        <tbody>
          ${stats.bySlot.map((r) => `
            <tr><td>${esc(r.slotName)}</td><td>${GENDER_LABEL[r.gender]}</td><td>${r.ordered}</td><td>${r.redeemed}</td></tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ============== יומן פעולות ==============

const ACTION_LABELS = {
  order_created: 'הזמנה נוצרה',
  payment_recorded_manual: 'תשלום ידני נרשם',
  payment_received_nedarim: 'תשלום התקבל (נדרים פלוס)',
  redemption_confirmed: 'מימוש עופות',
  settings_updated: 'הגדרות עודכנו',
  slot_created: 'זמן חלוקה נוסף',
  slot_updated: 'זמן חלוקה עודכן',
  admin_created: 'מנהל נוסף',
  admin_updated: 'מנהל עודכן',
  admin_deleted: 'מנהל נמחק',
  admin_login: 'כניסת מנהל',
  hard_reset: 'איפוס קשיח',
};

function actionSummaryHtml(a) {
  const d = a.details || {};
  switch (a.actionType) {
    case 'order_created':
      return `${esc(d.customerName || '')} · ${esc(d.phone || '')} · הזמנה מס' ${d.orderNumber ?? ''} · ${money(d.totalAmount || 0)}`;
    case 'payment_recorded_manual':
      return `הזמנה #${d.orderId ?? ''} · ${money(d.amount || 0)} · ${esc(d.method || '')} · ע"י ${esc(d.recordedBy || '')}`;
    case 'payment_received_nedarim':
      return `${esc(d.phone || '')} · ${money(d.paidAmount || 0)} · עסקה ${esc(d.transactionId || '')}`;
    case 'redemption_confirmed':
      return `${esc(d.customerName || '')} · ${esc(d.slotName || '')} · ${d.maleQuantity || 0} זכרים + ${d.femaleQuantity || 0} נקבות · קוד ${esc(d.confirmationCode || '')}`;
    case 'settings_updated':
      return `שדות: ${esc((d.changedKeys || []).join(', '))}`;
    case 'slot_created':
    case 'slot_updated':
      return `${esc(d.name || '')}${d.active === false ? ' (לא פעיל)' : ''}`;
    case 'admin_created':
    case 'admin_updated':
      return `${esc(d.name || '')} · ${esc(d.phone || '')}`;
    case 'admin_deleted':
      return `${esc(d.name || '')} · ${esc(d.phone || '')}`;
    case 'admin_login':
      return `${esc(d.name || d.phone || '')} · ${d.method === 'otp' ? 'קוד סמס' : d.method === 'password_bootstrap' ? 'סיסמת בוטסטרפ' : 'סיסמה'}`;
    case 'hard_reset':
      return `בוצע ע"י ${esc(d.performedBy || '')}`;
    default:
      return esc(JSON.stringify(d));
  }
}

async function renderActionLogTab() {
  const actions = await api('/admin/action-log?limit=200');
  document.getElementById('tabContent').innerHTML = `
    <div class="card">
      <h2>יומן פעולות</h2>
      <p class="hint">200 הפעולות האחרונות במערכת, מהחדשה לישנה.</p>
    </div>
    <div class="card">
      <table class="compact-table">
        ${actions.length ? actions.map((a) => `
          <tr>
            <td style="white-space:nowrap;color:var(--ink-dim);font-size:12px">${new Date(a.createdAt).toLocaleString('he-IL')}</td>
            <td><b>${esc(ACTION_LABELS[a.actionType] || a.actionType)}</b><br><span class="meta">${actionSummaryHtml(a)}</span></td>
          </tr>
        `).join('') : `<tr><td class="hint">אין עדיין פעולות רשומות.</td></tr>`}
      </table>
    </div>
  `;
}

// ============== אתחול ==============

async function init() {
  const session = await api('/admin/session');
  if (session.isAdmin) loadShell(session);
  else screenLogin();
}
init().catch((err) => render(`<div class="error">שגיאה בטעינת המערכת: ${err.message}</div>`));
</script>
</body>
</html>
