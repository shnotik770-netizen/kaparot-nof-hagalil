<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול — כפרות נוף הגליל</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .wrap{max-width:760px}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
  .tabs button{white-space:nowrap;background:var(--surface);border:1.5px solid var(--line);color:var(--ink-dim)}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--ink-dim);font-size:12px}
  .row{display:flex;gap:10px;align-items:center}
  .row > *{flex:1}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .toggle-row:first-child{border-top:none}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px}
  legend{font-size:12.5px;font-weight:700;color:var(--ink-dim);padding:0 6px}
  .perm-checks{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}
  .perm-checks label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink);margin:0}
  .perm-checks input{width:auto}
  .slot-card{border-inline-start:5px solid var(--accent);position:relative}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .filter-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .filter-row > div{flex:1 1 130px;min-width:0}
  .filter-row label{font-size:11px;margin:0 0 3px}
  .filter-row select{font-size:13px;padding:9px 8px}
  .colorpick{display:flex;align-items:center;gap:8px}
  .colorpick input[type=color]{width:44px;height:38px;padding:2px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
  .inline-hint{font-size:12px;color:var(--ink-dim);margin:2px 0 0}
  .admin-card .row{margin-bottom:8px}
  .big-action{font-size:16.5px;padding:15px 18px}
  .compact-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .compact-row .swatch{width:16px;height:16px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .compact-row .compact-main{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:2px}
  .compact-row .compact-main b{font-size:14.5px}
  .compact-row .pill{white-space:nowrap}
  .edit-panel{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .compact-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .compact-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .compact-table tr:last-child td{border-bottom:none}
  .pending-payment-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
  .pending-payment-line .ghost{color:inherit;text-decoration:underline;font-size:12px;padding:2px 4px;width:auto}
  #redeemModeBtn{color:#fff;text-decoration:none;border:1.5px solid rgba(255,255,255,.5);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700}
  #redeemModeBtn.on{background:var(--sage);border-color:var(--sage)}
  .redeem-group-card{border-inline-start:5px solid var(--accent)}
  .redeem-group-card .warn-pill{background:var(--wine-soft);color:var(--wine);font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
  .tab-header-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:4px}
  .corner-actions{display:flex;gap:6px;flex-wrap:wrap}
  .mini-btn{font-size:12px;font-weight:700;padding:7px 11px;border-radius:20px;background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--line);cursor:pointer;width:auto}
  .mini-btn:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .fully-pill{background:var(--sage-soft);color:var(--sage);font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
  .agg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .agg-row:first-child{border-top:none}
  .agg-row .agg-label{flex:1 1 140px;min-width:0;font-size:13.5px;font-weight:700}
  .agg-row .agg-controls{display:flex;align-items:center;gap:8px}
  .agg-row .agg-controls input{width:64px;padding:8px}
</style>
</head>
<body>
<div class="topbar"><h1>🐔 ניהול כפרות</h1><span class="badge" id="whoBadge"></span></div>
<div class="wrap" id="app"><div class="loading">טוען…</div></div>

<script>
const GENDER_LABEL = { male: 'זכרים', female: 'נקבות' };
const STATUS_LABEL = { paid: 'שולם', partial: 'חלקי', unpaid: 'לא שולם' };
const METHOD_LABEL = { nedarim_plus: 'נדרים פלוס', manual_cash: 'מזומן', manual_card: 'אשראי ידני', manual_admin: 'אחר' };
// סדר המפתחות כאן קובע את סדר הטאבים בתפריט. 'settings' ו'slots' אוחדו
// לכפתור אחד (ראו renderSettingsTab) — עדיין שתי הרשאות נפרדות, אבל ניווט משותף.
const TAB_TITLES = { orders: 'הזמנות ותשלומים', dashboard: 'דשבורד', settings: 'הגדרות וזמני חלוקה', actionLog: 'יומן פעולות' };
// 'יומן פעולות' משתמש בהרשאת 'הגדרות' (אין לו הרשאה נפרדת משלו — כל מי שרואה הגדרות רואה גם את היומן)
const TAB_PERMISSION = { actionLog: 'settings' };

let currentTab = null;
let myPermissions = {};

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || 'שגיאה לא צפויה.'); err.data = data; throw err; }
  return data;
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function render(html) { document.getElementById('app').innerHTML = html; }
function money(n) { return `₪${Number(n).toLocaleString('he-IL', { maximumFractionDigits: 0 })}`; }
function esc(s) { return String(s ?? '').replace(/"/g, '&quot;'); }
// זהה ללוגיקת normalizePhone בשרת (src/lib/normalize.js) — לזיהוי לקוח קיים בצד הלקוח בלבד.
function normalizePhoneClient(phone) {
  let digits = String(phone || '').replace(/\D/g, '');
  if (digits.indexOf('972') === 0) digits = '0' + digits.substring(3);
  else if (digits.length === 9 && digits.charAt(0) !== '0') digits = '0' + digits;
  return digits;
}

function toDateInputValue(dateStr) {
  if (!dateStr) return '';
  return String(dateStr).slice(0, 10);
}
function toLocalDatetimeInputValue(isoString) {
  if (!isoString) return '';
  const d = new Date(isoString);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalDatetimeInputValue(value) {
  if (!value) return null;
  return new Date(value).toISOString();
}

// ============== כניסה ==============

function screenLogin(errorMsg, mode = 'password') {
  render(`
    <div class="card">
      <h2>כניסת מנהל</h2>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
      <div class="tabs">
        <button class="${mode === 'password' ? 'active' : ''}" id="tabPassword">סיסמה קבועה</button>
        <button class="${mode === 'otp' ? 'active' : ''}" id="tabOtp">קוד חד-פעמי בסמס</button>
      </div>
      <label for="phoneInput">מספר טלפון מנהל</label>
      <input type="tel" id="phoneInput" inputmode="numeric" placeholder="05XXXXXXXX">
      ${mode === 'password' ? `
        <label for="pwInput">סיסמה</label>
        <input type="password" id="pwInput">
        <div class="spacer"></div>
        <button class="primary" id="pwSubmit">כניסה</button>
      ` : `
        <div class="spacer"></div>
        <button class="primary" id="otpRequest">שליחת קוד</button>
        <div id="otpVerifyBlock" style="display:none">
          <label for="codeInput">קוד</label>
          <input type="text" id="codeInput" inputmode="numeric" maxlength="6">
          <div class="spacer"></div>
          <button class="primary" id="otpVerify">כניסה</button>
        </div>
      `}
    </div>
  `);
  document.getElementById('tabPassword').onclick = () => screenLogin(null, 'password');
  document.getElementById('tabOtp').onclick = () => screenLogin(null, 'otp');
  if (mode === 'password') {
    document.getElementById('pwSubmit').onclick = async () => {
      try {
        const phone = document.getElementById('phoneInput').value.trim();
        const res = await api('/admin/login-password', { method: 'POST', body: { phone, password: document.getElementById('pwInput').value } });
        loadShell(res);
      } catch (err) { screenLogin(err.message, 'password'); }
    };
  } else {
    document.getElementById('otpRequest').onclick = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      try {
        await api('/admin/otp/request', { method: 'POST', body: { phone } });
        document.getElementById('otpVerifyBlock').style.display = 'block';
      } catch (err) { screenLogin(err.message, 'otp'); }
    };
    document.getElementById('otpVerify').onclick = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      try {
        const res = await api('/admin/otp/verify', { method: 'POST', body: { phone, code } });
        loadShell(res);
      } catch (err) { screenLogin(err.message, 'otp'); }
    };
  }
}

// ============== מעטפת + טאבים ==============

function loadShell(session) {
  myPermissions = session.permissions || {};
  document.getElementById('whoBadge').innerHTML = `
    ${myPermissions.orders ? '<button class="ghost" id="redeemModeBtn">🎟️ מצב מימוש</button>' : ''}
    ${esc(session.name || '')} · <button class="ghost" id="logoutBtn" style="color:#fff">יציאה</button>
  `;
  const availableTabs = Object.keys(TAB_TITLES).filter((t) => (
    t === 'settings' ? (myPermissions.settings || myPermissions.slots) : myPermissions[TAB_PERMISSION[t] || t]
  ));
  if (!availableTabs.length) {
    render(`<div class="card"><div class="error">לחשבון זה אין הרשאה לאף מסך ניהול. פנה למנהל אחר להוספת הרשאות.</div></div>`);
    return;
  }
  render(`
    <div class="tabs">
      ${availableTabs.map((t) => `<button data-tab="${t}">${TAB_TITLES[t]}</button>`).join('')}
    </div>
    <div id="tabContent"><div class="loading">טוען…</div></div>
  `);
  document.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { redeemModeOn = false; document.getElementById('redeemModeBtn')?.classList.remove('on'); showTab(b.dataset.tab); }; });
  document.getElementById('logoutBtn').onclick = async () => { await api('/admin/logout', { method: 'POST' }); screenLogin(); };
  if (document.getElementById('redeemModeBtn')) document.getElementById('redeemModeBtn').onclick = toggleRedeemMode;
  showTab(currentTab && availableTabs.includes(currentTab) ? currentTab : availableTabs[0]);
}

// ============== מצב מימוש — חיפוש+מימוש מהיר, נגיש מכל טאב, לא לתשלומים ==============

let redeemModeOn = false;

function toggleRedeemMode() {
  redeemModeOn = !redeemModeOn;
  document.getElementById('redeemModeBtn').classList.toggle('on', redeemModeOn);
  const tabsEl = document.querySelector('.tabs');
  if (redeemModeOn) {
    if (tabsEl) tabsEl.style.display = 'none';
    renderRedeemModeScreen();
  } else {
    if (tabsEl) tabsEl.style.display = '';
    showTab(currentTab);
  }
}

function renderRedeemModeScreen() {
  const content = document.getElementById('tabContent');
  content.innerHTML = `
    <div class="card" style="background:var(--sage-soft);border-color:var(--sage)">
      <h2 style="margin:0 0 6px">🎟️ מצב מימוש מהיר</h2>
      <p class="hint" style="margin:0">חיפוש לפי טלפון ומימוש עופות בלבד — לא לתשלומים. לחזרה לניהול הרגיל: לחצו שוב על "מצב מימוש" למעלה.</p>
    </div>
    <label for="redeemSearchPhone">מספר טלפון</label>
    <input type="tel" id="redeemSearchPhone" inputmode="numeric" placeholder="05XXXXXXXX">
    <div id="redeemModeResult"></div>
  `;
  const input = document.getElementById('redeemSearchPhone');
  input.focus();
  let debounceTimer;
  const trigger = () => { clearTimeout(debounceTimer); loadRedeemModeCustomer(input.value.trim()); };
  input.oninput = () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(trigger, 450); };
  input.onkeydown = (e) => { if (e.key === 'Enter') trigger(); };
}

async function loadRedeemModeCustomer(phone) {
  const box = document.getElementById('redeemModeResult');
  if (!box) return;
  if (phone.replace(/\D/g, '').length < 9) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="loading">טוען…</div>`;
  let status;
  try {
    status = await api(`/admin/redeem/status?phone=${encodeURIComponent(phone)}`);
  } catch (err) {
    box.innerHTML = `<div class="error">${err.message}</div>`;
    return;
  }

  const groups = new Map();
  const addToGroup = (it, hasPaymentIssue) => {
    if (!groups.has(it.slotId)) {
      groups.set(it.slotId, { slotId: it.slotId, slotName: it.slotName, slotColor: it.slotColor, customerName: it.customerName, male: 0, female: 0, hasPaymentIssue: false });
    }
    const g = groups.get(it.slotId);
    g[it.gender] += it.remaining;
    if (hasPaymentIssue) g.hasPaymentIssue = true;
  };
  status.available.forEach((it) => addToGroup(it, false));
  status.blocked.filter((it) => it.reason === 'unpaid' || it.reason === 'partial').forEach((it) => addToGroup(it, true));

  if (!groups.size) {
    box.innerHTML = `<div class="card"><p class="hint">אין פריטים זמינים למימוש עבור מספר הטלפון הזה.</p></div>`;
    return;
  }

  const chosen = {};
  groups.forEach((g) => { chosen[g.slotId] = { male: 0, female: 0 }; });

  function genderLineHtml(g, gender) {
    if (g[gender] <= 0) return '';
    const label = gender === 'male' ? 'זכרים' : 'נקבות';
    return `
      <div class="gender-line">
        <span>${label} · נותרו ${g[gender]}</span>
        <div class="stepper">
          <button data-rmstep="-1" data-slot="${g.slotId}" data-gender="${gender}">−</button>
          <span id="rmqty-${g.slotId}-${gender}">0</span>
          <button data-rmstep="1" data-slot="${g.slotId}" data-gender="${gender}">+</button>
        </div>
        <button type="button" class="quick-all" data-rmall data-slot="${g.slotId}" data-gender="${gender}">הכל</button>
      </div>
    `;
  }

  box.innerHTML = `
    ${[...groups.values()].map((g) => `
      <div class="card redeem-group-card" style="border-inline-start-color:${esc(g.slotColor)}">
        <div class="order-row-header">
          <b>${esc(g.customerName || '')} · ${esc(g.slotName)}</b>
          ${g.hasPaymentIssue ? '<span class="warn-pill">⚠️ יש חוב</span>' : ''}
        </div>
        ${genderLineHtml(g, 'male')}
        ${genderLineHtml(g, 'female')}
        <div class="spacer"></div>
        <div id="rmmsg-${g.slotId}"></div>
        <button class="primary" data-rmconfirm="${g.slotId}">מימוש</button>
      </div>
    `).join('')}
  `;

  box.querySelectorAll('[data-rmstep]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      const delta = Number(b.dataset.rmstep);
      const cur = chosen[slotId][gender];
      chosen[slotId][gender] = Math.max(0, Math.min(g[gender], cur + delta));
      document.getElementById(`rmqty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  box.querySelectorAll('[data-rmall]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      chosen[slotId][gender] = g[gender];
      document.getElementById(`rmqty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  box.querySelectorAll('[data-rmconfirm]').forEach((b) => {
    b.onclick = () => {
      const slotId = Number(b.dataset.rmconfirm);
      const c = chosen[slotId];
      if (c.male <= 0 && c.female <= 0) return;
      attemptQuickRedeem(phone, slotId, c.male, c.female, false, `rmmsg-${slotId}`, () => loadRedeemModeCustomer(phone));
    };
  });
}

async function attemptQuickRedeem(phone, slotId, maleQuantity, femaleQuantity, allowUnpaid, msgElementId, onDone) {
  const msgBox = document.getElementById(msgElementId);
  try {
    const result = await api('/admin/redeem/confirm-slot', {
      method: 'POST',
      body: { phone, slotId, maleQuantity, femaleQuantity, allowUnpaid },
    });
    if (msgBox) msgBox.innerHTML = `<div class="success">מומש בהצלחה: ${result.maleQuantity} זכרים + ${result.femaleQuantity} נקבות מ"${esc(result.slotName)}".</div>`;
    if (onDone) onDone();
  } catch (err) {
    if (err.data?.paymentBlocked) {
      if (confirm(`${err.message}\nההזמנה לא שולמה (או שולמה חלקית). האם אתה בטוח שברצונך לממש בכל זאת?`)) {
        return attemptQuickRedeem(phone, slotId, maleQuantity, femaleQuantity, true, msgElementId, onDone);
      }
      return;
    }
    if (msgBox) msgBox.innerHTML = `<div class="error">${err.message}</div>`;
    else alert(err.message);
  }
}

function markActiveTab(tab) {
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
}

async function showTab(tab) {
  currentTab = tab;
  markActiveTab(tab);
  const content = document.getElementById('tabContent');
  content.innerHTML = '<div class="loading">טוען…</div>';
  if (tab === 'settings') return renderSettingsTab();
  if (tab === 'orders') return renderOrdersTab();
  if (tab === 'dashboard') return renderDashboardTab();
  if (tab === 'actionLog') return renderActionLogTab();
}

// ============== הגדרות ==============

async function renderSettingsTab() {
  const content = document.getElementById('tabContent');
  content.innerHTML = `<div id="settingsCore"></div><div id="slotsSubSection"></div>`;
  if (myPermissions.settings) await renderSettingsCore();
  if (myPermissions.slots) renderSlotsTab('slotsSubSection');
}

async function renderSettingsCore() {
  const s = await api('/admin/settings');
  const content = document.getElementById('settingsCore');
  content.innerHTML = `
    <div class="card">
      <h2>טקסטים ניתנים לעריכה</h2>
      <label>כותרת הטופס</label>
      <input type="text" id="orderTitle" value="${esc(s.orderTitle)}">
      <label>כותרת משנה (מוצגת מתחת לכותרת הראשית)</label>
      <input type="text" id="orderSubtitle" value="${esc(s.orderSubtitle)}">
      <label>הודעת "רישום סגור" (מוצגת גם כשאין זמן חלוקה פתוח, לא רק כשהרישום סגור ידנית)</label>
      <input type="text" id="closedRegMsg" value="${esc(s.closedRegistrationMessage)}">
      <label>הודעת "תשלום דחוי" (בסיום הרשמה)</label>
      <input type="text" id="deferredNotice" value="${esc(s.deferredPaymentNotice)}">
      <label>הודעת חסימה — לא שולם כלל</label>
      <input type="text" id="unpaidMsg" value="${esc(s.unpaidBlockMessage)}">
      <label>הודעת תשלום חלקי</label>
      <input type="text" id="partialMsg" value="${esc(s.partialPaymentNotice)}">
      <label>תבנית הודעת SMS לקוד אימות (חייבת להכיל {code})</label>
      <input type="text" id="otpTemplate" value="${esc(s.smsOtpTemplate)}">
      <div class="spacer"></div>
      <button class="primary" id="saveTexts">שמירת טקסטים</button>
    </div>

    <div class="card">
      <h2>חלונית הסבר במסך הראשי</h2>
      <p class="hint">מוצגת ללקוח בכניסה למערכת. השאירו כותרת ריקה כדי לבטל את הצגתה.</p>
      <label>כותרת</label>
      <input type="text" id="welcomeTitle" value="${esc(s.welcomeNoticeTitle)}">
      <label>תוכן</label>
      <textarea id="welcomeBody">${esc(s.welcomeNoticeBody)}</textarea>
      <div class="spacer"></div>
      <button class="primary" id="saveWelcome">שמירת חלונית ההסבר</button>
    </div>

    <div class="card admin-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h2 style="margin:0">ניהול מנהלים</h2>
        <button class="primary" id="toggleAddAdmin" style="width:auto">+ הוספת מנהל</button>
      </div>
      <p class="hint">כל מנהל נכנס עם הטלפון והסיסמה שלו, ורואה רק את הטאבים שסומנו לו כאן.</p>
      <div id="addAdminCard" hidden>
        <fieldset>
          <legend>הוספת מנהל חדש</legend>

          <label><input type="checkbox" data-perm="orders" data-id="${a.id}" ${a.permissions.orders ? 'checked' : ''}> הזמנות ותשלומים</label>

// "מימוש מהיר" על כרטיס לקוח סגור — אותה לוגיקה בדיוק כמו מסך "מצב מימוש"
// המלא (status + attemptQuickRedeem), רק שמוצג בתוך הכרטיס עצמו, ומאפשר גם
// "מימוש הכל" בלחיצה אחת על כל הפריטים הזמינים של הלקוח.
async function loadCustomerQuickRedeem(phone, containerId) {
  const box = document.getElementById(containerId);
  if (!box) return;
  box.innerHTML = `<div class="loading">טוען…</div>`;
  let status;
  try {
    status = await api(`/admin/redeem/status?phone=${encodeURIComponent(phone)}`);
  } catch (err) {
    box.innerHTML = `<div class="error">${err.message}</div>`;
    return;
  }

  const groups = new Map();
  const addToGroup = (it, hasPaymentIssue) => {
    if (!groups.has(it.slotId)) {
      groups.set(it.slotId, { slotId: it.slotId, slotName: it.slotName, slotColor: it.slotColor, male: 0, female: 0, hasPaymentIssue: false });
    }
    const g = groups.get(it.slotId);
    g[it.gender] += it.remaining;
    if (hasPaymentIssue) g.hasPaymentIssue = true;
  };
  status.available.forEach((it) => addToGroup(it, false));
  status.blocked.filter((it) => it.reason === 'unpaid' || it.reason === 'partial').forEach((it) => addToGroup(it, true));

  if (!groups.size) {
    box.innerHTML = `<p class="hint">אין פריטים זמינים למימוש עבור לקוח זה.</p>`;
    return;
  }

  const chosen = {};
  groups.forEach((g) => { chosen[g.slotId] = { male: 0, female: 0 }; });
  const prefix = containerId;

  function genderLineHtml(g, gender) {
    if (g[gender] <= 0) return '';
    const label = gender === 'male' ? 'זכרים' : 'נקבות';
    return `
      <div class="gender-line">
        <span>${label} · נותרו ${g[gender]}</span>
        <div class="stepper">
          <button type="button" data-cqstep="-1" data-slot="${g.slotId}" data-gender="${gender}">−</button>
          <span id="${prefix}-qty-${g.slotId}-${gender}">0</span>
          <button type="button" data-cqstep="1" data-slot="${g.slotId}" data-gender="${gender}">+</button>
        </div>
        <button type="button" class="quick-all" data-cqall data-slot="${g.slotId}" data-gender="${gender}">הכל</button>
      </div>
    `;
  }

  box.innerHTML = `
    ${groups.size > 1 ? `<button type="button" class="primary" style="margin-bottom:10px" id="${prefix}-redeemAll">מימוש הכל (כל הפריטים הזמינים)</button>` : ''}
    ${[...groups.values()].map((g) => `
      <div class="card redeem-group-card" style="border-inline-start-color:${esc(g.slotColor)}">
        <div class="order-row-header">
          <b>${esc(g.slotName)}</b>
          ${g.hasPaymentIssue ? '<span class="warn-pill">⚠️ יש חוב</span>' : ''}
        </div>
        ${genderLineHtml(g, 'male')}
        ${genderLineHtml(g, 'female')}
        <div class="spacer"></div>
        <div id="${prefix}-msg-${g.slotId}"></div>
        <button type="button" class="primary" data-cqconfirm="${g.slotId}">מימוש</button>
      </div>
    `).join('')}
  `;

  box.querySelectorAll('[data-cqstep]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      const delta = Number(b.dataset.cqstep);
      const cur = chosen[slotId][gender];
      chosen[slotId][gender] = Math.max(0, Math.min(g[gender], cur + delta));
      document.getElementById(`${prefix}-qty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  box.querySelectorAll('[data-cqall]').forEach((b) => {
    b.onclick = () => {
      const slotId = b.dataset.slot, gender = b.dataset.gender;
      const g = groups.get(Number(slotId));
      chosen[slotId][gender] = g[gender];
      document.getElementById(`${prefix}-qty-${slotId}-${gender}`).textContent = chosen[slotId][gender];
    };
  });
  box.querySelectorAll('[data-cqconfirm]').forEach((b) => {
    b.onclick = () => {
      const slotId = Number(b.dataset.cqconfirm);
      const c = chosen[slotId];
      if (c.male <= 0 && c.female <= 0) return;
      attemptQuickRedeem(phone, slotId, c.male, c.female, false, `${prefix}-msg-${slotId}`, () => refreshCustomerCard(phone, { keepRedeemOpen: true }));
    };
  });
  const allBtn = document.getElementById(`${prefix}-redeemAll`);
  if (allBtn) {
    allBtn.onclick = async () => {
      if (!confirm('לממש בבת אחת את כל הפריטים הזמינים עבור לקוח זה?')) return;
      for (const g of groups.values()) {
        if (g.male <= 0 && g.female <= 0) continue;
        await attemptQuickRedeem(phone, g.slotId, g.male, g.female, false, `${prefix}-msg-${g.slotId}`, null);
      }
      refreshCustomerCard(phone, { keepRedeemOpen: true });
    };
  }
}

// מקטין כמות מסוכמת (עריכת "עריכת כמויות"): מפרק את ההפחתה על פני שורות
// order_items אמיתיות (מהחדשה לישנה), בלי לרדת מתחת למה שכבר נמשך בפועל
// בכל שורה — כדי לשמר היסטוריה נכונה ולא "לשקר" retroactively על מה שנמשך.
async function shrinkAggregatedQuantity(c, slotId, gender, reduceBy) {
  const items = [];
  c.orders.forEach((o) => {
    o.items.forEach((it) => {
      if (it.slotId === slotId && it.gender === gender) items.push({ ...it, orderId: o.id });
    });
  });
  items.sort((a, b) => b.orderId - a.orderId);
  let remaining = reduceBy;
  for (const it of items) {
    if (remaining <= 0) break;
    const reducible = it.quantity - it.quantityRedeemed;
    if (reducible <= 0) continue;
    const take = Math.min(reducible, remaining);
    const newQty = it.quantity - take;
    if (newQty === 0) {
      await api(`/admin/orders/${it.orderId}/items/${it.id}`, { method: 'DELETE' });
    } else {
      await api(`/admin/orders/${it.orderId}/items/${it.id}`, { method: 'PUT', body: { quantity: newQty } });
    }
    remaining -= take;
  }
  if (remaining > 0) {
    throw new Error(`לא ניתן להקטין ב-${reduceBy} — חלק מהכמות כבר נמשך בפועל.`);
  }
}

async function wireCustomerPanel(c, refetch) {
  const pid = panelSafeId(c.phone);
  const panel = document.getElementById(pid);

  panel.querySelector(`[data-cpay-submit]`).onclick = async () => {
    const amount = Number(document.getElementById(`${pid}-amt`).value);
    const method = document.getElementById(`${pid}-method`).value;
    try {
      await api(`/admin/customers/${encodeURIComponent(c.phone)}/payments`, { method: 'POST', body: { amount, method } });
      refreshCustomerCard(c.phone, { keepEditOpen: true });
    } catch (err) {
      document.getElementById(`${pid}-msg`).innerHTML = `<div class="error">${err.message}</div>`;
    }
  };
  panel.querySelectorAll('[data-agg-save]').forEach((b) => {
    b.onclick = async () => {
      const [slotIdStr, gender] = b.dataset.aggSave.split(':');
      const slotId = Number(slotIdStr);
      const s = c.bySlot.find((x) => x.slotId === slotId);
      const currentQty = s ? s[gender] : 0;
      const redeemed = s ? s[`${gender}Redeemed`] : 0;
      const newQty = Number(document.getElementById(`${pid}-agg-${slotId}-${gender}`).value);
      if (!Number.isInteger(newQty) || newQty < 0) { alert('כמות לא תקינה.'); return; }
      if (newQty < redeemed) { alert(`לא ניתן להקטין מתחת ל-${redeemed} — כבר נמשך בפועל.`); return; }
      const delta = newQty - currentQty;
      if (delta === 0) return;
      try {
        if (delta > 0) {
          await api('/admin/orders', { method: 'POST', body: { phone: c.phone, items: [{ slotId, gender, quantity: delta }] } });
        } else {
          await shrinkAggregatedQuantity(c, slotId, gender, -delta);
        }
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) {
        document.getElementById(`${pid}-msg`).innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
  });
  let newlineQty = 1;
  const newlineQtyEl = document.getElementById(`${pid}-newline-qty`);
  panel.querySelectorAll('[data-newline-step]').forEach((b) => {
    b.onclick = () => {
      newlineQty = Math.max(1, newlineQty + Number(b.dataset.newlineStep));
      newlineQtyEl.textContent = newlineQty;
    };
  });
  const addLineBtn = panel.querySelector('[data-newline-add]');
  if (addLineBtn) {
    addLineBtn.onclick = async () => {
      const slotId = Number(document.getElementById(`${pid}-newline-slot`).value);
      const gender = document.getElementById(`${pid}-newline-gender`).value;
      try {
        await api('/admin/orders', { method: 'POST', body: { phone: c.phone, items: [{ slotId, gender, quantity: newlineQty }] } });
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) {
        document.getElementById(`${pid}-newline-msg`).innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
  }
  panel.querySelectorAll('[data-save-red]').forEach((b) => {
    b.onclick = async () => {
      const itemId = b.dataset.saveRed;
      const quantityRedeemed = Number(document.getElementById(`red-${itemId}`).value);
      if (c.balanceDue > 0 && !confirm(`ללקוח הזה יש חוב פתוח של ${money(c.balanceDue)} — ההזמנה לא שולמה במלואה. האם אתה בטוח שברצונך לממש בכל זאת?`)) {
        return;
      }
      try {
        await api(`/admin/order-items/${itemId}/redeemed`, { method: 'PUT', body: { quantityRedeemed } });
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) { alert(err.message); }
    };
  });
  panel.querySelectorAll('[data-cancel-red]').forEach((b) => {
    b.onclick = async () => {
      const itemId = b.dataset.cancelRed;
      if (!confirm('לבטל את המימוש של שורה זו? הכמות שנמשכה עבורה תאופס ל-0.')) return;
      try {
        await api(`/admin/order-items/${itemId}/redeemed`, { method: 'PUT', body: { quantityRedeemed: 0 } });
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) { alert(err.message); }
    };
  });
  panel.querySelectorAll('[data-del-item]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('למחוק את שורת ההזמנה הזו?')) return;

        await api(`/admin/orders/${orderId}/items/${itemId}`, { method: 'DELETE' });
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) { alert(err.message); }
    };
  });
  panel.querySelectorAll('[data-del-order]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('למחוק את כל ההזמנה? פעולה זו מוחקת לגמרי, כולל אם כבר שולם/נמשך משהו ממנה.')) return;

  const paymentsBox = document.getElementById(`${pid}-payments`);
  const allPayments = (await Promise.all(c.orders.map((o) => api(`/admin/orders/${o.id}/payments`)))).flat();
  allPayments.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  // עריכה/מחיקה זמינות רק לתשלומים שהוזנו ידנית (manual_*) — תשלומי נדרים
  // פלוס האמיתיים מוצגים לצפייה בלבד (ומעל זה חסומים גם בשרת).

              ${isManual ? `

  paymentsBox.querySelectorAll('[data-pay-edit]').forEach((b) => {

      const editBox = document.getElementById(`${pid}-payedit-${p.id}`);
      if (!editBox.hidden) { editBox.hidden = true; return; }
      editBox.hidden = false;
      editBox.innerHTML = `
        <div class="row">
          <input type="number" min="0" value="${p.amount}" id="${pid}-payamt-${p.id}">
          <select id="${pid}-paymethod-${p.id}">
            <option value="manual_cash" ${p.method === 'manual_cash' ? 'selected' : ''}>מזומן</option>
            <option value="manual_card" ${p.method === 'manual_card' ? 'selected' : ''}>אשראי ידני</option>
            <option value="manual_admin" ${p.method === 'manual_admin' ? 'selected' : ''}>אחר</option>
          </select>
          <button class="primary" type="button" data-pay-save="${p.id}">שמירה</button>
        </div>
        <div id="${pid}-paymsg-${p.id}"></div>
      `;
      editBox.querySelector('[data-pay-save]').onclick = async () => {
        const amount = Number(document.getElementById(`${pid}-payamt-${p.id}`).value);
        const method = document.getElementById(`${pid}-paymethod-${p.id}`).value;
        try {
          await api(`/admin/payments/${p.id}`, { method: 'PUT', body: { amount, method, note: p.note } });
          refreshCustomerCard(c.phone, { keepEditOpen: true });
        } catch (err) {
          document.getElementById(`${pid}-paymsg-${p.id}`).innerHTML = `<div class="error">${err.message}</div>`;
        }
      };

  });
  paymentsBox.querySelectorAll('[data-pay-del]').forEach((b) => {
    b.onclick = async () => {
      const p = allPayments.find((x) => x.id === Number(b.dataset.payDel));
      if (!confirm(`למחוק את התשלום הזה (${money(p.amount)})? פעולה זו סופית.`)) return;
      try {
        await api(`/admin/payments/${p.id}`, { method: 'DELETE' });
        refreshCustomerCard(c.phone, { keepEditOpen: true });
      } catch (err) { alert(err.message); }
    };
  });

// מחברת את שלושת הכפתורים ברמת הכרטיס (מימוש מהיר / עריכה / הסתרת התראת
// תשלום) בתוך root נתון — עובד גם על כל הרשימה (renderList) וגם על כרטיס
// בודד (refreshCustomerCard), כי כל כפתור נושא את data-phone של עצמו.
function wireCustomerCardButtons(root) {
  root.querySelectorAll('[data-cust-edit]').forEach((b) => {
    b.onclick = async () => {
      const phone = b.dataset.phone;
      const panel = document.getElementById(panelSafeId(phone));
      if (!panel.hidden) { panel.hidden = true; return; }
      const c = allCustomersCache.find((x) => x.phone === phone);
      panel.innerHTML = customerPanelHtml(c);
      panel.hidden = false;
      wireCustomerPanel(c);
    };
  });
  root.querySelectorAll('[data-cust-redeem]').forEach((b) => {
    b.onclick = () => {
      const phone = b.dataset.phone;
      const containerId = `${panelSafeId(phone)}-redeem`;
      const panel = document.getElementById(containerId);
      if (!panel.hidden) { panel.hidden = true; return; }
      panel.hidden = false;
      loadCustomerQuickRedeem(phone, containerId);
    };
  });
  root.querySelectorAll('[data-dismiss-pending]').forEach((b) => {
    b.onclick = async () => {
      try {
        await api(`/admin/payment-sessions/${encodeURIComponent(b.dataset.dismissPending)}/dismiss`, { method: 'POST' });
        refreshCustomerCard(b.dataset.phone);
      } catch (err) { alert(err.message); }
    };
  });
}

// מרעננת כרטיס לקוח בודד במקום (בלי לבנות מחדש את כל הרשימה ולקפוץ לראש
// הדף) — משמשת אחרי כל שמירה/מחיקה בתוך פאנל העריכה או פאנל המימוש המהיר.
async function refreshCustomerCard(phone, { keepEditOpen = false, keepRedeemOpen = false } = {}) {
  const customers = await api('/admin/customers');
  allCustomersCache = customers;
  const headerH2 = document.querySelector('.tab-header-row h2');
  const headerHint = document.querySelector('.tab-header-row .hint');
  if (headerH2) headerH2.textContent = `לקוחות (${customers.length})`;
  if (headerHint) headerHint.textContent = `${customers.length} לקוחות · ${customers.filter((x) => x.paymentStatus === 'paid').length} שולמו במלואם`;

  const c = customers.find((x) => x.phone === phone);
  const container = document.getElementById(`custcard-${panelSafeId(phone)}`);
  if (!container) { return renderOrdersTab(); }
  if (!c) { container.remove(); return; }

  container.innerHTML = customerCardHtml(c);
  wireCustomerCardButtons(container);
  if (keepEditOpen) {
    const panel = document.getElementById(panelSafeId(phone));
    panel.innerHTML = customerPanelHtml(c);
    panel.hidden = false;
    wireCustomerPanel(c);
  }
  if (keepRedeemOpen) {
    const redeemPanel = document.getElementById(`${panelSafeId(phone)}-redeem`);
    redeemPanel.hidden = false;
    loadCustomerQuickRedeem(phone, `${panelSafeId(phone)}-redeem`);
  }
}

        </div>
      </div>
      <label for="orderSearch">חיפוש לפי שם או טלפון</label>
      <input type="text" id="orderSearch" placeholder="הקלידו שם או מספר טלפון...">
      <div class="filter-row">
        <div>
          <label for="filterPaid">סטטוס תשלום</label>
          <select id="filterPaid">
            <option value="all">הכל</option>
            <option value="paid">שולם</option>
            <option value="partial">שולם חלקית</option>
            <option value="unpaid">לא שולם</option>
          </select>
        </div>
        <div>
          <label for="filterRedeemed">סטטוס מימוש</label>
          <select id="filterRedeemed">
            <option value="all">הכל</option>
            <option value="full">מומש במלואו</option>
            <option value="partial">לא מומש במלואו</option>
          </select>
        </div>
        <div>
          <label for="filterSlot">זמן חלוקה</label>
          <select id="filterSlot">
            <option value="all">כל הזמנים</option>
            ${slots.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div id="bulkSmsCard" hidden style="margin-top:10px">
        <label for="bulkSmsText">תוכן ההודעה</label>
        <textarea id="bulkSmsText" placeholder="ההודעה שתישלח לכל מי שמופיע ברשימה המסוננת כרגע..."></textarea>
        <div class="spacer"></div>
        <button class="primary big-action" id="bulkSmsSend" style="width:100%">שליחה</button>
        <div id="bulkSmsMsg"></div>
      </div>
      <div id="addOrderCard" hidden style="margin-top:10px">
        <label for="newOrderPhone">טלפון</label>
        <input type="tel" id="newOrderPhone" inputmode="numeric" placeholder="05XXXXXXXX">
        <div id="newOrderCustomerIndicator"></div>
        <label for="newOrderName">שם הלקוח (נדרש רק ללקוח חדש — ללקוח קיים יישמר השם הקיים)</label>
        <input type="text" id="newOrderName">
        <label for="newOrderNotes">הערות (אופציונלי)</label>
        <textarea id="newOrderNotes"></textarea>
        <label>פריטים</label>
        <div id="newOrderItems"></div>
        <button class="secondary" type="button" id="newOrderAddItem">+ הוספת פריט</button>
        <div class="total-row"><span>סה"כ</span><span id="newOrderTotal">₪0</span></div>
        <button class="primary big-action" id="newOrderSubmit" style="width:100%">יצירת הזמנה</button>
        <div id="newOrderMsg"></div>
      </div>
    </div>
    <div id="ordersListWrap"></div>
  `;

  let currentFiltered = customers;

  function applyFilters() {
    const q = document.getElementById('orderSearch').value.trim().toLowerCase();
    const paidFilter = document.getElementById('filterPaid').value;
    const redeemedFilter = document.getElementById('filterRedeemed').value;
    const slotFilter = document.getElementById('filterSlot').value;
    currentFiltered = customers.filter((c) => {
      if (q && !c.customerName.toLowerCase().includes(q) && !c.phone.includes(q)) return false;
      if (paidFilter !== 'all' && c.paymentStatus !== paidFilter) return false;
      if (redeemedFilter === 'full' && !c.fullyRedeemed) return false;
      if (redeemedFilter === 'partial' && c.fullyRedeemed) return false;
      if (slotFilter !== 'all' && !c.bySlot.some((s) => String(s.slotId) === slotFilter)) return false;
      return true;
    });
    renderList(currentFiltered);
  }

  function renderList(list) {
    const wrap = document.getElementById('ordersListWrap');
    wrap.innerHTML = list.length
      ? list.map((c) => `<div id="custcard-${panelSafeId(c.phone)}">${customerCardHtml(c)}</div>`).join('')
      : `<div class="card"><p class="hint">לא נמצאו לקוחות תואמים.</p></div>`;
    wireCustomerCardButtons(wrap);
  }

  document.getElementById('orderSearch').oninput = applyFilters;
  document.getElementById('filterPaid').onchange = applyFilters;
  document.getElementById('filterRedeemed').onchange = applyFilters;
  document.getElementById('filterSlot').onchange = applyFilters;

  document.getElementById('toggleBulkSms').onclick = () => {
    const card = document.getElementById('bulkSmsCard');
    card.hidden = !card.hidden;
  };
  document.getElementById('bulkSmsSend').onclick = async () => {
    const message = document.getElementById('bulkSmsText').value.trim();
    if (!message) return;
    if (!confirm(`לשלוח את ההודעה ל-${currentFiltered.length} לקוחות מסוננים?`)) return;
    try {
      const result = await api('/admin/sms/bulk', { method: 'POST', body: { phones: currentFiltered.map((c) => c.phone), message } });
      document.getElementById('bulkSmsMsg').innerHTML = `<div class="success">נשלח ל-${result.recipientCount ?? currentFiltered.length} נמענים.</div>`;
    } catch (err) {
      document.getElementById('bulkSmsMsg').innerHTML = `<div class="error">${err.message}</div>`;
    }
  };

  document.getElementById('exportCsvBtn').onclick = async () => {
    const payments = await api('/admin/payments');
    const header = ['תאריך', 'הזמנה מס\'', 'שם לקוח', 'טלפון', 'סכום', 'אמצעי', 'נרשם ע"י'];
    const rows = payments.map((p) => [
      new Date(p.createdAt).toLocaleString('he-IL'), p.orderNumber, p.customerName, p.phone,
      p.amount, METHOD_LABEL[p.method] || p.method, p.recordedBy,
    ]);
    const csv = '﻿' + [header, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `דוח-תשלומים-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  // ---- הוספת הזמנה ידנית ----
  document.getElementById('toggleAddOrder').onclick = () => {
    const card = document.getElementById('addOrderCard');
    card.hidden = !card.hidden;
  };
  document.getElementById('newOrderPhone').oninput = () => {
    const nameInput = document.getElementById('newOrderName');
    const indicator = document.getElementById('newOrderCustomerIndicator');
    const normalized = normalizePhoneClient(document.getElementById('newOrderPhone').value);
    const match = normalized.length >= 9 ? allCustomersCache.find((c) => normalizePhoneClient(c.phone) === normalized) : null;
    if (match) {
      indicator.innerHTML = `<div class="notice">✅ מעדכן הזמנה קיימת עבור לקוח זה: <b>${esc(match.customerName)}</b></div>`;
      nameInput.value = match.customerName;
      nameInput.disabled = true;
    } else {
      indicator.innerHTML = '';
      nameInput.disabled = false;
    }
  };
  let newOrderItems = [];
  function newOrderPriceFor(item) {
    const slot = slots.find((s) => s.id === item.slotId);
    if (!slot) return 0;
    return item.gender === 'female' ? slot.priceFemale : slot.priceMale;
  }
  function renderNewOrderItems() {
    const box = document.getElementById('newOrderItems');
    box.innerHTML = newOrderItems.map((item, idx) => `
      <div class="item-select-row" data-idx="${idx}">
        ${newOrderItems.length > 1 ? `<button type="button" class="remove-item" data-remove-new-item="${idx}">✕ הסר</button>` : ''}
        <div class="cols2">
          <div>
            <label>זמן חלוקה</label>
            <select data-new-field="slotId" data-idx="${idx}">
              ${slots.map((s) => `<option value="${s.id}" ${item.slotId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>סוג</label>
            <select data-new-field="gender" data-idx="${idx}">
              <option value="male" ${item.gender === 'male' ? 'selected' : ''}>זכרים</option>
              <option value="female" ${item.gender === 'female' ? 'selected' : ''}>נקבות</option>
            </select>
          </div>
        </div>
        <label>כמות</label>
        <div class="stepper">
          <button type="button" data-new-step="-1" data-idx="${idx}">−</button>
          <span>${item.quantity}</span>
          <button type="button" data-new-step="1" data-idx="${idx}">+</button>
        </div>
      </div>
    `).join('');
    const total = newOrderItems.reduce((sum, it) => sum + newOrderPriceFor(it) * it.quantity, 0);
    document.getElementById('newOrderTotal').textContent = money(total);
    box.querySelectorAll('select').forEach((sel) => {
      sel.onchange = () => {
        const idx = Number(sel.dataset.idx);
        const value = sel.dataset.newField === 'slotId' ? Number(sel.value) : sel.value;
        newOrderItems[idx][sel.dataset.newField] = value;
        renderNewOrderItems();
      };
    });
    box.querySelectorAll('[data-new-step]').forEach((b) => {
      b.onclick = () => {
        const idx = Number(b.dataset.idx);
        newOrderItems[idx].quantity = Math.max(1, newOrderItems[idx].quantity + Number(b.dataset.newStep));
        renderNewOrderItems();
      };
    });
    box.querySelectorAll('[data-remove-new-item]').forEach((b) => {
      b.onclick = () => {
        newOrderItems.splice(Number(b.dataset.removeNewItem), 1);
        renderNewOrderItems();
      };
    });
  }
  if (slots.length) {
    newOrderItems = [{ slotId: slots[0].id, gender: 'male', quantity: 1 }];
    renderNewOrderItems();
  }
  document.getElementById('newOrderAddItem').onclick = () => {
    if (!slots.length) return;
    newOrderItems.push({ slotId: slots[0].id, gender: 'male', quantity: 1 });
    renderNewOrderItems();
  };
  document.getElementById('newOrderSubmit').onclick = async () => {
    try {
      await api('/admin/orders', { method: 'POST', body: {
        phone: document.getElementById('newOrderPhone').value,
        customerName: document.getElementById('newOrderName').value,
        notes: document.getElementById('newOrderNotes').value,
        items: newOrderItems,
      }});
      renderOrdersTab();
    } catch (err) {
      document.getElementById('newOrderMsg').innerHTML = `<div class="error">${err.message}</div>`;
    }
  };

  renderList(customers);
}

// ============== דשבורד ==============

  const stats = await api('/admin/dashboard');
  document.getElementById('tabContent').innerHTML = `
    <div class="card">
      <h2>סה"כ שולם בפועל</h2>
      <div class="total-row"><span>סכום</span><span>${money(stats.totalPaid)}</span></div>
    </div>
    <div class="card">
      <h2>מוזמן מול נמשך</h2>
      <table>
        <thead><tr><th>זמן חלוקה</th><th>סוג</th><th>הוזמן</th><th>נמשך</th></tr></thead>
        <tbody>
          ${stats.bySlot.map((r) => `
            <tr><td>${esc(r.slotName)}</td><td>${GENDER_LABEL[r.gender]}</td><td>${r.ordered}</td><td>${r.redeemed}</td></tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ============== יומן פעולות ==============

const ACTION_LABELS = {
  order_created: 'הזמנה נוצרה',
  payment_recorded_manual: 'תשלום ידני נרשם',
  payment_edited: 'תשלום ידני נערך',
  payment_deleted: 'תשלום ידני נמחק',
  payment_received_nedarim: 'תשלום התקבל (נדרים פלוס, Webhook)',
  payment_client_confirmed: 'תשלום אושר לפי הדפדפן (טרם אומת Webhook)',
  redemption_confirmed: 'מימוש עופות',
  redemption_manual_override: 'מימוש עודכן ידנית ע"י מנהל',
  order_item_edited: 'שורת הזמנה עודכנה',
  order_item_deleted: 'שורת הזמנה נמחקה',
  order_deleted: 'הזמנה נמחקה',
  sms_bulk_sent: 'סמס קבוצתי נשלח',
  payment_alert_dismissed: 'אזהרת תשלום לא-מאושר הוסתרה',
  settings_updated: 'הגדרות עודכנו',
  slot_created: 'זמן חלוקה נוסף',
  slot_updated: 'זמן חלוקה עודכן',
  slot_deleted: 'זמן חלוקה נמחק',
  admin_created: 'מנהל נוסף',
  admin_updated: 'מנהל עודכן',
  admin_deleted: 'מנהל נמחק',
  admin_login: 'כניסת מנהל',
  hard_reset: 'איפוס קשיח',
};

function actionSummaryHtml(a) {
  const d = a.details || {};
  switch (a.actionType) {
    case 'order_created':
      return `${esc(d.customerName || '')} · ${esc(d.phone || '')} · הזמנה מס' ${d.orderNumber ?? ''} · ${money(d.totalAmount || 0)}`;
    case 'payment_recorded_manual':
      return d.orderId != null
        ? `הזמנה #${d.orderId} · ${money(d.amount || 0)} · ${esc(d.method || '')} · ע"י ${esc(d.recordedBy || '')}`
        : `${esc(d.phone || '')} · ${money(d.amount || 0)} · ${esc(d.method || '')} · ע"י ${esc(d.recordedBy || '')}`;
    case 'payment_edited':
      return `הזמנה #${d.orderId ?? ''} · ${money(d.oldAmount || 0)} (${esc(d.oldMethod || '')}) → ${money(d.newAmount || 0)} (${esc(d.newMethod || '')}) · ע"י ${esc(d.adminName || '')}`;
    case 'payment_deleted':
      return `הזמנה #${d.orderId ?? ''} · ${money(d.amount || 0)} · ${esc(d.method || '')} · ע"י ${esc(d.adminName || '')}`;
    case 'payment_received_nedarim':
      return `${esc(d.phone || '')} · ${money(d.paidAmount || 0)} · עסקה ${esc(d.transactionId || '')}`;
    case 'payment_client_confirmed':
      return `${esc(d.phone || '')} · ${money(d.amount || 0)} · עסקה ${esc(d.transactionId || '')}`;
    case 'redemption_manual_override':
      return `שורה #${d.itemId ?? ''} · ${d.oldQuantityRedeemed ?? 0} → ${d.newQuantityRedeemed ?? 0} · ע"י ${esc(d.adminName || '')}`;
    case 'order_item_edited':
      return `הזמנה #${d.orderId ?? ''} · כמות ${d.oldQuantity ?? ''} → ${d.newQuantity ?? ''} · ע"י ${esc(d.adminName || '')}`;
    case 'order_item_deleted':
      return `הזמנה #${d.orderId ?? ''} · ${esc(d.gender === 'female' ? 'נקבות' : 'זכרים')} × ${d.quantity ?? ''} · ע"י ${esc(d.adminName || '')}`;
    case 'order_deleted':
      return `הזמנה #${d.orderId ?? ''} (מס' ${d.orderNumber ?? ''}) · ${esc(d.customerName || '')} · ע"י ${esc(d.adminName || '')}`;
    case 'sms_bulk_sent':
      return `${d.recipientCount ?? 0} נמענים · ע"י ${esc(d.sentBy || '')}`;
    case 'payment_alert_dismissed':
      return `${esc(d.phone || '')} · ${money(d.amount || 0)} · ע"י ${esc(d.adminName || '')}`;
    case 'redemption_confirmed':
      return `${esc(d.customerName || '')} · ${esc(d.slotName || '')} · ${d.maleQuantity || 0} זכרים + ${d.femaleQuantity || 0} נקבות · קוד ${esc(d.confirmationCode || '')}`;
    case 'settings_updated':
      return `שדות: ${esc((d.changedKeys || []).join(', '))}`;
    case 'slot_created':
    case 'slot_updated':
      return esc(d.name || '');
    case 'slot_deleted':
      return `${esc(d.name || '')} (נמחק לגמרי)`;
    case 'admin_created':
    case 'admin_updated':
      return `${esc(d.name || '')} · ${esc(d.phone || '')}`;
    case 'admin_deleted':
      return `${esc(d.name || '')} · ${esc(d.phone || '')}`;
    case 'admin_login':
      return `${esc(d.name || d.phone || '')} · ${d.method === 'otp' ? 'קוד סמס' : d.method === 'password_bootstrap' ? 'סיסמת בוטסטרפ' : 'סיסמה'}`;
    case 'hard_reset':
      return `בוצע ע"י ${esc(d.performedBy || '')}`;
    default:
      return esc(JSON.stringify(d));
  }
}

async function renderActionLogTab() {
  const actions = await api('/admin/action-log?limit=200');
  document.getElementById('tabContent').innerHTML = `
    <div class="card">
      <h2>יומן פעולות</h2>
      <p class="hint">200 הפעולות האחרונות במערכת, מהחדשה לישנה.</p>
    </div>
    <div class="card">
      <table class="compact-table">
        ${actions.length ? actions.map((a) => `
          <tr>
            <td style="white-space:nowrap;color:var(--ink-dim);font-size:12px">${new Date(a.createdAt).toLocaleString('he-IL')}</td>
            <td><b>${esc(ACTION_LABELS[a.actionType] || a.actionType)}</b><br><span class="meta">${actionSummaryHtml(a)}</span></td>
          </tr>
        `).join('') : `<tr><td class="hint">אין עדיין פעולות רשומות.</td></tr>`}
      </table>
    </div>
  `;
}

// ============== אתחול ==============

async function init() {
  const session = await api('/admin/session');
  if (session.isAdmin) loadShell(session);
  else screenLogin();
}
init().catch((err) => render(`<div class="error">שגיאה בטעינת המערכת: ${err.message}</div>`));
</script>
